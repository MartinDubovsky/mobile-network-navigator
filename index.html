function ndNameScore(l,n){if(ndNorm(l.id)===n)return 3;if(ndNorm(l.n)===n)return 2;
 const base=l.n.replace(/\s*\(.*?\)/g,'').replace(/\s+UP$/,'');return [base,...base.split(/\s*\/\s*/)].some(x=>ndNorm(x)===n)?1:0;}
function ndResolveIf(v,el){const raw=String(v==null?'':v).trim();if(!raw)return '';const lc=raw.toLowerCase();if(ND_PSEUDO[lc])return lc;
 const n=ndNorm(raw);const cand=LINKS.map(l=>({l,sc:ndNameScore(l,n)})).filter(x=>x.sc);if(!cand.length)return ND_VALID_IF.has(lc)?lc:raw;
 const rank=x=>x.sc*10+(x.l.cups||x.l.rp||ND_CANON[x.l.id]?0:2)+(x.l.rp?0:1);
 const best=xs=>xs.slice().sort((a,b)=>rank(b)-rank(a))[0].l;
 if(el){const att=cand.filter(x=>ndAttached(x.l,el));if(att.length)return ndCanon(best(att));}
 return ndCanon(best(cand));}
function ndIfLabel(k){if(LM[k])return LM[k].n;return ND_PSEUDO[k]||k;}
function ndElIfs(el){const out=[],seen=new Set();
 LINKS.forEach(l=>{if(l.isbus||!ndAttached(l,el))return;const k=ndCanon(l);if(seen.has(k))return;seen.add(k);
  const me=ndGroup(el).find(x=>x===l.a||x===l.b);out.push({k,label:l.bus?'SBI (HTTP/2)':l.n+' ↔ '+(l.a===l.b?'peer '+EM[me].n:peerName(l,me))});});
 Object.keys(ND_PSEUDO).forEach(k=>{if(!seen.has(k))out.push({k,label:ND_PSEUDO[k]});});return out;}
function ndElKeys(el){const s=new Set(Object.keys(ND_PSEUDO));LINKS.forEach(l=>{if(!l.isbus&&ndAttached(l,el))ndKeys(l).forEach(k=>s.add(k));});return s;}

/* ---------- address validation ---------- */
const ND_V4=/^(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}(\/(3[0-2]|[12]?\d))?$/;
function ndIsV6(s){const i=s.indexOf('/');const a=i<0?s:s.slice(0,i),p=i<0?null:s.slice(i+1);if(p!=null&&(!/^\d{1,3}$/.test(p)||+p>128))return false;
 if(!a.includes(':')||!/^[0-9a-f:.]+$/i.test(a))return false;try{new URL('http://['+a+']/');return true;}catch(e){return false;}}
const ND_FQDN=/^(?=.{1,253}\.?$)[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+\.?$/i;
/* "10.2.7.0/26" is a subnet (host bits zero); "10.2.7.2/26" is the address 10.2.7.2 written with its prefix length */
function ndV6groups(a){if(a.includes('.')){const i=a.lastIndexOf(':'),v4=a.slice(i+1);if(!ND_V4.test(v4)||v4.includes('/'))return null;const n=ndV4int(v4);a=a.slice(0,i+1)+Math.floor(n/65536).toString(16)+':'+(n%65536).toString(16);}
 const dc=a.split('::');if(dc.length>2)return null;const head=dc[0]?dc[0].split(':'):[],tail=dc.length===2&&dc[1]?dc[1].split(':'):[];const fill=8-head.length-tail.length;
 if((dc.length===1&&fill!==0)||(dc.length===2&&fill<1))return null;return [...head,...Array(dc.length===2?fill:0).fill('0'),...tail].map(x=>parseInt(x||'0',16));}
function ndHostZero(ip){const [a,p]=ip.split('/');const n=+p;
 if(a.includes(':')){const g=ndV6groups(a);if(!g)return true;for(let i=0;i<8;i++){const st=i*16;if(st+16<=n)continue;const k=Math.max(n-st,0);if(g[i]&((1<<(16-k))-1))return false;}return true;}
 return ndV4int(a)%Math.pow(2,32-n)===0;}
const ndAddrOnly=ip=>String(ip).split('/')[0].toLowerCase();
function ndAddrKind(ip){if(!ip)return 'empty';if(ND_V4.test(ip))return ip.includes('/')?(ndHostZero(ip)?'v4net':'v4host'):'v4';if(ndIsV6(ip))return ip.includes('/')?(ndHostZero(ip)?'v6net':'v6host'):'v6';if(!/^[\d.\/]+$/.test(ip)&&ND_FQDN.test(ip))return 'fqdn';return 'bad';}
const ndV4int=ip=>ip.split('.').reduce((a,b)=>a*256+(+b),0);
function ndV4in(ip,net){const [n,p]=net.split('/');const size=Math.pow(2,32-(+p));const base=Math.floor(ndV4int(n)/size)*size;const x=ndV4int(ip);return x>=base&&x<base+size;}
const ND_V4PLAIN=/^\d{1,3}(\.\d{1,3}){3}$/;
/* ports: one value, a list (8080;443 – separated by ; , / | or spaces) or ranges (30000-30100) */
function ndPortParse(v){const t=(Array.isArray(v)?v.join(';'):String(v==null?'':v)).trim();if(!t)return {ok:true,list:[]};const list=[];let ok=true;
 t.split(/[\s,;\/|]+/).filter(Boolean).forEach(p=>{const m=p.match(/^(\d{1,5})(?:-(\d{1,5}))?$/);if(!m){ok=false;return;}const a=+m[1],b=m[2]==null?a:+m[2];
  if(a<1||b>65535||b<a){ok=false;return;}list.push(m[2]==null?String(a):a+'-'+b);});
 return {ok,list};}
const ndPortOK=v=>ndPortParse(v).ok;
const ndPortNorm=v=>{const r=ndPortParse(v);return r.ok?r.list.join(';'):(Array.isArray(v)?v.join(';'):String(v==null?'':v)).trim();};
const ndPortShow=v=>{const r=ndPortParse(v);return r.ok?r.list.join(', '):String(v);};
const ND_PORTMSG='use one port, a list such as 8080;443 or a range such as 30000-30100';

/* ---------- normalisation, validation, merge ---------- */
function ndEmpty(name){return {network:name||'Unnamed network',instances:[],interfaces:{}};}
function ndClean(raw){const w=[];const d=ndEmpty(String(raw.network||raw.name||'').trim());
 if(raw.format&&raw.format!==ND_FORMAT)w.push(`Unexpected format “${raw.format}” – read as network data anyway.`);
 (Array.isArray(raw.instances)?raw.instances:[]).forEach((I,ix)=>{const el=ndResolveEl(I.element);
  if(!el){w.push(`Instance ${ix+1} “${I.name||I.instance||''}”: unknown element “${I.element}” – skipped.`);return;}
  const inst={id:NDuid(),element:el,name:String(I.name||I.instance||'(unnamed)').trim(),site:String(I.site||'').trim(),note:String(I.note||'').trim(),addresses:[]};
  (Array.isArray(I.addresses)?I.addresses:[]).forEach(A=>inst.addresses.push({interface:ndResolveIf(A.interface||A.if||'',el),ip:String(A.ip||A.address||'').trim(),port:A.port==null?'':ndPortNorm(A.port),vlan:A.vlan==null?'':String(A.vlan).trim(),note:String(A.note||'').trim()}));
  d.instances.push(inst);});
 const ifs=raw.interfaces&&typeof raw.interfaces==='object'?raw.interfaces:{};
 Object.keys(ifs).forEach(k=>{const v=ifs[k]||{};d.interfaces[ndResolveIf(k,null)]={subnet:String(v.subnet||v.ip||'').trim(),vlan:v.vlan==null?'':String(v.vlan).trim(),note:String(v.note||'').trim()};});
 return {d,w:w.concat(ndValidate(d))};}
function ndValidate(d){const w=[],seen={};
 d.instances.forEach(I=>{const E=EM[I.element];const ok=ndElKeys(I.element);
  I.addresses.forEach(A=>{const where=`${E.n} ${I.name}${A.interface?' · '+ndIfLabel(A.interface):''}`;
   if(!A.interface)w.push(`${where}: no interface given.`);
   else if(!ND_VALID_IF.has(A.interface))w.push(`${where}: unknown interface “${A.interface}” (kept).`);
   else if(!ok.has(A.interface))w.push(`${where}: ${ndIfLabel(A.interface)} is not an interface of ${E.n} in this tool (kept).`);
   const k=ndAddrKind(A.ip);if(k==='bad')w.push(`${where}: “${A.ip}” is not a valid IPv4 / IPv6 address, subnet or host name.`);
   if(A.port&&!ndPortOK(A.port))w.push(`${where}: port “${A.port}” is not valid – ${ND_PORTMSG}.`);
   if(['v4','v6','v4host','v6host'].includes(k)){const key=ndAddrOnly(A.ip);(seen[key]=seen[key]||new Set()).add(E.n+' '+I.name);}});});
 Object.entries(d.interfaces).forEach(([k,v])=>{if(!ND_VALID_IF.has(k))w.push(`Interface info: unknown interface “${k}” (kept).`);if(v.subnet&&ndAddrKind(v.subnet)==='bad')w.push(`Interface info ${ndIfLabel(k)}: “${v.subnet}” is not a valid subnet.`);});
 Object.entries(seen).forEach(([ip,s])=>{if(s.size>1)w.push(`Address ${ip} is used by several instances: ${[...s].join(', ')}.`);});
 return w;}
function ndCopy(I){return {...I,id:NDuid(),addresses:I.addresses.map(A=>({...A}))};}
function ndMerge(base,add){const out={network:base.network,instances:base.instances.map(ndCopy),interfaces:{...base.interfaces}};
 if(!out.network||out.network==='Unnamed network')out.network=add.network;
 add.instances.forEach(I=>{const t=out.instances.find(x=>x.element===I.element&&x.name.toLowerCase()===I.name.toLowerCase());
  if(!t){out.instances.push(ndCopy(I));return;}
  if(I.site)t.site=I.site;if(I.note)t.note=I.note;
  I.addresses.forEach(A=>{if(!t.addresses.some(B=>B.interface===A.interface&&B.ip===A.ip&&B.port===A.port))t.addresses.push({...A});});});
 Object.assign(out.interfaces,add.interfaces);return out;}

/* ---------- CSV ---------- */
const ND_COLS={element:['element','el','elementtype','nodetype','networkelement','type'],instance:['instance','name','node','nodename','hostname','host'],site:['site','location'],
 interface:['interface','if','referencepoint','refpoint'],ip:['ip','address','ipaddress','addr','ipsubnet','subnet','prefix'],port:['port','ports'],vlan:['vlan','vlanid'],note:['note','notes','comment','comments','description','remark'],network:['network']};
function ndParseCSV(text){text=text.replace(/^﻿/,'');
 const first=(text.split(/\r?\n/).find(l=>l.trim()&&!l.trim().startsWith('#'))||'');const cnt=ch=>first.split(ch).length-1;
 const dl=cnt('\t')>cnt(',')&&cnt('\t')>cnt(';')?'\t':(cnt(';')>cnt(',')?';':',');
 const rows=[];let row=[],f='',q=false;
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
  else if(c==='"'&&f==='')q=true;else if(c===dl){row.push(f);f='';}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}else f+=c;}
 if(f!==''||row.length){row.push(f);rows.push(row);}
 let hdr=null,network=null;const raw={network:null,instances:[],interfaces:{}},w=[],map={};
 rows.forEach((r,ri)=>{const line=ri+1;const c0=String(r[0]||'').trim();
  if(c0.startsWith('#')){const m=r.join(dl).match(/^\s*#\s*network\s*:\s*(.+?)\s*$/i);if(m&&!network)network=m[1].replace(/[,;\t]+$/,'').trim();return;}
  if(r.every(x=>!String(x).trim()))return;
  if(!hdr){const h={};r.forEach((x,i)=>{const n=ndNorm(x);Object.entries(ND_COLS).forEach(([k,al])=>{if(h[k]==null&&al.includes(n))h[k]=i;});});
   if(h.element==null||h.ip==null){w.push('No header row found – the first row must name the columns (at least element and ip).');hdr={bad:1};return;}hdr=h;return;}
  if(hdr.bad)return;
  const g=k=>hdr[k]==null?'':String(r[hdr[k]]==null?'':r[hdr[k]]).trim();
  if(g('network')&&!network)network=g('network');
  const elv=g('element');
  if(!elv||elv==='-'){const k=g('interface');if(!k){w.push(`Line ${line}: neither element nor interface – skipped.`);return;}raw.interfaces[k]={subnet:g('ip'),vlan:g('vlan'),note:g('note')};return;}
  const name=g('instance')||'(unnamed)';const key=ndNorm(elv)+'|'+name.toLowerCase();
  let I=map[key];if(!I){I=map[key]={element:elv,name,site:g('site'),note:'',addresses:[]};raw.instances.push(I);}
  if(g('site')&&!I.site)I.site=g('site');
  if(g('ip')||g('interface'))I.addresses.push({interface:g('interface'),ip:g('ip'),port:g('port'),vlan:g('vlan'),note:g('note')});
  else if(g('note'))I.note=g('note');});
 if(!hdr)w.push('The file is empty.');
 raw.network=network;const res=ndClean(raw);return {d:res.d,w:w.concat(res.w)};}
function ndCSVcell(v){v=String(v==null?'':v);return /[",;\t\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function ndToCSV(d){const L=[`# network: ${d.network}`,'element,instance,site,interface,ip,port,vlan,note'];
 d.instances.forEach(I=>{if(!I.addresses.length||I.note)L.push([I.element,I.name,I.site,'','','','',I.note].map(ndCSVcell).join(','));
  I.addresses.forEach(A=>L.push([I.element,I.name,I.site,A.interface,A.ip,A.port,A.vlan,A.note].map(ndCSVcell).join(',')));});
 Object.entries(d.interfaces).forEach(([k,v])=>L.push(['','','',k,v.subnet,'',v.vlan,v.note].map(ndCSVcell).join(',')));
 return L.join('\r\n')+'\r\n';}
function ndToJSON(d){return {format:ND_FORMAT,version:1,network:d.network,saved:new Date().toISOString(),tool:'Mobile Network Navigator v'+VERSION,
 instances:d.instances.map(I=>({element:I.element,name:I.name,site:I.site,note:I.note,addresses:I.addresses.map(A=>({interface:A.interface,ip:A.ip,port:A.port,vlan:A.vlan,note:A.note}))})),interfaces:d.interfaces};}

/* ---------- encryption: AES-256-GCM, key derived from the passphrase with PBKDF2-SHA256 ---------- */
const ndCryptoOK=()=>!!(window.crypto&&crypto.subtle&&crypto.getRandomValues);
function ndB64(buf){const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
const ndUnB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function ndKey(pass,salt,iter){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function ndEncrypt(obj,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const key=await ndKey(pass,salt,ND_ITER);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));
 return {format:ND_ENC,version:1,kdf:'PBKDF2-SHA256',iterations:ND_ITER,cipher:'AES-256-GCM',salt:ndB64(salt),iv:ndB64(iv),data:ndB64(ct)};}
async function ndDecrypt(w,pass){if(w.cipher!=='AES-256-GCM'||w.kdf!=='PBKDF2-SHA256')throw new Error('Unsupported encryption ('+w.cipher+', '+w.kdf+')');
 const key=await ndKey(pass,ndUnB64(w.salt),+w.iterations||ND_ITER);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ndUnB64(w.iv)},key,ndUnB64(w.data));return JSON.parse(new TextDecoder().decode(pt));}

/* ---------- site filter (view only: panels, badges, search; optional for exports) ---------- */
const ND_LS_SITES='mnn-netdata-sites';
let NDF={sel:null,noSite:true}, NDexpf=false;      /* sel: null = all sites, otherwise a Set of site names */
const ndVis=I=>!NDF.sel||(I.site?NDF.sel.has(I.site):NDF.noSite);
const ndInst=()=>ND?ND.instances.filter(ndVis):[];
function ndSites(){const m=new Map();if(ND)ND.instances.forEach(I=>{if(I.site)m.set(I.site,(m.get(I.site)||0)+1);});return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true,sensitivity:'base'}));}
const ndNoSiteN=()=>ND?ND.instances.filter(I=>!I.site).length:0;
const ndFiltered=()=>!!(ND&&NDF.sel);
function ndFilterClean(){if(!NDF.sel)return;const all=ndSites().map(x=>x[0]);NDF.sel=new Set([...NDF.sel].filter(x=>all.includes(x)));if(all.length&&NDF.sel.size===all.length&&NDF.noSite)NDF.sel=null;}
function ndFilterLabel(){if(!NDF.sel)return 'all sites';const n=NDF.sel.size,t=ndSites().length;if(n===0)return NDF.noSite?'only instances without a site':'no sites';
 if(n===1){const x=[...NDF.sel][0];return x.length>22?x.slice(0,21)+'…':x;}return n+' of '+t+' sites';}
function ndFilterReset(){NDF={sel:null,noSite:true};NDexpf=false;}

/* ---------- which instances / addresses belong to an interface end ---------- */
function ndSideEps(L,el){if(!ND||!el||el==='bus'||!EM[el])return [];const keys=ndKeys(L);
 const has=I=>I.addresses.some(A=>keys.includes(A.interface));
 for(const grp of [[el],ND_ELALIAS[el]||[],ndRev(el)]){const r=ndInst().filter(I=>grp.includes(I.element)&&has(I));if(r.length)return r.map(I=>({I,ad:I.addresses.filter(A=>keys.includes(A.interface))}));}
 /* a reference point without its own entry falls back to the NF’s general SBI address */
 if(L.rp){const r=ndInst().filter(I=>I.element===el&&I.addresses.some(A=>A.interface==='sbi'));if(r.length)return r.map(I=>({I,ad:I.addresses.filter(A=>A.interface==='sbi')}));}
 return [];}
function ndLinkEps(L){if(!ND)return [];if(L.isbus)return ndInst().map(I=>({I,ad:I.addresses.filter(A=>A.interface==='sbi'||(LM[A.interface]&&LM[A.interface].rp))})).filter(x=>x.ad.length);
 return [...ndSideEps(L,L.a),...(L.b!==L.a?ndSideEps(L,L.b):[])];}

/* ---------- search index & map badges ---------- */
function ndIndex(){ELS.forEach(e=>{e._nd='';e._ndn=[];e._ndip=new Set();});LINKS.forEach(l=>{l._nd='';l._ndn=[];l._ndip=new Set();});if(!ND)return;
 const add=(o,txt,ip,net)=>{o._nd+=' '+String(txt).toLowerCase();const k=ip?ndAddrKind(ip):'';if(k==='v4net'||(net&&k==='v4host'))o._ndn.push(ip);if(k){o._ndip.add(ip.toLowerCase());if(k.endsWith('host'))o._ndip.add(ndAddrOnly(ip));}};
 ndInst().forEach(I=>{const E=EM[I.element];if(!E)return;add(E,I.name+' '+I.site+' '+I.note);I.addresses.forEach(A=>add(E,A.ip+' '+A.note+' '+ndPortShow(A.port),A.ip));});
 LINKS.forEach(L=>{ndLinkEps(L).forEach(({I,ad})=>ad.forEach(A=>add(L,I.name+' '+A.ip+' '+A.note+' '+ndPortShow(A.port),A.ip)));
  ndKeys(L).forEach(k=>{const v=ND.interfaces[k];if(v)add(L,v.subnet+' '+v.note+' vlan '+v.vlan,v.subnet,true);});});}
const ndTok=()=>state.q?state.q.split(/\s+/).filter(Boolean):[];
function ndIPin(t,nets){return ND_V4PLAIN.test(t)&&ND_V4.test(t)&&nets.some(n=>ndV4in(t,n));}
/* a complete IPv4 address matches only that address or a subnet containing it (192.0.2.11 does not find 192.0.2.110); anything else is a substring search */
const ndFullV4=t=>ND_V4PLAIN.test(t)&&ND_V4.test(t);
function ndMatch(t,o){if(!o._nd)return false;if(ndFullV4(t))return o._ndip.has(t)||ndIPin(t,o._ndn);return o._nd.includes(t);}
function ndHit(A,I){const tk=ndTok();if(!tk.length)return false;const txt=(I.name+' '+I.site+' '+A.ip+' '+A.note+' '+ndPortShow(A.port)).toLowerCase();
 return tk.some(t=>ndFullV4(t)?(A.ip===t||ndAddrOnly(A.ip)===t||(ndAddrKind(A.ip)==='v4net'&&ndIPin(t,[A.ip]))):txt.includes(t));}
function ndCount(el){return ndInst().filter(I=>I.element===el).length;}
function ndBadges(){Object.values(NODE).forEach(({g,E})=>{let b=g.querySelector('.ndb');const n=ndCount(E.id);
 if(!n){if(b)b.style.display='none';return;}
 if(!b){b=mk('g',{class:'ndb'},g);const x=E.kind==='container'?E.x+40:E.x+E.w-4,y=E.y;mk('rect',{x:x-32,y:y-8,width:36,height:16,rx:8},b);mk('text',{x:x-14,y:y+.5},b);mk('title',{},b);}
 b.style.display='';b.querySelector('text').textContent='IP '+(n>99?'99+':n);b.querySelector('title').textContent=`${n} ${E.n} instance${n>1?'s':''} in “${ND.network}”${ndFiltered()?' ('+ndFilterLabel()+')':''}`;});}

/* ---------- panel sections ---------- */
function ndAddrRows(I,adds,showIf){return `<table class="ndt"><tr>${showIf?'<th>Interface</th>':''}<th>Address</th><th>Port</th><th>VLAN</th><th>Note</th></tr>${adds.map(A=>{const L=LM[A.interface];
 return `<tr class="${ndHit(A,I)?'hit':''}">${showIf?`<td>${L?`<button class="ndlink" data-sel="if:${A.interface}"${L.rp?' title="Reference point – opens the Ref. points view of the 5GC"':''}>${esc(ndIfLabel(A.interface))}</button>`:esc(A.interface?ndIfLabel(A.interface):'—')}</td>`:''}<td class="ip${ndAddrKind(A.ip)==='bad'?' bad':''}">${esc(A.ip)}</td><td class="pt">${esc(ndPortShow(A.port))}</td><td>${esc(A.vlan)}</td><td>${esc(A.note)}</td></tr>`;}).join('')}</table>`;}
function ndHead(){return `<h3 class="ndh">Network data <span>${esc(ND.network)}</span>${NDdirty?' <i title="Not saved to a file yet">● unsaved</i>':''}${ndFiltered()?`<em class="ndflt" title="Site filter – only these sites are shown"><button class="ndlink" data-nd="sites">${esc(ndFilterLabel())}</button><button class="ndx" data-nd="siteclear" title="Show all sites" aria-label="Show all sites">✕</button></em>`:''}</h3>`;}
const ND_CAP=40;
function ndCapList(list,hit,what){const tk=ndTok();let l=list;if(tk.length){const h=list.filter(hit);if(h.length)l=h.concat(list.filter(x=>!h.includes(x)));}
 const more=l.length-ND_CAP;return {l:l.slice(0,ND_CAP),more:more>0?`<p class="ndmuted">+ ${more} more ${what} – type a name or address in the search box to bring matches to the top.</p>`:''};}
function ndInstName(I){return I.name==='*'?'All instances (range)':I.name;}
function ndElementHTML(E){if(!ND)return '';
 const parts=E.id==='gnb'?['gnb','gnbcucp','gnbcuup','gnbdu']:[E.id];const all=ndInst().filter(I=>parts.includes(I.element)),hid=ND.instances.filter(I=>parts.includes(I.element)&&!ndVis(I)).length;
 const {l:inst,more}=ndCapList(all,I=>I.addresses.some(A=>ndHit(A,I))||ndTok().some(t=>I.name.toLowerCase().includes(t)),'instances');
 return ndHead()+(inst.length?inst.map(I=>`<div class="ndinst"><div class="ndinst-h"><b>${esc(ndInstName(I))}</b>${I.element!==E.id?`<span class="ndtag">${esc(EM[I.element].n)}</span>`:''}${I.site?`<span>${esc(I.site)}</span>`:''}<button class="ndlink" data-nd="edit:${I.id}">Edit</button></div>${I.note?`<div class="ndmuted">${esc(I.note)}</div>`:''}${I.addresses.length?ndAddrRows(I,I.addresses,true):'<div class="ndmuted">No addresses yet.</div>'}</div>`).join('')+more:`<p class="ndmuted">No ${esc(E.n)} instances ${hid?'in the selected sites':'in this dataset'}.</p>`)+(hid?`<p class="ndmuted">${hid} more ${hid>1?'instances are':'instance is'} hidden by the site filter. <button class="ndlink" data-nd="siteclear">Show all sites</button></p>`:'')+
 `<div class="paneltools"><button data-nd="add:${E.id}">+ Add ${esc(E.n)} instance</button></div>`;}
function ndLinkHTML(L){if(!ND)return '';const info=ndKeys(L).filter(k=>ND.interfaces[k]).map(k=>({k,...ND.interfaces[k]}));
 const side=(nm,all)=>{const {l:eps,more}=ndCapList(all,x=>x.ad.some(A=>ndHit(A,x.I)),'instances');return `<div class="ndside"><div class="ndside-h">${esc(nm)}</div>${eps.length?eps.map(({I,ad})=>`<div class="ndep"><button class="ndlink" data-sel="el:${I.element}">${esc(ndInstName(I))}</button>${I.site?` <span>${esc(I.site)}</span>`:''}${ndAddrRows(I,ad,ad.some(A=>A.interface!==ndCanon(L)))}</div>`).join('')+more:'<div class="ndmuted">no addresses</div>'}</div>`;};
 let sides;
 if(L.isbus)sides=side('NFs on the SBI',ndLinkEps(L));
 else if(L.bus)sides=side(EM[L.a].n,ndSideEps(L,L.a));
 else if(L.a===L.b)sides=side(EM[L.a].n+' (both ends)',ndSideEps(L,L.a));
 else sides=side(EM[L.a].n,ndSideEps(L,L.a))+side(EM[L.b].n,ndSideEps(L,L.b));
 return ndHead()+info.map(x=>`<div class="kv ndkv">${x.k!==ndCanon(L)?`<div>Interface</div><div>${esc(ndIfLabel(x.k))}</div>`:''}<div>Subnet</div><div>${esc(x.subnet)||'—'}</div><div>VLAN</div><div>${esc(x.vlan)||'—'}</div>${x.note?`<div>Note</div><div>${esc(x.note)}</div>`:''}</div>`).join('')+
  `<div class="ndsides">${sides}</div><div class="paneltools"><button data-nd="ifedit:${ndCanon(L)}">${info.length?'Edit':'Add'} interface info (subnet, VLAN)</button></div>`;}
function ndHint(){return ND?'':`<p class="ndmuted ndhint">Your own IP plan can be shown here: <button class="ndlink" data-nd="menu">◆ Network data</button></p>`;}
function ndOverviewHTML(){if(!ND)return '';const by={};ndInst().forEach(I=>{by[I.element]=(by[I.element]||0)+1;});
 return ndHead()+`<div class="ifcs">${ELS.filter(e=>by[e.id]).map(e=>`<button class="ifc" data-sel="el:${e.id}" style="font-family:var(--sans)">${esc(e.n)} <i>${by[e.id]}</i></button>`).join('')||(ndFiltered()?'<span class="ndmuted">No instances in the selected sites.</span>':'<span class="ndmuted">Empty dataset – select an element and use “+ Add instance”.</span>')}</div>${NDwarn.length?`<p><button class="ndlink" data-nd="warn">⚠ ${NDwarn.length} data warning${NDwarn.length>1?'s':''}</button></p>`:''}`;}
function ndTip(type,id){if(!ND)return '';if(type==='el'){const n=ndCount(id);return n?`<span class="s">IP plan: ${n} instance${n>1?'s':''} in ${esc(ND.network)}</span>`:'';}
 const L=LM[id];const n=ndLinkEps(L).reduce((a,x)=>a+x.ad.length,0);return n?`<span class="s">IP plan: ${n} address${n>1?'es':''} in ${esc(ND.network)}</span>`:'';}

/* ---------- modal ---------- */
function ndModal(title,body,buttons,onOpen){const m=$('#modal');m.querySelector('.mbox').className='mbox';m.querySelector('h3').textContent=title;m.querySelector('.mbody').innerHTML=body;
 const bt=m.querySelector('.mbtns');bt.innerHTML='';m._esc=null;
 buttons.forEach(b=>{const e=document.createElement('button');e.textContent=b.label;e.className=b.primary?'primary':b.danger?'danger':'';
  const run=async()=>{if(e.disabled)return;e.disabled=true;let r;try{r=b.onClick?await b.onClick(m):true;}finally{e.disabled=false;}if(r!==false)ndCloseModal();};
  e.onclick=run;if(b.cancel||/^(Cancel|Close|Skip)/.test(b.label))m._esc=run;bt.appendChild(e);});
 m.querySelector('.mbody').oninput=()=>{const e=m.querySelector('#nderr');if(e&&!m.dataset.ack)e.textContent='';};
 m.hidden=false;hideTip();if(onOpen)onOpen(m);const f=m.querySelector('.mbody input,.mbody select');const fb=f||bt.querySelector('.primary')||bt.lastChild;if(fb)fb.focus();}
function ndCloseModal(){$('#modal').hidden=true;}
function ndModalOpen(){return !$('#modal').hidden;}
$('#modal').addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.matches('.mbody input')&&!ev.target.closest('.ndedit')){ev.preventDefault();const p=$('#modal .mbtns .primary');if(p)p.click();}});
function ndPass(title,confirm,note){return new Promise(res=>{ndModal(title,`${note?`<p class="ndmuted">${note}</p>`:''}<label>Passphrase<input type="password" id="ndp1" autocomplete="${confirm?'new-password':'current-password'}"></label>${confirm?'<label>Repeat passphrase<input type="password" id="ndp2" autocomplete="new-password"></label>':''}<div class="nderr" id="nderr"></div>`,
 [{label:'Cancel',onClick:()=>{res(null);}},{label:confirm?'Encrypt':'Unlock',primary:true,onClick:m=>{const a=m.querySelector('#ndp1').value,b=confirm?m.querySelector('#ndp2').value:a;const er=m.querySelector('#nderr');
  if(!a){er.textContent='Enter a passphrase.';return false;}if(confirm&&a.length<10){er.textContent='Use at least 10 characters – a short sentence works well.';return false;}
  if(a!==b){er.textContent='The passphrases do not match.';return false;}res(a);}}]);});}
function ndAsk(title,html,choices){return new Promise(res=>ndModal(title,html,choices.map(c=>({...c,onClick:()=>{res(c.v);}}))));}
function ndWarnHTML(w){return w&&w.length?`<ul class="ndwarn">${w.slice(0,300).map(x=>`<li>${esc(x)}</li>`).join('')}${w.length>300?`<li>… and ${w.length-300} more</li>`:''}</ul>`:'<p class="ndmuted">No warnings.</p>';}
function ndShowWarnings(){ndModal('Data check'+(ND?' – '+ND.network:''),ndWarnHTML(NDwarn),[{label:'Close',primary:true}]);}

/* ---------- apply / load ---------- */
function ndRefresh(){ndFilterClean();ndIndex();ndBadges();ndPersist();ndStatus();apply();renderPanel();}
function ndSet(d,src,warn,dirty){ND=d;NDsrc=src||NDsrc;NDwarn=warn||[];NDdirty=!!dirty;ndRefresh();}
function ndTouch(){NDdirty=true;NDwarn=ndValidate(ND);ndRefresh();}
async function ndUnlock(j,label,note){if(!ndCryptoOK()){await ndAsk('Cannot decrypt','<p>This browser does not offer Web Crypto here. Open the file in a current Chrome, Edge, Firefox or Safari.</p>',[{label:'Close',primary:true}]);return null;}
 for(let tries=0;;tries++){const p=await ndPass(label,false,(tries?'<b>Wrong passphrase – try again.</b> ':'')+note);if(p==null)return null;
  try{return await ndDecrypt(j,p);}catch(e){if(/Unsupported/.test(e.message)){toast(e.message);return null;}}}}
async function ndLoadText(text,fname){let parsed;fname=fname||'the file';
 try{const t=text.replace(/^﻿/,'').trim();
  if(t.startsWith('{')){let j=JSON.parse(t),enc=false;
   if(j.format===ND_ENC){j=await ndUnlock(j,'Unlock '+fname,'This file is encrypted. Enter its passphrase.');if(!j)return;enc=true;}
   parsed=ndClean(j);parsed.enc=enc;}
  else if(/^<(!doctype|html)/i.test(t)){const m=t.match(/<script[^>]*id="mnn-netdata"[^>]*>([\s\S]*?)<\/script>/i);if(!m)throw new Error('This HTML file contains no network data.');return ndLoadText(m[1],fname);}
  else parsed=ndParseCSV(text);}
 catch(e){await ndAsk('Could not read '+fname,`<p>${esc(e.message)}</p><p class="ndmuted">Expected a CSV file (header: element, instance, site, interface, ip, port, vlan, note), a JSON export, an encrypted JSON export or an HTML file saved with data.</p>`,[{label:'Close',primary:true}]);return;}
 if(!parsed.d.instances.length&&!Object.keys(parsed.d.interfaces).length){await ndAsk('Nothing to load',`<p>No usable rows in ${esc(fname)}.</p>${ndWarnHTML(parsed.w)}`,[{label:'Close',primary:true}]);return;}
 let mode='replace';
 if(ND){mode=await ndAsk('Network data already loaded',`<p>“${esc(ND.network)}” is loaded${NDdirty?' and has <b>unsaved changes</b>':''}. Replace it with ${esc(fname)}, or merge the new data into it (instances with the same element and name are combined)?</p>`,[{label:'Cancel',v:null},{label:'Merge',v:'merge'},{label:'Replace',v:'replace',primary:true}]);if(!mode)return;}
 const merge=mode==='merge';if(!merge)ndFilterReset();const d=merge?ndMerge(ND,parsed.d):parsed.d;const w=merge?ndValidate(d):parsed.w;
 ndSet(d,{kind:'file',enc:!!parsed.enc||(merge&&NDsrc.enc)},w,merge);
 toast(`Loaded “${d.network}”: ${d.instances.length} instance${d.instances.length===1?'':'s'}${w.length?' · '+w.length+' warning'+(w.length>1?'s':''):''}`);if(w.length)ndShowWarnings();}
function ndPickFile(){const i=document.createElement('input');i.type='file';i.accept='.csv,.tsv,.txt,.json,.html,.htm,text/csv,application/json';i.style.display='none';document.body.appendChild(i);
 i.onchange=()=>{const f=i.files[0];i.remove();if(f)f.text().then(t=>ndLoadText(t,f.name));};i.click();}

/* ---------- save / export ---------- */
function ndSlug(s){return String(s||'network').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'network';}
function ndDownload(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);}
function ndHTMLwith(payload,enc){const doc=PRISTINE_DOC.cloneNode(true);doc.querySelectorAll('#mnn-netdata').forEach(x=>x.remove());
 const s=document.createElement('script');s.type='application/json';s.id='mnn-netdata';if(enc)s.setAttribute('data-encrypted','1');
 s.textContent=JSON.stringify(payload).replace(/</g,'\\u003c');doc.querySelector('head').appendChild(s);return '<!DOCTYPE html>\n'+doc.outerHTML+'\n';}
async function ndSave(kind){if(!ND){toast('No network data loaded.');return;}
 const part=NDexpf&&ndFiltered(),D=part?{...ND,instances:ndInst()}:ND;
 const base=ndSlug(ND.network)+(part?'-'+ndSlug(NDF.sel.size===1?[...NDF.sel][0]:NDF.sel.size+'-sites'):'');const json=ndToJSON(D);
 if(kind==='csv')ndDownload(base+'.netdata.csv','\uFEFF'+ndToCSV(D),'text/csv;charset=utf-8');
 else if(kind==='json')ndDownload(base+'.netdata.json',JSON.stringify(json,null,1),'application/json');
 else if(kind==='html')ndDownload('mobile-network-navigator-'+base+'-with-data.html',ndHTMLwith(json,false),'text/html;charset=utf-8');
 else{if(!ndCryptoOK()){toast('Encryption needs Web Crypto, available in current browsers.');return;}
  const p=await ndPass('Encrypt with a passphrase',true,'Anyone with the file <b>and</b> the passphrase can read the data. A lost passphrase cannot be recovered. Share the passphrase over a different channel than the file.');if(p==null)return;
  const w=await ndEncrypt(json,p);
  if(kind==='json-enc')ndDownload(base+'.netdata.enc.json',JSON.stringify(w),'application/json');
  else ndDownload('mobile-network-navigator-'+base+'-with-data.html',ndHTMLwith(w,true),'text/html;charset=utf-8');}
 if(!part)NDdirty=false;ndStatus();renderPanel();toast(part?`Saved ${D.instances.length} of ${ND.instances.length} instances (site filter) – check your downloads folder`:'Saved – check your downloads folder');}

/* ---------- remember on this computer (browser storage, unencrypted) ---------- */
function ndRemember(){try{return localStorage.getItem(ND_LS_FLAG)==='1';}catch(e){return false;}}
function ndPersist(){try{if(ndRemember()&&ND){localStorage.setItem(ND_LS,JSON.stringify(ndToJSON(ND)));localStorage.setItem(ND_LS_SITES,JSON.stringify({sel:NDF.sel?[...NDF.sel]:null,noSite:NDF.noSite}));}else{localStorage.removeItem(ND_LS);localStorage.removeItem(ND_LS_SITES);}}catch(e){}}

/* ---------- toolbar: button, status, menu ---------- */
function ndStatus(){const s=$('#ndstat'),b=$('#ndbtn'),sb=$('#ndsite');
 if(!ND){s.innerHTML='';s.title='';b.classList.remove('on');sb.hidden=true;$('#ndsitemenu').hidden=true;return;}
 const ns=ndSites().length;sb.hidden=!(ns>1||ndFiltered()||(ns===1&&ndNoSiteN()));sb.textContent=(ndFiltered()&&NDF.sel.size>1?'Sites: ':'Site: ')+ndFilterLabel().replace(/ sites$/,'')+' ▾';sb.classList.toggle('on',ndFiltered());
 const na=ND.instances.reduce((a,I)=>a+I.addresses.length,0);b.classList.add('on');
 s.innerHTML=`${NDsrc.enc?'<span title="Loaded from an encrypted file">🔒</span> ':''}<span class="ndn">${esc(ND.network)}</span>${NDdirty?' <i title="Changes not saved to a file">●</i>':''}${NDwarn.length?` <b data-nd="warn" title="Data warnings – click to view">⚠${NDwarn.length}</b>`:''}`;
 s.title=`${ND.instances.length} instances · ${na} addresses${ndFiltered()?' · showing '+ndInst().length+' ('+ndFilterLabel()+')':''}${NDdirty?' · changes not saved to a file':''}${ndRemember()?' · kept in this browser':''}`;}
function ndMenu(){const m=$('#ndmenu');if(!m.hidden){m.hidden=true;return;}const has=!!ND,cr=ndCryptoOK();
 m.innerHTML=`<div class="ndm-h">${has?`<b>${esc(ND.network)}</b><span>${ND.instances.length} instances · ${ND.instances.reduce((a,I)=>a+I.addresses.length,0)} addresses${NDdirty?' · <i>unsaved changes</i>':''}</span>`:'<b>No network data loaded</b><span>Load your IP plan to see it in element and interface details. Data stays on this computer – nothing is uploaded.</span>'}</div>
 <button data-ndm="load">Load file… <small>CSV · JSON · encrypted JSON · saved HTML – or drop a file on the page</small></button>
 <button data-ndm="new">New empty dataset…</button>
 ${has?`<button data-ndm="rename">Rename network…</button><button data-ndm="warn">Data check <small>${NDwarn.length} warning${NDwarn.length===1?'':'s'}</small></button>`:''}
 <hr>
 ${has&&ndFiltered()?`<label class="ndm-chk"><input type="checkbox" id="ndexpf" ${NDexpf?'checked':''}><span>Export only the filtered sites<small>${ndInst().length} of ${ND.instances.length} instances (${esc(ndFilterLabel())}); interface info is always included</small></span></label>`:''}
 <button data-ndm="csv" ${has?'':'disabled'}>Export CSV</button>
 <button data-ndm="json" ${has?'':'disabled'}>Export JSON</button>
 <button data-ndm="json-enc" ${has&&cr?'':'disabled'}>Export JSON, encrypted 🔒</button>
 <button data-ndm="html" ${has?'':'disabled'}>Save tool + data as one HTML file</button>
 <button data-ndm="html-enc" ${has&&cr?'':'disabled'}>Save tool + data as one HTML file, encrypted 🔒</button>
 <hr>
 <label class="ndm-chk"><input type="checkbox" id="ndrem" ${ndRemember()?'checked':''}><span>Remember on this computer<small>Kept in this browser’s storage, not encrypted. Leave off on shared computers.</small></span></label>
 <button data-ndm="template">Download CSV template</button>
 ${has?'<button data-ndm="clear" class="danger">Remove data from this page…</button>':''}`;
 m.hidden=false;}
async function ndMenuAction(a){$('#ndmenu').hidden=true;
 if(a==='load')ndPickFile();
 else if(a==='new'){if(ND&&NDdirty&&!await ndAsk('Discard unsaved changes?',`<p>“${esc(ND.network)}” has changes that are not saved to a file.</p>`,[{label:'Cancel',v:false},{label:'Discard',v:true,danger:true}]))return;
  ndModal('New dataset','<label>Network name<input id="ndname" placeholder="e.g. Operator X – lab"></label>',[{label:'Cancel'},{label:'Create',primary:true,onClick:m=>{ndFilterReset();ndSet(ndEmpty(m.querySelector('#ndname').value.trim()||'Unnamed network'),{kind:'new',enc:false},[],true);}}]);}
 else if(a==='rename')ndModal('Rename network',`<label>Network name<input id="ndname" value="${esc(ND.network)}"></label>`,[{label:'Cancel'},{label:'Save',primary:true,onClick:m=>{ND.network=m.querySelector('#ndname').value.trim()||ND.network;ndTouch();}}]);
 else if(a==='warn')ndShowWarnings();
 else if(['csv','json','json-enc','html','html-enc'].includes(a))ndSave(a);
 else if(a==='template')ndDownload('netdata-template.csv','﻿'+ND_TEMPLATE_CSV,'text/csv;charset=utf-8');
 else if(a==='clear'){if(!await ndAsk('Remove network data?',`<p>Removes “${esc(ND.network)}” from this page${ndRemember()?' and from this browser’s storage':''}. ${NDdirty?'<b>Changes not saved to a file will be lost.</b>':'Your files are not affected.'}</p>`,[{label:'Cancel',v:false},{label:'Remove',v:true,danger:true}]))return;
  ND=null;NDdirty=false;NDwarn=[];NDsrc={kind:'',enc:false};ndFilterReset();ndRefresh();}}
$('#ndbtn').addEventListener('click',ev=>{ev.stopPropagation();ndMenu();});
$('#ndstat').addEventListener('click',ev=>{if(ev.target.closest('[data-nd="warn"]'))ndShowWarnings();});
$('#ndmenu').addEventListener('click',ev=>{const b=ev.target.closest('button[data-ndm]');if(b&&!b.disabled)ndMenuAction(b.dataset.ndm);});
$('#ndmenu').addEventListener('change',ev=>{if(ev.target.id==='ndexpf'){NDexpf=ev.target.checked;return;}if(ev.target.id!=='ndrem')return;try{localStorage.setItem(ND_LS_FLAG,ev.target.checked?'1':'0');}catch(e){toast('Browser storage is not available here.');}
 ndPersist();ndStatus();toast(ev.target.checked?'Network data will be kept in this browser':'Network data removed from this browser’s storage');});
document.addEventListener('click',ev=>{const m=$('#ndmenu');if(!m.hidden&&!ev.target.closest('#ndmenu,#ndbtn'))m.hidden=true;});
/* site filter popover */
function ndSiteMenu(){const m=$('#ndsitemenu');if(!m.hidden){m.hidden=true;return;}$('#ndmenu').hidden=true;
 m.innerHTML=`<div class="ndm-h"><b>Show network data of …</b><span>${ndSites().length} sites · applies to panels, map badges and search</span></div>
 <input id="ndsiteq" type="search" placeholder="Find sites, e.g. bb1, bb2" autocomplete="off" spellcheck="false">
 <div class="ndsite-btns"><button data-ns="all">All</button><button data-ns="none">None</button><button data-ns="match" title="Select exactly the sites in the list below (Enter)">Only listed</button></div>
 <label class="ndm-chk"><input type="checkbox" id="ndsitenone" ${NDF.noSite?'checked':''}><span>Also show instances without a site<small>${ndNoSiteN()} instance${ndNoSiteN()===1?'':'s'} (e.g. RAN address ranges)</small></span></label>
 <div class="ndsite-list"></div>`;m.hidden=false;ndSiteList();m.querySelector('#ndsiteq').focus();}
function ndSiteMatches(){const q=($('#ndsiteq')||{}).value||'';const parts=q.toLowerCase().split(',').map(x=>x.trim()).filter(Boolean);
 return ndSites().filter(([x])=>!parts.length||parts.some(p=>x.toLowerCase().includes(p)));}
function ndSiteList(){const m=$('#ndsitemenu');if(m.hidden)return;const S=ndSiteMatches();
 m.querySelector('.ndsite-list').innerHTML=S.map(([x,n])=>`<label title="${esc(x)}"><input type="checkbox" data-site="${esc(x)}" ${!NDF.sel||NDF.sel.has(x)?'checked':''}><span>${esc(x)}</span><small>${n}</small></label>`).join('')||'<div class="ndmuted">No site matches.</div>';}
function ndSiteApply(){ndFilterClean();ndIndex();ndBadges();ndPersist();ndStatus();apply();renderPanel();ndSiteList();}
$('#ndsite').addEventListener('click',ev=>{ev.stopPropagation();ndSiteMenu();});
$('#ndsitemenu').addEventListener('input',ev=>{if(ev.target.id==='ndsiteq')ndSiteList();});
$('#ndsitemenu').addEventListener('keydown',ev=>{if(ev.target.id==='ndsiteq'&&ev.key==='Enter'){ev.preventDefault();$('#ndsitemenu [data-ns="match"]').click();}});
$('#ndsitemenu').addEventListener('click',ev=>{const b=ev.target.closest('[data-ns]');if(!b)return;const a=b.dataset.ns;
 if(a==='all')NDF.sel=null;else if(a==='none')NDF.sel=new Set();else NDF.sel=new Set(ndSiteMatches().map(x=>x[0]));ndSiteApply();});
$('#ndsitemenu').addEventListener('change',ev=>{const t=ev.target;

 else if(t.dataset.site!=null){if(!NDF.sel)NDF.sel=new Set(ndSites().map(x=>x[0]));if(t.checked)NDF.sel.add(t.dataset.site);else NDF.sel.delete(t.dataset.site);}
 else return;ndSiteApply();});
document.addEventListener('click',ev=>{const m=$('#ndsitemenu');if(!m.hidden&&!ev.target.closest('#ndsitemenu,#ndsite'))m.hidden=true;});
/* drag & drop a file anywhere on the page */
let ndDragN=0;
const ndHasFiles=ev=>[...(ev.dataTransfer&&ev.dataTransfer.types||[])].includes('Files');
document.addEventListener('dragenter',ev=>{if(ndHasFiles(ev)){ndDragN++;document.body.classList.add('nddrop');}});
document.addEventListener('dragleave',ev=>{if(ndHasFiles(ev)&&--ndDragN<=0){ndDragN=0;document.body.classList.remove('nddrop');}});
document.addEventListener('dragover',ev=>{if(ndHasFiles(ev))ev.preventDefault();});
document.addEventListener('drop',ev=>{ndDragN=0;document.body.classList.remove('nddrop');const f=ev.dataTransfer&&ev.dataTransfer.files&&ev.dataTransfer.files[0];if(!f)return;ev.preventDefault();f.text().then(t=>ndLoadText(t,f.name));});
window.addEventListener('beforeunload',ev=>{if(ND&&NDdirty&&!ndRemember()){ev.preventDefault();ev.returnValue='';}});

/* ---------- editor ---------- */
function ndRowHTML(el,A){const opts=ndElIfs(el);if(A.interface&&!opts.some(o=>o.k===A.interface))opts.unshift({k:A.interface,label:ndIfLabel(A.interface)+' (not on this element)'});
 return `<tr><td><select class="nd-if">${opts.map(o=>`<option value="${esc(o.k)}"${o.k===A.interface?' selected':''}>${esc(o.label)}</option>`).join('')}</select></td>
 <td><input class="nd-ip" value="${esc(A.ip)}" placeholder="address · subnet/len · FQDN" spellcheck="false"></td><td><input class="nd-port" value="${esc(A.port)}" placeholder="443;8080" spellcheck="false" title="One port, a list (2123;2152) or a range (30000-30100)"></td><td><input class="nd-vlan" value="${esc(A.vlan)}"></td><td><input class="nd-note" value="${esc(A.note)}"></td><td><button class="nd-del" title="Remove this address" aria-label="Remove">✕</button></td></tr>`;}
function ndEditInstance(el,id){const I=id?ND.instances.find(x=>x.id===id):{id:null,element:el,name:'',site:NDF.sel&&NDF.sel.size===1?[...NDF.sel][0]:'',note:'',addresses:[{interface:(ndElIfs(el)[0]||{}).k||'',ip:'',port:'',vlan:'',note:''}]};if(!I)return;const E=EM[I.element];
 ndModal((id?'Edit ':'New ')+E.n+' instance',
 `<div class="ndgrid"><label>Name<input id="nd-name" value="${esc(I.name)}" placeholder="e.g. ${esc(E.n.split(/[ /]/)[0])}01 – or * for a range"></label><label>Site<input id="nd-site" value="${esc(I.site)}" list="nd-sitelist" autocomplete="off"><datalist id="nd-sitelist">${ndSites().map(([x])=>`<option value="${esc(x)}">`).join('')}</datalist></label><label class="wide">Note<input id="nd-inote" value="${esc(I.note)}"></label></div>
 <table class="ndedit"><thead><tr><th>Interface</th><th>Address</th><th>Port</th><th>VLAN</th><th>Note</th><th></th></tr></thead><tbody>${I.addresses.map(A=>ndRowHTML(I.element,A)).join('')}</tbody></table>
 <button id="nd-addrow" class="ndlink">+ Add address</button><div class="nderr" id="nderr"></div>`,
 [...(id?[{label:'Delete instance',danger:true,onClick:async()=>{if(!await ndAsk('Delete instance?',`<p>Delete ${esc(E.n)} “${esc(I.name)}” and its ${I.addresses.length} address${I.addresses.length===1?'':'es'}?</p>`,[{label:'Cancel',v:false},{label:'Delete',v:true,danger:true}]))return false;ND.instances=ND.instances.filter(x=>x.id!==id);ndTouch();}}]:[]),
  {label:'Cancel'},
  {label:'Save',primary:true,onClick:m=>{const er=m.querySelector('#nderr');const name=m.querySelector('#nd-name').value.trim();if(!name){er.textContent='Enter a name.';return false;}
   if(ND.instances.some(x=>x.id!==I.id&&x.element===I.element&&x.name.toLowerCase()===name.toLowerCase())){er.textContent=`There already is a ${E.n} called “${name}”.`;return false;}
   const rows=[...m.querySelectorAll('.ndedit tbody tr')].map(tr=>({interface:tr.querySelector('.nd-if').value,ip:tr.querySelector('.nd-ip').value.trim(),port:tr.querySelector('.nd-port').value.trim(),vlan:tr.querySelector('.nd-vlan').value.trim(),note:tr.querySelector('.nd-note').value.trim()})).filter(r=>r.ip||r.note||r.port||r.vlan).map(r=>({...r,port:ndPortNorm(r.port)}));
   const bad=rows.filter(r=>r.ip&&ndAddrKind(r.ip)==='bad').map(r=>r.ip).concat(rows.filter(r=>r.port&&!ndPortOK(r.port)).map(r=>'port '+r.port+' ('+ND_PORTMSG+')'));
   const sig=bad.join('|');if(bad.length&&m.dataset.ack!==sig){m.dataset.ack=sig;er.textContent=`Please check: ${bad.join(', ')}. Click Save again to keep as entered.`;return false;}
   const T=id?I:{id:NDuid(),element:I.element};Object.assign(T,{name,site:m.querySelector('#nd-site').value.trim(),note:m.querySelector('#nd-inote').value.trim(),addresses:rows});if(!id)ND.instances.push(T);
   if(!ndVis(T)){if(T.site)NDF.sel.add(T.site);else NDF.noSite=true;toast('Site filter extended so the instance stays visible');}ndTouch();}}],
 m=>{delete m.dataset.ack;m.querySelector('#nd-addrow').onclick=()=>{const tb=m.querySelector('.ndedit tbody');tb.insertAdjacentHTML('beforeend',ndRowHTML(I.element,{interface:'',ip:'',port:'',vlan:'',note:''}));tb.lastElementChild.querySelector('.nd-ip').focus();};
  m.querySelector('.ndedit').addEventListener('click',ev=>{const b=ev.target.closest('.nd-del');if(b)b.closest('tr').remove();});});}
function ndEditIf(k){const v=ND.interfaces[k]||{subnet:'',vlan:'',note:''};
 ndModal('Interface info – '+ndIfLabel(k),`<div class="ndgrid"><label>Subnet<input id="nd-sub" value="${esc(v.subnet)}" placeholder="192.0.2.0/28" spellcheck="false"></label><label>VLAN<input id="nd-vl" value="${esc(v.vlan)}"></label><label class="wide">Note<input id="nd-in" value="${esc(v.note)}"></label></div><div class="nderr" id="nderr"></div>`,
 [...(ND.interfaces[k]?[{label:'Remove',danger:true,onClick:()=>{delete ND.interfaces[k];ndTouch();}}]:[]),{label:'Cancel'},
  {label:'Save',primary:true,onClick:m=>{const sub=m.querySelector('#nd-sub').value.trim();if(sub&&ndAddrKind(sub)==='bad'&&m.dataset.ack!==sub){m.dataset.ack=sub;m.querySelector('#nderr').textContent=`“${sub}” is not a valid subnet. Click Save again to keep it.`;return false;}
   ND.interfaces[k]={subnet:sub,vlan:m.querySelector('#nd-vl').value.trim(),note:m.querySelector('#nd-in').value.trim()};ndTouch();}}],m=>{delete m.dataset.ack;});}
panel.addEventListener('click',ev=>{const b=ev.target.closest('[data-nd]');if(!b)return;ev.stopPropagation();const i=b.dataset.nd.indexOf(':');const a=i<0?b.dataset.nd:b.dataset.nd.slice(0,i),x=i<0?'':b.dataset.nd.slice(i+1);
 if(a==='menu'){ndMenu();return;}if(a==='warn'){ndShowWarnings();return;}
 if(a==='siteclear'){NDF.sel=null;ndSiteApply();return;}if(a==='sites'){ndSiteMenu();return;}if(!ND){ndMenuAction('new');return;}
 if(a==='add')ndEditInstance(x,null);else if(a==='edit')ndEditInstance(null,x);else if(a==='ifedit')ndEditIf(x);});

/* ---------- start-up: data embedded in a saved HTML file, else data remembered in this browser ---------- */
async function ndInit(){const emb=document.getElementById('mnn-netdata');
 if(emb){try{let j=JSON.parse(emb.textContent),enc=false;
   if(j.format===ND_ENC){j=await ndUnlock(j,'Unlock network data','This copy of the tool contains encrypted network data. Enter the passphrase, or cancel to use the tool without it.');if(!j)return;enc=true;}
   const r=ndClean(j);ndSet(r.d,{kind:'embedded',enc},r.w,false);toast(`Network data “${r.d.network}” loaded from this file`);}
  catch(e){toast('The network data in this file could not be read.');}return;}
 if(ndRemember()){try{const t=localStorage.getItem(ND_LS);if(t){const r=ndClean(JSON.parse(t));try{const f=JSON.parse(localStorage.getItem(ND_LS_SITES)||'null');if(f)NDF={sel:f.sel?new Set(f.sel):null,noSite:f.noSite!==false};}catch(e){}ndSet(r.d,{kind:'browser',enc:false},r.w,false);toast(`Network data “${r.d.network}” restored from this browser`);}}catch(e){}}}

/* ---------- release history ---------- */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function relDate(v){const m=String(v).match(/^(\d{4})\.(\d{2})\.(\d{2})(?:\.(\d+))?$/);if(!m)return '';return (+m[3])+' '+MON[+m[2]-1]+' '+m[1]+(m[4]?' · release '+m[4]+' of the day':'');}
function relFmt(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');}
function showReleases(){const first=RELEASES[RELEASES.length-1];
 ndModal('Release history',`<p class="relintro">You are using version <code>${esc(VERSION)}</code>. Version numbers are dates (<code>YYYY.MM.DD</code>, with <code>.N</code> for further releases on the same day). ${RELEASES.length} releases since ${esc(relDate(first.v))}.</p>`+
  RELEASES.map(r=>`<section class="rel"><h4><code>${esc(r.v)}</code><span>${esc(relDate(r.v))}</span>${r.v===VERSION?'<em>current</em>':''}</h4><ul>${r.items.map(i=>`<li>${relFmt(i)}</li>`).join('')}</ul></section>`).join(''),
  [{label:'Close',primary:true}]);
 try{localStorage.setItem('mnn-seen-version',VERSION);}catch(e){}$('#ver').classList.remove('new');$('#ver').title='Release history';}
$('#ver').addEventListener('click',ev=>{ev.stopPropagation();showReleases();});
try{const seen=localStorage.getItem('mnn-seen-version');if(!seen)localStorage.setItem('mnn-seen-version',VERSION);else if(seen!==VERSION){$('#ver').classList.add('new');$('#ver').title='New version – click to see what changed';}}catch(e){}

/* init */
function sizeMain(){document.documentElement.style.setProperty('--hdr',($('#hdr').offsetHeight+$('#toolbar').offsetHeight)+'px');}
window.addEventListener('resize',sizeMain);
$('#ver').textContent='v'+VERSION;buildChips();buildLegend();if(innerWidth<700){$('#legend').classList.add('mini');$('#leghide').textContent='Legend ▸';}drawZones();drawBus();drawNodes();drawLinks();sizeMain();ndIndex();apply();renderPanel();readHash();ndInit();
window.addEventListener('hashchange',readHash);
</script>
