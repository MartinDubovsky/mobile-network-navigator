<p>The flows follow the 3GPP clauses named under each title for the common case – non-roaming, no relocation of SGW / AMF / UPF. Optional or conditional steps are dashed and marked <code>opt</code>.</p>`);

 /* ---------- trace analysis ---------- */
 add('tr-overview','Trace analysis','Overview',`
<p><b>⇅ Trace</b> in the toolbar, the link on the overview page, or dropping files anywhere on the page opens one or more Wireshark captures. The analysis finds which mobile-network interfaces and elements the capture contains and says how sure it is about each one. The map highlights the interfaces with packet counts and dims the rest; the panel lists the interfaces, the capture interfaces with their direction, the traffic left for you to decide, the elements and addresses, and what could not be mapped.</p>
${hpNote(`<b>Private by design.</b> The file is read in this browser only, as a stream. It is never uploaded (the page has no network access at all), never stored – not in browser storage either – never put in the link and never included in “Save with data”. <b>Close trace</b>, or closing the page, discards it. Only when you ${hpA('tr-save','save the results')} is a file written – counts, element addresses and names, your decisions; never the packets. No subscriber identities are read: IMSI, MSISDN, IMEI, user names and Subscription-Id are never decoded. UE addresses are kept in memory only, to recognise plain-IP traffic, and are shown as counts.`)}
<h4>How the analysis works</h4>
<ol class="hpol">
<li>${hpA('tr-read','Read the capture')} – file format, link layer (VLAN, MPLS, PPPoE …), IPv4 / IPv6 with extension headers and fragments.</li>
<li>${hpA('tr-classify','Classify each packet')} into a traffic class by its transport protocol and well-known port (or one of your ${hpA('nd-ports','protocol ports')}), SCTP payload protocol identifier or IP protocol.</li>
<li>${hpA('tr-decode','Decode the signalling')} for evidence – F-TEIDs, PFCP interface types, Diameter applications and AVPs, RADIUS attributes – and collect the traffic into ${hpA('tr-flows','flows')}.</li>
<li>When the file is read, ${hpA('tr-evidence','decide the interface of every flow')} from that evidence, your ${hpA('tr-nd','network data')} and your own choices.</li>
<li>${hpA('tr-ends','Find which element each address is')}, and ${hpA('tr-dir','the direction')} of the user plane per capture interface.</li>
<li>${hpA('tr-results','Show the results')} on the map and in the panel.</li></ol>
<p>Steps 4 to 6 are repeated whenever your network data changes or you make a choice – the capture is not read again.</p>
<h4>How sure is each result?</h4>
${hpT(['Badge','Meaning'],[[trBadge('sure'),'The protocol itself or explicit signalling identifies the interface: S1AP is carried only on S1-MME; both ends of a GTP-U tunnel are signalled with their F-TEID interface types in the same capture; or both addresses are on the same interface in your network data.'],
 [trBadge('likely'),'Inferred – please check. One end signalled, an indirect indicator (an extension header, the RAT type, the same node’s Gx traffic), a default where two interfaces use the same protocol, or one address or a VLAN in your network data.'],
 [trBadge('manual'),'Assigned by you in <b>Check and decide</b>.'],
 [trBadge(null),'The evidence allows several interfaces; the candidates are offered to choose from.']])}
<p>Traffic of a protocol that has no interface on the map (a Diameter application such as NASREQ, M3UA, routing protocols, ARP …) is listed under <b>Not mapped</b>.</p>`);
 add('tr-read','Trace analysis','1 · Reading the capture',`
<ul class="hpul">
<li><b>pcap</b> with microsecond or nanosecond timestamps in either byte order (also the modified pcap format of patched tcpdump versions), and <b>pcapng</b> with any number of sections and capture interfaces (Enhanced, Simple and the obsolete Packet blocks; interface names from <code>if_name</code>, else <code>if_description</code>; timestamp resolution from <code>if_tsresol</code>).</li>
<li><b>gzip</b>-compressed files are recognised by their first bytes, whatever their name, and decompressed while reading (current Chrome, Edge, Firefox; Safari 16.4+). Zstandard- or LZ4-compressed files are not supported – save them uncompressed or as .gz.</li>
<li>The file is read as a stream, never loaded whole; a progress bar shows how far it is, and <b>Cancel</b> stops it. A file that ends in the middle of a record is analysed as far as it goes, with a note that it may be truncated. A record longer than 16 MiB or a damaged pcapng block stops the reading with an error.</li>
<li><b>Several files</b> – one per probe port, say – are opened or dropped together and analysed as one capture. Each pcap file is one capture interface named after the file; the interfaces of a pcapng file keep their names, shown as <i>file · name</i>. A file that cannot be read is reported and skipped.</li></ul>
<h4>Link layer</h4>
${hpTblLinkTypes()}
<p>Other link types are listed under <b>Not mapped</b> as “Link type <i>n</i>”. After the Ethernet or Linux cooked header up to 8 further headers are unwrapped:</p>
<ul class="hpul">
<li><b>VLAN tags</b> – 802.1Q (0x8100), 802.1ad (0x88A8), 0x9100 and 0x9200. The VLAN IDs are kept, outer tag first, joined with a dot: QinQ <code>100.20</code>.</li>
<li><b>MPLS</b> (0x8847, 0x8848) – the label stack is skipped to the bottom-of-stack label; the payload is taken as IPv4 or IPv6 by its first four bits, anything else (a pseudowire control word, Ethernet over MPLS) is listed under Not mapped.</li>
<li><b>PPPoE</b> session frames (0x8864) carrying IPv4 or IPv6.</li></ul>
<p>Frames that are not IP – ARP, LLDP, LACP, PTP, Ethernet OAM, STP and other IEEE 802.3 / LLC frames – are listed under Not mapped by their EtherType.</p>
<h4>IP</h4>
<ul class="hpul">
<li><b>IPv4</b> and <b>IPv6</b>; the IPv6 Hop-by-Hop, Routing, Destination Options, Fragment and Authentication headers are skipped.</li>
<li><b>Fragments:</b> the first fragment is classified and decoded; the later fragments of the same datagram (same addresses, identification and protocol) are counted on the same flow, also when they arrive before the first one. There is no reassembly, so a signalling message split over IP fragments is decoded only as far as its first fragment reaches. Fragments whose first fragment never arrives are listed as “IP fragments without their first fragment”.</li>
<li><b>Tunnels other than GTP-U</b> – GRE, IP-in-IP, IPv6-in-IPv4, IPv4 AH – are not unwrapped: they count as plain IP with that protocol. VXLAN (UDP 4789) is an infrastructure protocol; its inner frames are not analysed.</li>
<li>Packets shorter than their own headers (a short snap length) are counted as <b>Truncated packets</b>, invalid IP headers as <b>Malformed packets</b>.</li></ul>`);
 add('tr-classify','Trace analysis','2 · Classifying packets by protocol',`
<p>Every IP packet is put into one <b>traffic class</b> by its transport protocol and port numbers – the source or the destination port, so both directions of a conversation land in the same class. The checks run from top to bottom; the first match decides. The analysis looks at ports, PPIDs and headers only – <b>a protocol on a non-standard port is recognised only when you add the port</b> to your network data under ${hpA('nd-ports','Protocol ports')}; otherwise GTP-U on another UDP port, say, is plain IP. Standard ports keep their meaning: your ports are used when neither port of a packet is a standard port, and on UDP also when a packet fails the header check of the standard protocol.</p>
${hpT(['Transport','Port or identifier','Traffic class'],[
 ['UDP','2152','<b>GTP-U</b> – if the header is GTP version 1 with the protocol-type bit set; otherwise plain IP'],
 ['UDP','2123','<b>GTPv1-C</b> (version 1 with the protocol-type bit) or <b>GTPv2-C</b> (version 2); otherwise plain IP'],
 ['UDP','8805','<b>PFCP</b> (version 1); otherwise plain IP'],
 ['UDP',ports(TR_RADPORT),'<b>RADIUS</b> (authentication, accounting, dynamic authorisation); shorter than 20 bytes → plain IP'],
 ['UDP','500','<b>IKEv2</b>'],
 ['UDP','4500','<b>IKEv2</b> after the 4-byte non-ESP marker; a single 0xFF byte is a NAT-T keepalive (IKE); anything else is <b>IPsec ESP</b> in UDP (RFC 3948)'],
 ['UDP / TCP','3386','<b>GTP′</b> (CDR transfer) – counted, not decoded'],
 ['UDP','your protocol ports','the protocol you set for the port, with the same header check'],
 ['UDP',Object.entries(TR_INFRA_UDP).map(([p,n])=>esc(n)+' '+p).join(', '),'Network infrastructure – Not mapped'],
 ['TCP','3868','<b>Diameter</b> – messages re-assembled per direction'],
 ['TCP','5868','<b>Diameter over TLS</b> – counted, not decoded'],
 ['TCP','your protocol ports','the protocol you set for the port (Diameter, Diameter over TLS, GTP′)'],
 ['TCP',Object.entries(TR_INFRA_TCP).map(([p,n])=>esc(n)+' '+p).join(', '),'Network infrastructure – Not mapped'],
 ['SCTP','PPID of the DATA chunks, else the standard port, else your protocol ports','see the table below'],
 ['IP protocol','50','<b>IPsec ESP</b>'],
 ['IP protocol',Object.entries(TR_INFRA_IP).map(([p,n])=>esc(n)+' '+p).join(', '),'Network infrastructure – Not mapped'],
 ['anything else','other UDP and TCP, ICMP, ICMPv6, GRE …','<b>Plain IP</b>']])}
<h4>SCTP</h4>
<p>An SCTP association (both address and port pairs plus the VLAN) gets its class from the first DATA chunk with a known payload protocol identifier (PPID), else from the well-known port of either side, else from your protocol ports; the class is remembered for the association’s other packets (SACK, HEARTBEAT …). Associations with neither are “SCTP (other)” – Not mapped.</p>
${hpTblSctp()}
<p>The <b>listening side</b> – the address using the well-known port, or your port for the protocol – tells the element: an eNodeB connects to the MME on 36412, so the address on 36412 is the MME.</p>`);
 add('tr-decode','Trace analysis','3 · What is decoded',`
<p>Signalling is decoded only as far as needed for evidence, names and counts. User-plane payload is counted, never kept.</p>
${hpT(['Protocol','Read from each message'],[
 ['GTP-U (TS 29.281)',`Message type; the extension headers <b>PDU Session Container</b> (0x85) and <b>NR RAN Container</b> (0x84) are counted. From G-PDUs the inner IP source and destination (IPv6: the /64 prefix) – of the first 512 G-PDUs of each tunnel address pair and of every 64th after that – to learn UE addresses, together with the tunnel (up to 4 per address) and the direction they were seen in. From <b>every</b> G-PDU the SYN, ACK and RST flags of an inner TCP packet (not of later IP fragments; IPv6 only when TCP directly follows the fixed header) – for the ${hpA('tr-dir','direction of tunnels without signalling')}.`],
 ['GTPv1-C (TS 29.060)','Message type, Cause, GSN Address IEs, Direct Tunnel Flags.'],
 ['GTPv2-C (TS 29.274)','Message type (also piggybacked messages, up to 4 per packet), Cause, every F-TEID (interface type, IPv4 / IPv6 address) – also inside Bearer Context and PDN Connection IEs.'],
 ['PFCP (TS 29.244)','Message type (also follow-on messages, up to 4 per packet), sequence number, Cause, Node ID; in Create / Update PDR, Create / Update FAR, Created PDR and Create / Created / Update Traffic Endpoint: PDR ID, Traffic Endpoint ID, Source and Destination Interface, <b>3GPP Interface Type</b>, local F-TEID, Outer Header Creation, QFI.'],
 ['Diameter (RFC 6733)',`Header (Application-Id, command code, request flag); Origin-Host, Result-Code and Experimental-Result-Code, CC-Request-Type, Service-Context-Id, Auth- / Acct-Application-Id (also inside Vendor-Specific-Application-Id) of CER / CEA, and the 3GPP AVPs IP-CAN-Type, RAT-Type and ULR-Flags; Framed-IP-Address of Gx CCRs. Over TCP the messages are re-assembled per direction; over SCTP the DATA chunks that begin a message are decoded. The first ${trNum(TR_DIA_CAP/1024)} kB of each message are decoded.`],
 ['RADIUS (RFC 2865, 2866, 5176; TS 29.061)','Code, Acct-Status-Type, NAS-Identifier, Framed-IP-Address, the 3GPP-RAT-Type vendor-specific attribute.'],
 ['IKEv2 (RFC 7296)','Exchange type, request or response, the Initiator flag.'],
 ['SCTP (RFC 9260)','Chunks (up to 64 per packet) and the PPID of DATA chunks.'],
 ['TCP in plain IP','The SYN, ACK and RST flags – which address opens and which accepts each connection, for the '+hpA('tr-dir','direction on SGi / Gi / N6')+'.']])}
<p><b>Names</b> come from the Diameter Origin-Host, the PFCP Node ID (FQDN or address) and the RADIUS NAS-Identifier of the sending address – shown next to the addresses and used to name suggested instances. <b>Rejected responses</b> (GTPv1-C Cause ≥ 192, GTPv2-C Cause 64–239, PFCP Cause ≥ 64, RADIUS Access-Reject, Disconnect-NAK, CoA-NAK) and <b>Diameter answers with a result code ≥ 3000</b> are counted in <b>Protocol details</b>.</p>
${hpNote('<b>Never read:</b> IMSI, MSISDN, IMEI, User-Name, Subscription-Id, APN and any user-plane content. UE addresses are used only to recognise plain IP and are never listed.')}`);
 add('tr-flows','Trace analysis','4 · Flows, groups and counting',`
<ul class="hpul">
<li>A <b>flow</b> is one traffic class (for Diameter: one Application-Id) between two addresses, in both directions, on one VLAN tag (stack). <b>Ports are not part of it</b>: all GTP-U between two addresses is one flow, all Gx between two Diameter peers is one flow. Every interface decision is made per flow.</li>
<li>Each flow counts packets and bytes (the original length, also of truncated packets) per direction and per capture interface, message names, and the evidence of §3.</li>
<li><b>Diameter base messages</b> (CER / CEA, DWR / DWA, DPR / DPA – Application-Id 0) are added to the busiest application flow of the same address pair and VLAN; only peers that exchanged nothing else remain as “Diameter base”. Packets of a Diameter TCP connection that start no message (acknowledgements, continued segments) are counted on the flow of the message they belong to.</li>
<li><b>Plain IP</b> is counted per VLAN and capture interface (one group each), with packets per source and per destination address (IPv6 per /64 prefix) – up to ${hpN(TR_PLAIN_MAX)} addresses per group and ${hpN(TR_PLAIN_TOTAL)} in total; beyond that packets are counted without their address.</li>
<li><b>Decision groups</b> (<b>Check and decide</b>): flows that are not certain, grouped by traffic class (Diameter: application), VLAN and capture interface. Plain-IP groups are always listed there.</li></ul>`);
 add('tr-evidence','Trace analysis','5 · From evidence to interface',`
<p>Each flow has <b>candidate interfaces</b> – the ones on the map its protocol can run on:</p>
${hpTblCands()}
<p>The interface of a flow is then decided in this order:</p>
<ol class="hpol">
<li><b>Protocol evidence</b> – the rules for ${hpA('tr-gtpu','GTP-U')}, ${hpA('tr-gtpc','GTPv2-C and GTPv1-C')}, ${hpA('tr-pfcp','PFCP')}, ${hpA('tr-dia','Diameter')}, ${hpA('tr-radius','RADIUS')}, ${hpA('tr-plain','plain IP')} and ${hpA('tr-sctp','SCTP, IKEv2 / ESP and GTP′')}. A result can be one interface, two interfaces of a combined node, or a reduced list of candidates.</li>
<li><b>Your network data</b> – only when step 1 is not certain; see ${hpA('tr-nd','How your network data is used')}.</li>
<li><b>Your choice</b> in Check and decide – only when steps 1 and 2 are not certain; it applies to the whole group.</li></ol>
<p>Certain results are never overridden. In the interface list, <b>mixed</b> means that the flows of one interface have different confidence (hover for the split), and <b>shared</b> that the same traffic is counted on two interfaces of a combined node – a GGSN / P-GW that uses Gx with both 3GPP-GPRS and 3GPP-EPS appears on both Gx interfaces.</p>`);
 add('tr-gtpu','Trace analysis','GTP-U',`
<p>GTP-U looks the same on S1-U, S5 / S8, N3, Gn and a dozen other interfaces. What tells them apart is the <b>signalling that set the tunnels up</b>: every address the capture’s GTPv2-C, GTPv1-C or PFCP signals for the user plane gets a <b>role</b> – interface, element, plane.</p>
<h4>Roles from GTPv2-C F-TEIDs</h4>
${hpTblFteid()}
<p>Other F-TEID types (data forwarding, MBMS, S2a, PMIPv6, S16 …) are counted in Protocol details but give no role.</p>
<h4>Roles from GTPv1-C</h4>
<ul class="hpul">
<li><b>Create PDP Context Request</b>: the sender is the SGSN, the receiver the GGSN (Gn / Gp control plane). Its GSN Address IEs in order: SGSN Address for signalling (Gn control plane), SGSN Address for user traffic (Gn or Iu-PS user plane), then the optional second (IPv6) pair.</li>
<li>Accepted <b>Create PDP Context Response</b> (Cause 128–191): GGSN Address for Control Plane, GGSN Address for user traffic (Gn or Direct Tunnel).</li>
<li><b>Update PDP Context Request</b> with the Direct Tunnel flag (DTI): the address for user traffic is the RNC’s – Direct Tunnel.</li></ul>
<h4>Roles from PFCP</h4>
<p>A local F-TEID in a PDR or Traffic Endpoint with a 3GPP Interface Type belongs to the user-plane function; the Outer Header Creation address in a FAR with a 3GPP Interface Type is its GTP-U peer. When the CP function lets the UP function choose the F-TEID, the address is taken from the Created PDR / Created Traffic Endpoint of the matching response (same sequence number and address pair). Source or Destination Interface (Access, Core …) alone gives no role.</p>
${hpTblPf3()}
<h4>The rule for a GTP-U flow</h4>
<ol class="hpol">
<li>Both addresses have user-plane roles that share exactly one candidate interface, and their elements sit on opposite ends of it → that interface, ${trBadge('sure')}. Several such interfaces → undecided between them.</li>
<li>Only one address has roles: exactly one candidate interface → ${trBadge('likely')}; several → undecided between them. If both have roles but share no interface, the signalling does not decide.</li>
<li>Otherwise, a <b>PDU Session Container</b> extension header (5GC user plane) → ${hpIf('n3')}, ${trBadge('likely')} (candidates ${hpIfs(['n3','n9'],' and ')}).</li>
<li>Otherwise, an <b>NR RAN Container</b> → undecided between ${hpIfs(['x2endc','xn','f1u'],', ')}.</li>
<li>Otherwise undecided among all GTP-U candidates – then network data or your choice.</li></ol>
${hpNote('<b>Tip:</b> F-TEIDs are exchanged when sessions and bearers are created or modified. Capture the S11 / S5 GTPv2-C, the N4 / Sxa / Sxb PFCP or the Gn GTPv1-C together with the user plane, starting before the sessions are set up – a capture of long-established tunnels often contains no F-TEIDs for them.')}`);
 add('tr-gtpc','Trace analysis','GTPv2-C and GTPv1-C',`
<h4>GTPv2-C</h4>
<ol class="hpol">
<li>Roles come from the control-plane F-TEID types (${hpA('tr-gtpu','table under GTP-U')}). In addition, the sending address of a message gets the role of its own top-level sender F-TEID (instance 0) when that F-TEID carries another address.</li>
<li>The same rule as for GTP-U, with the control-plane roles: both addresses share exactly one candidate interface, on opposite ends → ${trBadge('sure')}; only one address signalled, with exactly one candidate → ${trBadge('likely')}; several → undecided between them. If both are signalled but share no interface, the signalling does not decide.</li>
<li>Without roles: <b>SRVCC PS to CS</b> messages (types 25–31) → ${hpIf('sv')}, ${trBadge('likely')}; <b>MME / SGSN mobility</b> messages (types 128–141: Identification, Context, Forward Relocation, Relocation Cancel …) → undecided between ${hpIfs(['s10','s3','n26'],', ')}; otherwise undecided among all GTPv2-C candidates.</li></ol>
<h4>GTPv1-C</h4>
<p>The GTPv1 control plane is used only on ${hpIf('gn')} → ${trBadge('sure')}. A flow with only SGSN Context / Forward Relocation messages (types 50–60) and no Create, Update or Delete PDP Context Request runs between two SGSNs; it is placed on Gn / Gp as ${trBadge('likely')}, because the map draws Gn only between SGSN and GGSN.</p>`);
 add('tr-pfcp','Trace analysis','PFCP',`
<p>All 3GPP Interface Types seen in a PFCP association – in either direction, in any message – decide together:</p>
<ol class="hpol">
<li>Any 5GC type (${TR_PF_N.map(t=>esc(TR_PF3[t][0])).join(', ')}) → ${hpIf('n4')}, ${trBadge('sure')} – also when EPS types appear as well (combined SMF + PGW-C / UPF + PGW-U).</li>
<li>SGW types (${TR_PF_A.map(t=>esc(TR_PF3[t][0])).join(', ')}) <i>and</i> PGW types (${TR_PF_B.map(t=>esc(TR_PF3[t][0])).join(', ')}) → ${hpIfs(['sxa','sxb'],' and ')} of a combined SGW-U / PGW-U, ${trBadge('sure')}.</li>
<li>Only SGW types → ${hpIf('sxa')}; only PGW types → ${hpIf('sxb')} – ${trBadge('sure')}.</li>
<li>No interface type, but a QoS Flow Identifier (QFI) → ${hpIf('n4')}, ${trBadge('likely')}.</li>
<li>Otherwise undecided between ${hpIfs(TR_CLS.pfcp.c,', ')}.</li></ol>
<p>S5 / S8-U, S8-U and the data-forwarding types do not decide: SGW-U and PGW-U both use them. Sxa and Sxb exist on the map only in the CUPS view of the EPC; the panel offers to switch. The CP function is the address that sends the Session Establishment, Modification and Deletion Requests (and receives the Session Report Requests).</p>`);
 add('tr-dia','Trace analysis','Diameter',`
<p>A Diameter flow is decided by the <b>Application-Id</b> in its message headers, with a deciding AVP where one application serves several interfaces:</p>
${hpTblDia()}
<ul class="hpul">
<li><b>Gx</b> – IP-CAN-Type in the CCRs: only 3GPP-GPRS → ${hpIf('gx3g')}; only 3GPP-EPS and / or Non-3GPP-EPS → ${hpIf('gx')}; both → both (combined GGSN / P-GW) – ${trBadge('sure')}. No IP-CAN-Type in the capture → ${hpIf('gx')}, ${trBadge('likely')}.</li>
<li><b>Credit-Control (Gy / Ro) and Accounting (Gz / Rf)</b> – Service-Context-Id (TS 32.299): IMS charging (…32260@3gpp.org) or MMTel (…32275@3gpp.org) in at least as many messages as PS charging → ${hpIf('rorf')}, ${trBadge('sure')}. PS charging (…32251@3gpp.org) → ${trBadge('likely')}: ${hpIf('gy3g')} if the same client – by address or Origin-Host – uses Gx with 3GPP-GPRS, both if it uses both IP-CAN types, otherwise ${hpIf('gy4g')}. Other or no Service-Context-Id → undecided.</li>
<li><b>S6a / S6d</b> – ULR-Flags of the Update Location Requests: S6a/S6d-Indicator set → ${hpIf('s6a')} (MME), cleared → ${hpIf('s6d')} (SGSN), both → both – ${trBadge('sure')}. No ULR in the capture → ${hpIf('s6a')}, ${trBadge('likely')}.</li>
<li><b>Only base messages</b> between two peers: the applications they advertise in CER / CEA. If these point to exactly one interface – Gx counts as ${hpIf('gx')}, S6a / S6d as ${hpIf('s6a')}, Credit-Control and Accounting point to none – that interface, ${trBadge('likely')}; otherwise undecided.</li>
<li>Any other application with an interface on the map → that interface, ${trBadge('sure')}. Applications without one are listed under Not mapped by name.</li>
<li><b>Diameter over TLS / DTLS</b> (TCP 5868, SCTP PPID 47): the application cannot be read → undecided among the Diameter interfaces.</li></ul>
<p>The <b>client</b> is the address that sends the requests in the last column (only the client side sends them) – it orients the two ends, see ${hpA('tr-ends','Which element is which')}. Framed-IP-Address in Gx CCRs feeds the ${hpA('tr-plain','plain-IP')} recognition.</p>`);
 add('tr-radius','Trace analysis','RADIUS',`
<p>The GGSN, P-GW or SMF is the RADIUS client towards an AAA server in the packet data network (TS 29.061), so RADIUS is placed on the data-network interface of the node:</p>
<ol class="hpol">
<li>The 3GPP-RAT-Type values of the Access- and Accounting-Requests – the most frequent decides, ${trBadge('likely')}:</li></ol>
${hpTblRat()}
<ol class="hpol" start="2">
<li>Otherwise, the RADIUS client also uses Gx – by address or Origin-Host: only 3GPP-GPRS → ${hpIf('gi')}, only 3GPP-EPS / Non-3GPP-EPS → ${hpIf('sgi')} – ${trBadge('likely')}.</li>
<li>Otherwise undecided between ${hpIfs(TR_CLS.radius.c,', ')}.</li></ol>
<p>The client is the address that sends Access- / Accounting-Requests or receives Disconnect- / CoA-Requests. Framed-IP-Address of the requests, together with the side its RAT type implies, feeds the ${hpA('tr-plain','plain-IP')} recognition.</p>`);
 add('tr-plain','Trace analysis','Plain IP (SGi / Gi / N6)',`
<p>Everything that is not a mobile-core protocol is plain IP – user traffic on SGi, Gi and N6, but also SBI (HTTP/2), SIP, DNS or O&amp;M traffic. It is recognised through the <b>UE addresses</b> learned elsewhere in the capture:</p>
<ul class="hpul">
<li><b>Inside GTP-U.</b> The data-network side follows from the tunnels an address was seen in:</li></ul>
${hpTblUpdn()}
<ul class="hpul">
<li style="list-style:none">An address is used only if all its tunnels (up to 4 are remembered) are decided and lead to the same side – a server on the internet shows up behind S1-U, N3 and Gn alike and is not used – and not if the direction shows it is the far end, i.e. the inner destination of uplink or the inner source of downlink packets (${hpA('tr-dir','direction')}).</li>
<li><b>Framed-IP-Address in Gx CCRs</b> – IP-CAN-Type 3GPP-GPRS → Gi, 3GPP-EPS or Non-3GPP-EPS → SGi.</li>
<li><b>Framed-IP-Address in RADIUS requests</b> – the side from the 3GPP-RAT-Type (${hpA('tr-radius','table')}).</li></ul>
<p>A Framed-IP-Address without a side is not used. IPv6 UEs are recognised from GTP-U only, by their /64 prefix (Framed-IPv6-Prefix is not read). At most ${hpN(TR_UE_MAX)} user-plane addresses are learned; beyond that the count is shown with a +.</p>
<h4>The rule for a plain-IP group</h4>
<ol class="hpol">
<li>The packets of all matched addresses in the group (as source or destination) are added up per data-network side; the side with the most → that interface, ${trBadge('likely')}, with “part looks like …” when another side has more than 10 % of it.</li>
<li>Otherwise, the interface VLAN in your network data → ${trBadge('likely')}.</li>
<li>Otherwise undecided: “No mobile-core protocol; the addresses were not seen in GTP-U, Gx or RADIUS”.</li></ol>
${hpNote('A group is one VLAN on one capture interface, and its decision applies to all of its packets – also to traffic that is not UE traffic. The interface list shows how many addresses were matched and how many were not. Mark groups of SBI, SIP or O&amp;M traffic as <i>Not a mobile-network interface</i>, or separate them by VLAN or capture interface.')}
<p>Addresses in your network data are not used for plain IP (its addresses are UEs and servers), only the interface VLAN. The uplink is the traffic from the UE side, the downlink the traffic to it – from the UE addresses or from TCP connection set-up (${hpA('tr-dir','direction')}). Plain-IP addresses are not listed as elements.</p>`);
 add('tr-sctp','Trace analysis','SCTP, IKEv2 / ESP and GTP′',`
<ul class="hpul">
<li><b>S1AP, NGAP, XnAP, F1AP, E1AP, SGsAP, NBAP</b> each run on one interface of the map → ${trBadge('sure')} (${hpA('tr-classify','PPIDs and ports')}).</li>
<li><b>X2AP</b> → undecided between ${hpIfs(TR_CLS.x2ap.c,' and ')}.</li>
<li><b>RUA</b> and <b>HNBAP</b> (Iuh), <b>M3UA</b> (SIGTRAN) and other SCTP → Not mapped.</li>
<li><b>Diameter over SCTP</b> → the ${hpA('tr-dia','Diameter rules')}. A message split over several DATA chunks is decoded as far as its first chunk reaches.</li>
<li><b>IKEv2 and ESP</b> → ${hpIf('swu')}, ${trBadge('likely')}: it is the only IPsec interface on the map, and IPsec on RAN backhaul looks the same – mark that as not a mobile-network interface. The initiator of IKE_SA_INIT is the UE side.</li>
<li><b>GTP′</b> carries CDRs from the GGSN (Ga) or the P-GW (Gz) → undecided between ${hpIfs(TR_CLS.gtpp.c,' and ')}.</li></ul>`);
 add('tr-nd','Trace analysis','How your network data is used',`
<p>Loading your ${hpA('nd','network data')} makes the results more precise. All instances are used, whatever the site filter shows. An address matches an instance address exactly or lies in an instance range (<code>enb,*,…,198.51.100.128/26</code>); the subnet set in an interface’s info counts too.</p>
<ul class="hpul">
<li><b>Interface</b> – only where the protocol evidence is not certain:
 <ul><li>both addresses on the same candidate interface → that interface, ${trBadge('sure')};</li>
 <li>exactly one candidate interface among the interfaces of the two addresses → ${trBadge('likely')}, but only if the protocol left the interface open, agrees, or lists it as a candidate – one listed address never overrides protocol evidence, because one address often serves several interfaces (an OCS on Gy and Ro);</li>
 <li>otherwise the VLAN of exactly one candidate interface (any tag of a QinQ stack) → ${trBadge('likely')}.</li></ul></li>
<li><b>Element</b> – an address listed for an element at one end of the interface is that element; this comes before the signalling (${hpA('tr-ends','next section')}).</li>
<li><b>Names</b> – instance names are shown next to the addresses, with their site.</li>
<li><b>Protocol ports</b> – non-standard ports of your network are recognised while the capture is read (${hpA('nd-ports','Protocol ports')}).</li></ul>
${hpNote('The analysis treats your network data as fact: a wrong entry gives a wrong result. Add suggestions from a trace only when you know they are right.')}`);
 add('tr-ends','Trace analysis','6 · Which element is which',`
<p>For every flow and its interface, each address gets one of the interface’s two ends. The first rule that applies wins:</p>
<ol class="hpol">
<li><b>Network data</b> – the address is listed for an element at one end of the interface.</li>
<li><b>Signalling</b> – a role for this interface with an element: the F-TEID owner, the GSN address, the PFCP interface type (${hpA('tr-gtpu','GTP-U')}).</li>
<li><b>The client</b> – the address that sends most client requests on the interface:</li></ol>
${hpTblClient()}
<ol class="hpol" start="4">
<li><b>The listening side</b> of SCTP – the address on the well-known port or on your port for the protocol: ${Object.entries(TR_SCTPSRV).map(([c,e])=>esc(TR_CLS[c].n)+' → '+hpE(e)).join(', ')}.</li>
<li><b>The other end</b> – when one address is known, the other is the element at the opposite end of the interface.</li>
<li><b>TCP set-up inside the tunnel</b> – when nothing is known on a GTP-U interface with an uplink direction (${hpA('tr-dir','table in the next section')}): the TCP handshakes carried inside the tunnel. The end that sends at least 90 % of the inner SYNs (and receives the SYN-ACKs), over at least ${TR_HS_MIN} SYN and SYN-ACK packets (${TR_HS_MIN/2} handshakes when both directions are captured), is the UE-side end – the eNodeB on S1-U, the gNB on N3, the SGW on S5 – the other end the core side. ${trBadge('likely')} at best: it assumes the UE opens the connections. Suggestions based on this rule are never pre-selected.</li>
<li><b>Fan-out</b> – when nothing is known on a RAN interface (${hpIfs(Object.keys(TR_UPSIDE).filter(k=>TR_RAN.includes(TR_UPSIDE[k])).concat(['s1mme','n2']),', ')}): an address with at least 3 peers on it while its peer has at most 2 is the core side, its peers are RAN nodes. Suggestions based on this rule are never pre-selected.</li></ol>
<p>Elements and addresses lists each address with the element it has for most packets; hover the element for the rule that set it. An element of the classic view and its CUPS functions (SGW and SGW-C / SGW-U, PGW and PGW-C / PGW-U) count as the same element.</p>`);
 add('tr-dir','Trace analysis','7 · Uplink, downlink and capture interfaces',`
<p><b>Uplink</b> runs from the UE side towards the core and the data network – eNodeB → SGW on S1-U, gNB → UPF on N3, SGSN → GGSN on Gn, UE → server on SGi / Gi / N6; <b>downlink</b> the reverse.</p>
<ul class="hpul">
<li><b>GTP-U:</b> packets leaving the UE-side end of the tunnel are uplink. The direction is known when exactly one end of the flow has been identified as that element (${hpA('tr-ends','previous section')}):</li></ul>
${hpTblUpside()}
<ul class="hpul">
<li style="list-style:none">N9, X2-U and Xn-U have no uplink direction here.</li>
<li><b>Tunnels without signalling:</b> where no rule of the ${hpA('tr-ends','previous section')} identifies an end – no GTP-C / PFCP for the tunnel in the capture, no network data – the TCP connections inside the tunnel orient it: the inner SYN travels uplink, the inner SYN-ACK downlink. Each SYN and each SYN-ACK is one vote; per flow (all GTP-U between the two addresses) at least ${TR_HS_MIN} votes – ${TR_HS_MIN/2} handshakes when both directions are captured – and at least 90 % of them one way; otherwise the direction stays open. This also tells the RAN end from the core end on S1-U and N3. Interfaces and capture interfaces whose direction comes mostly from it say so (<i>TCP set-up</i>).</li>
<li><b>UE addresses:</b> the inner source of uplink and the inner destination of downlink packets is a UE; the inner destination of uplink and the inner source of downlink packets is the far end (a server). An address seen both ways stays open.</li>
</ul>
<h4>SGi, Gi and N6 (plain IP)</h4>
<p>For a plain-IP group whose interface is SGi, Gi or N6 – decided by the analysis, by the VLAN in your network data or by you – every address is placed on the <b>UE side</b> or the <b>far side</b>:</p>
<ol class="hpol">
<li><b>From the signalling</b>, where it says something: UE addresses from Gx or RADIUS (Framed-IP-Address with a side) or confirmed as UEs by the tunnel direction; far ends seen as the inner destination of uplink GTP-U packets. A UE or far end known only from tunnels oriented by their inner TCP set-up counts as a TCP role (next point), not as signalling.</li>
<li>Otherwise <b>from TCP connection set-up</b>: on the data-network side the UE usually opens the connections. An address that opened at least 90 % of its TCP handshakes – it sent the SYN, or received the SYN-ACK – is on the UE side; one that accepted at least 90 % – it received the SYN, or sent the SYN-ACK – is on the far side; anything in between stays open. The handshakes are counted per address (IPv6: per /64 prefix) over the whole capture, so a UE whose SYN leaves on one capture interface and whose SYN-ACK comes back on another is recognised on both, and all of its packets follow – its UDP and QUIC traffic too. The signalling, where there is any, wins over the TCP roles.</li></ol>
<p><b>Uplink</b> = packets from the UE side or to the far side, <b>downlink</b> = packets to the UE side or from the far side. Both sums are made once over the UE-side addresses and once over the far-side addresses; the larger of each is used, so a packet between a UE and a server is never counted twice. Packets between addresses without a role stay of unknown direction (<b>?</b>).</p>
${hpNote('<b>Assumption</b> (plain IP and tunnels without signalling): the UE side opens the connections. That holds for the usual internet traffic – browsing, apps, video. It is inverted where servers open connections to the UEs: M2M or IoT APNs whose platform polls the devices, services hosted on UEs, scans of public UE addresses. Such traffic counts in the wrong direction; where it dominates a capture interface, the verdict is wrong. Capture interfaces and interfaces whose direction comes mostly from TCP set-up say so (<i>TCP set-up</i>). Plain IP that is undecided or marked as not a mobile-network interface – O&amp;M, SBI – gets no direction.')}
<h4>Per capture interface</h4>
<ul class="hpul">
<li>A <b>capture interface</b> is a pcapng interface (its name, e.g. a DPDK port, else its description) or a pcap file.</li>
<li>Its user plane of known direction decides: <b>↑ Uplink</b> when at least 95 % of those packets are uplink, <b>↓ Downlink</b> when at least 95 % are downlink, otherwise <b>⇅ Both directions</b>. The shares are shown per capture interface and per interface on it, with the number of packets of unknown direction (<b>?</b>). When at least half of them got their direction from TCP set-up, the capture interface says <i>mostly from TCP connection set-up</i>.</li>
<li>For signalling, each interface on a capture interface shows its sending direction (“PGW → PCRF”, element names or addresses) when at least 95 % of its packets go one way, otherwise “⇄ both directions”. “Signalling: one direction” means that at least 95 % of the signalling packets on the capture interface belong to flows seen there in one direction only.</li>
<li>An uplink and a downlink capture interface that carry the same interface are pointed out – typical for probes or taps with one port per direction.</li></ul>`);
 add('tr-results','Trace analysis','8 · Reading the results',`
${hpT(['Part','What it shows'],[
 ['<b>Sections</b>','Each part below is a section with its own colour that folds open and closed (click its title, or <i>Expand all</i> / <i>Collapse all</i>); a folded section still shows its key figures – confidences, directions, open decisions. Interfaces, capture interfaces and Check and decide start open; Elements and addresses start open for up to 20 addresses; Not mapped and Protocol details start closed. Your choice is kept while the page is open. Check and decide is tinted while something is undecided.'],
 ['<b>Map</b>','Every identified interface carries a badge with its packet count, coloured by the dominant confidence; the rest of the map is dimmed. Click a badge to select the interface in the list.'],
 ['<b>Interfaces in this trace</b>','Interface and ends, protocols, packets (with the ↑ / ↓ share where known), bytes, the confidence and the reason (+n: other reasons, in the tooltip). Hover a row to highlight it on the map, click it to zoom there; the interface name opens its details, where <b>In the trace</b> lists the addresses on each side.'],
 ['<b>Capture interfaces and direction</b>',hpA('tr-dir','Direction per capture interface')+' and the interfaces on each.'],
 ['<b>Check and decide</b>','Everything not certain, grouped by protocol, VLAN and capture interface, with the reason and a selector: the candidates first, then the other interfaces of the same plane, and <i>Not a mobile-network interface</i>. <i>— automatic —</i> keeps the analysis’s own result. A choice applies to the whole group and is forgotten when the trace is closed. <b>Several groups at once:</b> tick them (Shift-click ticks a range, the box in the header all; or <i>select all · undecided · likely</i>), choose the interface in the bar above the table – the candidates of the ticked groups first, then the other interfaces of their plane(s), <i>Not a mobile-network interface</i>, or <i>automatic</i> to remove your choices – and <b>Apply</b>.'],
 ['<b>Elements and addresses</b>','Every address of the mobile-core traffic (not plain IP, not Not mapped) with its element where known, names (◆ from your network data, others from the protocols), interfaces and packets – the first 60, or all. Element panels list their addresses from the trace. <b>◆ Add to network data…</b> – '+hpA('tr-sug','see below')+'.'],
 ['<b>Not mapped</b>','Diameter applications and SCTP protocols without an interface on the map, non-IP frames, infrastructure protocols, unsupported link types, truncated and malformed packets, orphaned fragments.'],
 ['<b>Protocol details</b>','Per protocol: messages, rejected responses, Diameter error answers, G-PDUs and extension headers, F-TEID types, 3GPP Interface Types, IP-CAN-Type, RAT-Type, 3GPP-RAT-Type, Service-Context-Id.']])}
<p><b>⧉ filter</b> on a row copies a Wireshark display filter for its packets, and <b>Save results…</b> writes the results with your decisions to a file (${hpA('tr-save','next section but one')}). <b>Open another…</b> replaces the trace, <b>Close trace</b> discards it, <b>✕</b> returns to the overview with the trace kept (<b>⇅ Trace</b> brings it back). Interfaces that exist only in the CUPS view, or are hidden by the plane filter, are pointed out.</p>`);
 add('tr-sug','Trace analysis','Add to network data',`
<p><b>◆ Add to network data…</b> (in Elements and addresses) turns the identified addresses into suggestions for your network data, grouped into instances:</p>
<ul class="hpul">
<li><b>Instance</b> – one per element and name. The name is the first label of the Diameter Origin-Host, PFCP Node ID or RADIUS NAS-Identifier when there is one, else <i>element address</i>; it can be edited.</li>
<li><b>Address</b> – with the interface as the network-data editor names it for that element (only interfaces the element has there), the VLAN (a QinQ stack goes into the note) and the <b>port</b>: the port(s) on which the address was seen using the protocol, standard or one of your protocol ports – typically the server of Diameter and RADIUS (a RADIUS client that receives CoA-Requests gets 3799), both ends of GTP-U, GTP-C and PFCP, the listening side of SCTP. An address seen only on other (ephemeral) ports gets none, except for GTP-U, GTP-C and PFCP, which listen on the same port at both ends: there it gets its peer’s port. The evidence becomes the address note.</li>
<li><b>Selection</b> – certain addresses are selected; likely and assigned ones are left to you. Addresses already in your network data are marked: <i>already in your network data</i> (cannot be added again), <i>in your network data as …</i> another instance, or <i>within the range of …</i>.</li>
<li>A <b>site</b> can be chosen for the new instances. Without network data a new dataset is started.</li></ul>
<p>Nothing is stored or saved until you export your network data from <b>◆ Network data</b>.</p>`);
 add('tr-save','Trace analysis','Wireshark filters and saved results',`
<h4>⧉ filter – a Wireshark display filter per row</h4>
<p>Interfaces, capture interfaces, Check and decide, Elements and addresses and the Diameter / SCTP rows of Not mapped have a <b>⧉ filter</b> button. It copies a display filter that shows the same packets in Wireshark – paste it into the filter bar of the same capture. The filter is built from what the analysis saw:</p>
<ul class="hpul">
<li><b>Address pairs</b> – every flow of the row as <code>ip.addr==A &amp;&amp; ip.addr==B</code> (<code>ipv6.addr</code> for IPv6), grouped around the address that most pairs share: <code>ip.addr==X &amp;&amp; (ip.addr==a || ip.addr==b)</code>. Above ${trNum(TR_WS_MAXPAIRS)} pairs the filter keeps the protocol only (the message says so).</li>
<li><b>Protocol</b> – per traffic class, at its standard port:</li></ul>
${hpTblWs()}
<ul class="hpul">
<li style="list-style:none">Where one of your ${hpA('nd-ports','protocol ports')} was used, the class is matched by those port numbers instead (Wireshark decodes them only with <i>Decode As</i>, but the filter matches anyway); Diameter on such a port is then matched for all applications between the two addresses.</li>
<li><b>IP fragments</b> – Wireshark reassembles fragmented packets and shows the protocol only on the last fragment; for a flow with fragments, <code>ip.flags.mf==1 || ip.frag_offset&gt;0</code> (IPv6: <code>ipv6.fraghdr.more==1 || ipv6.fraghdr.offset&gt;0</code>) is added to its protocol, so all its fragments are shown, as counted.</li>
<li><b>VLAN</b> – for a group of Check and decide: <code>vlan.id==<i>tag</i> || ieee8021ad.id==<i>tag</i></code> for each tag of the stack (Wireshark names an 802.1ad / QinQ outer tag <code>ieee8021ad.id</code>), or <code>!(vlan || ieee8021ad)</code> without one.</li>
<li><b>Capture interface</b> – <code>frame.interface_id==n</code>, the interface’s number within its file; nothing when the file has a single interface (with several files, open the file the message names).</li>
<li><b>Elements</b> – <code>ip.addr==</code> the address: all its packets, on every interface.</li></ul>
${hpNote('<b>Plain IP has no protocol of its own.</b> Its filter is the VLAN and capture interface of each group and “IP that is none of the recognised protocols” – the same ports and IP protocols the analysis uses, your protocol ports included. It is <b>approximate</b>: packets the analysis passed to plain IP because their header check failed (UDP 2152 that is not GTP-U, say), and IPv6 packets whose protocol follows extension headers, are filtered differently. The message after copying says so. Sub-expressions are always in brackets, so the filters read the same in every Wireshark version.')}
<p>The copied filter is in brackets as a whole. <b>Paste it in place of the current filter</b> – appended to another one without <code>&amp;&amp;</code> or <code>||</code> between them, Wireshark rejects the result. The filters are tested with Wireshark 4.2: every filter of the test captures is accepted and selects exactly the packets the row counts.</p>
<h4>Save results…</h4>
<p><b>Save results…</b> (top of the trace panel) writes what the analysis found to a file – nothing is saved otherwise:</p>
${hpT(['Format','Contents'],[
 ['<b>JSON</b>','Everything: the capture (name, size, packets, time span, files), your protocol ports, the interfaces (packets, bytes, ↑ / ↓, confidence, protocols, evidence, the address and element at each end), the capture interfaces with their direction and the interfaces on each, the <b>decisions</b> (automatic result and your choice per group), the elements (address, element, the rule that set it, names, network-data instances, interfaces), Not mapped and the protocol details. Optionally your <b>network data</b> with its protocol ports – one file with all your data.'],
 ['<b>CSV</b>','The same tables for a spreadsheet, one block per part (<code># Interfaces</code>, <code># Decisions</code> …). Values that a spreadsheet would run as a formula are prefixed with an apostrophe.'],
 ['<b>Encrypted JSON</b>','The JSON, encrypted with a passphrase like your network data (AES-256-GCM, PBKDF2-SHA256).']])}
<p><b>Never saved:</b> packets, the capture itself, UE and server addresses of plain IP and inside GTP-U, subscriber identities. The file holds the addresses and names of your network elements – keep it like your network data (the repository’s <code>.gitignore</code> excludes <code>*.trace-results.*</code>).</p>
<h4>Applying saved decisions</h4>
<p>Your choices in Check and decide are forgotten when the trace is closed. To use them again, open the <b>same capture</b> (the same files, in the same order) and load the saved JSON – <b>Apply decisions from a file…</b> in Check and decide, or drop it on the page. A decision applies to the group with the same protocol, VLAN and capture interface; the message tells how many matched. Loaded through <b>◆ Network data → Load file…</b> or dropped, a file that also holds network data loads that too (replace or merge, as usual).</p>`);
 add('tr-limits','Trace analysis','Limits and tips',`
<h4>Not decoded</h4>
<ul class="hpul">
<li>Diameter over TLS (port 5868) or DTLS, HTTP/2 SBI, SIP, DNS and IPsec payloads; inner packets of GRE, IP-in-IP, VXLAN and Ethernet over MPLS; Zstandard- or LZ4-compressed files.</li>
<li>Protocols on non-standard ports that are not in your ${hpA('nd-ports','protocol ports')}.</li>
<li>Signalling beyond what is listed in ${hpA('tr-decode','What is decoded')}: the first ${trNum(TR_DIA_CAP/1024)} kB of each Diameter message, the first SCTP DATA chunk of a Diameter message, the first fragment of a fragmented IP packet. A lost or reordered TCP segment of a Diameter connection skips to the next segment that starts with a message.</li>
<li>Inner GTP-U addresses are sampled (the first 512 G-PDUs of each tunnel address pair, then every 64th).</li>
<li>TCP connection set-up is counted for at most ${hpN(TR_HS_MAX)} addresses; inside GTP-U it is not used.</li></ul>
<h4>For good results</h4>
<ul class="hpul">
<li>Capture the <b>signalling together with the user plane</b> – GTPv2-C, PFCP, GTPv1-C, Gx – and start before sessions are set up, so F-TEIDs, interface types, IP-CAN-Types and Framed-IP-Addresses are in the capture.</li>
<li>Load your <b>network data</b>, at least for the core nodes; their addresses settle what the protocols leave open and name the elements.</li>
<li>Keep <b>probe ports apart</b> – as pcapng interfaces or one file per port – to see the direction per port and to decide plain IP per port.</li>
<li>Use <b>Check and decide</b> for what remains, and <i>Not a mobile-network interface</i> for O&amp;M, SBI or backhaul traffic.</li></ul>`);

 /* ---------- network data ---------- */
 add('nd','Network data','Your IP plan',`
<p>The tool can show the IP addresses of <b>your</b> network next to the reference content: per element instance and interface, at both ends of an interface, in search, in the end-to-end procedures and in the trace analysis. The data is never part of the tool: you keep it in your own file and load it when you need it.</p>
${hpT(['In ◆ Network data','Result'],[
 ['<b>Load file…</b> (or drop a file on the page)','Reads a CSV, a JSON export, an encrypted JSON export, or an HTML file saved with data. With data already loaded you can replace it or merge into it (instances with the same element and name are combined).'],
 ['<b>New empty dataset…</b>','Start from scratch and enter instances in the tool.'],

<p><b>Editing:</b> select an element → <b>+ Add … instance</b> or <b>Edit</b> on an instance card (name, site, note, addresses with interface, address, port, VLAN, note). Select an interface → <b>Add / Edit interface info</b> for its subnet, VLAN and a note.</p>
<p><b>Site filter:</b> with more than one site a <b>Site: all ▾</b> button filters what is shown – panels, map badges, search – without changing the data. Instances with site <code>*</code> belong to every site.</p>

 add('nd-format','Network data','CSV and JSON format',`
<p>CSV: UTF-8, one row per address; the delimiter (<code>,</code> <code>;</code> or tab) is detected, so Excel files from any locale work. Lines starting with <code>#</code> are comments; <code># network: &lt;name&gt;</code> names the dataset.</p>
<pre class="hppre"># network: Example network
element,instance,site,interface,ip,port,vlan,note
mme,MME01,Site-A,s1mme,192.0.2.11,36412,101,SCTP primary path
sgw,SGW01,Site-A,s5,198.51.100.7,2123;2152,111,GTP-C and GTP-U
enb,*,*,s1mme,198.51.100.128/26,36412,101,eNodeB range
,,,s1mme,192.0.2.0/28,,101,S1-MME core VLAN</pre>
${hpT(['Column','Content'],[
 ['<code>element</code>','Element ID or its name as on the map (<code>MME</code>, <code>gNB-CU-CP</code> …). Empty: the row describes the interface itself (subnet, VLAN, note).'],
 ['<code>instance</code>','Your node name. <code>*</code> stands for all instances – useful for RAN ranges.'],
 ['<code>site</code>','Optional location for the site filter; <code>*</code> = every site.'],
 ['<code>interface</code>','Interface ID or name, resolved against the element’s interfaces (<code>Gx</code> on a GGSN is the GGSN Gx, <code>S8</code> means S5 / S8). Also <code>oam</code>, <code>sbi</code>, <code>other</code>.'],
 ['<code>ip</code>','IPv4 or IPv6 address, a CIDR range (zero host bits, e.g. <code>198.51.100.0/26</code>) or a host name. An address with its prefix length and host bits set (<code>198.51.100.2/26</code>) is that one address.'],
 ['<code>port</code>','One port, a list (<code>2123;2152</code>) or a range (<code>30000-30100</code>).'],
 ['<code>vlan</code>, <code>note</code>','Optional.']])}
<p>Lines <code># ports: …</code> before the header hold your ${hpA('nd-ports','protocol ports')}.</p>
<p>JSON (<code>"format": "mobile-network-navigator/netdata"</code>) holds the same: <code>instances</code> with their <code>addresses</code>, <code>interfaces</code> with subnet, VLAN and note, and <code>ports</code>. The data check reports unknown elements (skipped), unknown or foreign interfaces, invalid addresses and ports, and one address used by different instances.</p>`);
 add('nd-ports','Network data','Protocol ports',`
<p>Some networks run a protocol on other ports than the standard ones – Diameter on TCP 3870, RADIUS on UDP 31812–31813, SGsAP on SCTP 29200. Add them in <b>◆ Network data → Protocol ports…</b> and the trace analysis recognises the protocol on them too. They belong to your network, so they are saved with your network data – in CSV, JSON, encrypted JSON and the saved HTML file – and every capture of the network is read correctly wherever the data is loaded.</p>
${hpT(['Field','Content'],[['Protocol',Object.values(ND_PROTO).map(P=>esc(P.n)).join(', ')],['Transport','The transport the protocol runs over; for Diameter and Diameter over TLS / DTLS (TCP and SCTP) and GTP′ (UDP and TCP) both, or one of them.'],['Ports','One port, a list or ranges: <code>3870;3900-3910</code>.'],['Note','Optional – where the port is used.']])}
<ul class="hpul">
<li><b>Standard ports keep their meaning</b> and are always recognised (the dialog lists them). Your ports are used when neither port of a packet is a standard port of a mobile-core protocol; on UDP also when a packet on a standard port fails the protocol’s header check. On SCTP the PPID comes first, then the standard ports, then yours.</li>
<li>Your ports also tell the <b>listening side</b> of SCTP (an MME connects to the VLR on its SGsAP port) and appear in the ${hpA('tr-sug','suggestions')} for your network data.</li>
<li>The <b>header checks</b> still apply: a packet on your GTP-U port that is not GTP version 1 stays plain IP.</li>
<li>When the protocol ports change – edited, or with other network data loaded or removed – an <b>open trace is read again</b> with the new ports; your choices in Check and decide are kept. The result lists the ports that were used.</li>
<li>The <b>data check</b> warns when a rule cannot be used (unknown protocol, wrong transport, invalid ports), when it covers a standard port of another protocol (the standard protocol keeps it) or the port of an infrastructure protocol such as BFD (your rule takes it over), when two rules give the same port to different protocols (the rule listed first is used), and when a range is wider than 1000 ports – a client’s ephemeral port in it would be taken for the protocol too.</li></ul>
<p><b>In CSV</b> each rule is a comment line before the header: <code># ports: &lt;protocol&gt; [&lt;transport&gt;] &lt;ports&gt; [– &lt;note&gt;]</code> – without a transport, the rule covers every transport the protocol runs over.</p>
<pre class="hppre"># network: Example network
# ports: diameter tcp 3870;3900-3910 – Gx and Gy peers
# ports: radius 31812-31813
# ports: sgsap sctp 29200
element,instance,site,interface,ip,port,vlan,note</pre>
<p>Protocol names: ${Object.keys(ND_PROTO).map(k=>`<code>${esc(k)}</code>`).join(', ')} (also <code>gtp-c</code>, <code>gtpv2-c</code>, <code>gtp'</code> …). <b>In JSON</b>: <code>"ports": [{"protocol": "diameter", "transport": "tcp", "ports": "3870;3900-3910", "note": "Gx and Gy peers"}]</code>, transport <code>"any"</code> for all.</p>`);
 add('nd-privacy','Network data','Privacy and encryption',`
<ul class="hpul">
<li>Loading reads the file in the browser; nothing is uploaded. The page’s Content-Security-Policy allows no network access (<code>connect-src 'none'</code>) and no external resources – also for the online copy.</li>
<li>The data stays in the open tab, unless you tick <b>Remember on this computer</b>. Deep links never contain network data. Leaving the page with unsaved changes asks for confirmation.</li>
<li><b>Encrypted exports</b> use the browser’s Web Crypto API: AES-256-GCM with a key derived from your passphrase by PBKDF2-SHA256 with 600 000 iterations, a random 16-byte salt and a random 12-byte IV for every save. The file holds only these parameters and the ciphertext – not the network name or any address. The passphrase (at least 10 characters) is never stored and cannot be recovered.</li>
<li>Keep real files outside the repository working copy, or in <code>private/</code>; <code>.gitignore</code> excludes the default export names and capture files.</li></ul>`);

 add('about','Reference','Version and scope',`
<p>You are using version <code>${esc(VERSION)}</code> – version numbers are dates (<code>YYYY.MM.DD</code>, with <code>.N</code> for further releases on the same day). Click the version next to the title for the release history.</p>
<h4>Install as an app</h4>
<p>Opened from the web copy (GitHub Pages, over HTTPS), the navigator can be <b>installed as an app</b>: with its own window and icon, in the start menu or dock, on the home screen of a phone or tablet – and it then starts <b>offline</b>. Chrome and Edge: the install icon in the address bar, or <i>Install as an app</i> in the release history (click the version); Safari on macOS: <i>File → Add to Dock</i>; iPhone / iPad: <i>Share → Add to Home Screen</i>; Android: <i>Install app</i> in the browser menu.</p>
<ul class="hpul">
<li>The installed app keeps only its own files (this page, its manifest and icons) for offline use. Your network data and captures are still read locally and never reach it – the page has no network access at all.</li>
<li>A new version is downloaded in the background when the app starts online; the app then offers <b>Reload</b> – never forced, so unsaved network data or an open trace are not lost. Until then, and offline, the version you have keeps working.</li>
<li>Opened from disk (<code>file://</code>), browsers cannot install a page; it stays the single offline file it always was.</li></ul>
<p>The content reflects GSM Phase 2+ and 3GPP Releases 97 to 18. Spec numbers are given per item so details can be checked against the release your network runs. The diagram draws logical functions separately – real deployments often combine them (GGSN / PGW, SMF + PGW-C, UPF + PGW-U, PCF + PCRF, HLR / HSS / UDM). Self-loops (Iur, X2, Xn, S10, N14, N9) stand for the interface towards a neighbouring node of the same type. Cause and result codes are a starting point; confirm them against the spec version and vendor documentation of your network.</p>`);

/* ---------- the dialog ---------- */
function hpIsOpen(){return !!(hpEl&&!hpEl.hidden);}
function hpBuild(){if(hpEl)return;const S=hpSections();hpHTML=new Map();
 const groups=[];S.forEach(s=>{let g=groups.find(x=>x[0]===s.g);if(!g)groups.push(g=[s.g,[]]);g[1].push(s);});
 const toc=groups.map(([g,ss])=>`<div class="hptg">${esc(g)}</div>`+ss.map(s=>`<button type="button" data-hpl="${s.id}">${esc(s.t)}</button>`).join('')).join('');
 const body=S.map((s,i)=>{const h=`${i===0||S[i-1].g!==s.g?`<div class="hpgh">${esc(s.g)}</div>`:''}<h3>${esc(s.t)}<a class="hpanc" href="#help=${s.id}" data-hpl="${s.id}" title="Link to this section" aria-label="Link to this section">#</a></h3>${s.h}`;hpHTML.set(s.id,h);return `<section class="hps" id="hp-${s.id}" data-hps="${s.id}">${h}</section>`;}).join('');
 hpEl=document.createElement('div');hpEl.id='help';hpEl.hidden=true;
 hpEl.innerHTML=`<div class="hpbox" role="dialog" aria-modal="true" aria-labelledby="hp-t"><div class="hphead"><h2 id="hp-t">Help</h2><span class="hpver">v${esc(VERSION)}</span><input type="search" id="hp-q" placeholder="Search the help   /" aria-label="Search the help" autocomplete="off"><span id="hp-n"></span><button type="button" class="hpx" data-hpx aria-label="Close help" title="Close (Esc)">✕</button></div>
 <div class="hpgrid"><nav class="hptoc" aria-label="Help contents">${toc}</nav><div class="hpbody" tabindex="-1">${body}<div class="hpempty" hidden>Nothing found in the help.</div></div></div></div>`;
 document.body.appendChild(hpEl);
 const B=hpEl.querySelector('.hpbody'),Q=hpEl.querySelector('#hp-q');
 hpEl.addEventListener('click',ev=>{if(ev.target===hpEl||ev.target.closest('[data-hpx]')){hpClose();return;}
  const a=ev.target.closest('[data-hpl]');if(a){ev.preventDefault();hpGo(a.dataset.hpl,true);}});
 hpEl.addEventListener('keydown',ev=>{ev.stopPropagation();
  if(ev.key==='Escape'){ev.preventDefault();if(ev.target===Q&&Q.value){Q.value='';hpFilter('');return;}hpClose();return;}
  if(ev.target.closest('input,textarea,select'))return;
  if(ev.key==='/'){ev.preventDefault();Q.focus();Q.select();}else if(ev.key==='?'&&!ev.ctrlKey&&!ev.metaKey&&!ev.altKey){ev.preventDefault();hpClose();}
  else if(ev.key==='Tab'){const f=[...hpEl.querySelectorAll('button,input,a[href],[tabindex="0"]')].filter(x=>x.offsetParent);if(!f.length)return;const i=f.indexOf(document.activeElement);
   if(ev.shiftKey&&(i<=0)){ev.preventDefault();f[f.length-1].focus();}else if(!ev.shiftKey&&i===f.length-1){ev.preventDefault();f[0].focus();}}});
 Q.addEventListener('keydown',ev=>{if(ev.key==='Tab'&&ev.shiftKey){ev.preventDefault();hpEl.querySelector('.hpx').focus();}});
 Q.addEventListener('input',()=>hpFilter(Q.value));
 let raf=0;B.addEventListener('scroll',()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;hpSpy();});});}
/* which section is being read: the last one whose top has passed the top of the reading area */
function hpSpy(){const B=hpEl.querySelector('.hpbody'),top=B.getBoundingClientRect().top;let cur=null;
 for(const s of B.querySelectorAll('.hps')){if(s.hidden)continue;if(!cur)cur=s;if(s.getBoundingClientRect().top-top<=48)cur=s;else break;}
 if(B.scrollTop+B.clientHeight>=B.scrollHeight-2){const v=[...B.querySelectorAll('.hps')].filter(s=>!s.hidden);const last=v[v.length-1];if(last&&last.getBoundingClientRect().top-top<B.clientHeight*.6)cur=last;}
 hpMark(cur?cur.dataset.hps:'');}
function hpMark(id){if(id===hpCur)return;hpCur=id;hpEl.querySelectorAll('.hptoc [data-hpl]').forEach(b=>{const on=b.dataset.hpl===id;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current');});
 const b=hpEl.querySelector(`.hptoc [data-hpl="${id}"]`);if(b){const t=b.closest('.hptoc'),r=b.getBoundingClientRect(),q=t.getBoundingClientRect();if(r.top<q.top||r.bottom>q.bottom||r.left<q.left||r.right>q.right)b.scrollIntoView({block:'nearest',inline:'nearest'});}
 try{history.replaceState(null,'','#help'+(id?'='+id:''));}catch(e){}}
function hpGo(id,fromClick){const B=hpEl.querySelector('.hpbody');let s=id&&hpEl.querySelector(`.hps[data-hps="${CSS.escape(id)}"]`);
 if(s&&s.hidden){const Q=hpEl.querySelector('#hp-q');Q.value='';hpFilter('');}
 if(!s){B.scrollTop=0;hpCur=null;hpSpy();return;}
 B.scrollTop+=s.getBoundingClientRect().top-B.getBoundingClientRect().top-6;hpCur=null;hpMark(id);if(fromClick)B.focus({preventScroll:true});}
/* search: all words must occur in a section; matches are marked */
function hpFilter(q){const B=hpEl.querySelector('.hpbody'),words=q.toLowerCase().split(/\s+/).filter(Boolean);let n=0;
 B.querySelectorAll('.hps').forEach(s=>{s.innerHTML=hpHTML.get(s.dataset.hps);const t=s.textContent.toLowerCase(),ok=words.every(w=>t.includes(w));s.hidden=!ok;
  const b=hpEl.querySelector(`.hptoc [data-hpl="${s.dataset.hps}"]`);if(b)b.classList.toggle('hpoff',!ok);if(ok){n++;if(words.length)hpHi(s,words);}});
 hpEl.querySelector('.hpempty').hidden=n>0;hpEl.querySelector('#hp-n').textContent=words.length?n+' section'+(n===1?'':'s'):'';
 B.scrollTop=0;hpCur=null;hpSpy();}
function hpHi(root,words){const re=new RegExp(words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'gi');const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),list=[];
 while(tw.nextNode()){const n=tw.currentNode;if(n.parentNode.closest('.hpanc,script,style'))continue;re.lastIndex=0;if(re.test(n.nodeValue))list.push(n);}
 list.forEach(n=>{const f=document.createDocumentFragment();let last=0;n.nodeValue.replace(re,(m,i)=>{if(i>last)f.append(n.nodeValue.slice(last,i));const k=document.createElement('mark');k.className='hpm';k.textContent=m;f.append(k);last=i+m.length;return m;});
  if(last<n.nodeValue.length)f.append(n.nodeValue.slice(last));n.parentNode.replaceChild(f,n);});}
function hpOpen(id){if(ndModalOpen&&ndModalOpen())return;hpBuild();const was=hpIsOpen();if(!was)hpPrev=document.activeElement;
 hpEl.hidden=false;document.body.classList.add('hpopen');const b=$('#hpbtn');if(b){b.classList.add('on');b.setAttribute('aria-expanded','true');}
 hpGo(id||(was?hpCur:''));if(!was)hpEl.querySelector('.hpbody').focus({preventScroll:true});}
function hpClose(){if(!hpIsOpen())return;hpEl.hidden=true;document.body.classList.remove('hpopen');const b=$('#hpbtn');if(b){b.classList.remove('on');b.setAttribute('aria-expanded','false');}
 hpCur='';updateHash();const p=hpPrev;hpPrev=null;if(p&&p.focus&&document.contains(p))p.focus({preventScroll:true});}
document.addEventListener('click',ev=>{const a=ev.target.closest&&ev.target.closest('[data-hp]');if(!a||(hpEl&&hpEl.contains(a)))return;ev.preventDefault();ev.stopPropagation();hpOpen(a.dataset.hp);},true);
document.addEventListener('keydown',ev=>{if(ev.key!=='?'||ev.ctrlKey||ev.metaKey||ev.altKey)return;if(ev.target.closest&&ev.target.closest('input,textarea,select,[contenteditable="true"]'))return;if(ndModalOpen())return;ev.preventDefault();if(hpIsOpen())hpClose();else hpOpen();});
$('#hpbtn').addEventListener('click',()=>{if(hpIsOpen())hpClose();else hpOpen();});
document.addEventListener('drop',()=>{if(hpIsOpen())hpClose();},true);   /* a dropped capture or data file is shown at once */
