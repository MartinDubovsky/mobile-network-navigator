<title>Mobile Network Navigator · 2G · 3G · HSPA · 4G · 5G NSA · 5G SA</title>
<style>
:root{
  --bg:#0e1319; --bg2:#121922; --panel:#151d27; --panel2:#1b2531; --node:#19222d; --ink:#e6edf3; --muted:#8d9aa8; --faint:#5b6876;

}
body.light{
  --bg:#f3f5f8; --bg2:#ffffff; --panel:#ffffff; --panel2:#f1f4f8; --node:#ffffff; --ink:#18212b; --muted:#5c6b7a; --faint:#94a1ae;
  --line:#d5dde6; --zone:#f8fafc; --zoneLine:#dbe3ec;
  --g2g:#dc2626; --g3g:#d97706; --ghspa:#db2777; --g4g:#2563eb; --gnsa:#0891b2; --gsa:#7c3aed; --gwifi:#ca8a04; --giw:#16a34a; --gall:#64748b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
button{font-family:inherit;font-size:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:6px 14px;background:var(--bg2);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px;white-space:nowrap;cursor:help}
header h1 .ver{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px;background:transparent;cursor:pointer;position:relative}
header h1 .ver:hover{color:var(--ink);border-color:var(--muted)}

.rel{border-top:1px solid var(--line);padding:8px 0 4px}.rel:first-of-type{border-top:0}
.rel h4{margin:0 0 4px;font-size:13px;display:flex;gap:10px;align-items:baseline}.rel h4 code{font-size:12.5px}.rel h4 span{color:var(--muted);font-weight:400;font-size:12px}.rel h4 em{font-style:normal;font-size:11px;border:1px solid var(--giw);color:var(--giw);border-radius:999px;padding:0 6px}
.rel ul{margin:0;padding-left:18px;line-height:1.5}.rel li{margin:2px 0}.rel code,.relintro code{font-family:var(--mono);font-size:12px;background:var(--panel2);border-radius:3px;padding:0 3px}

.chip:hover{border-color:var(--muted)}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip.on{background:color-mix(in srgb,var(--c) 22%,var(--panel));border-color:var(--c)}
.chip.plain.on{background:var(--panel2);border-color:var(--ink)}
.chip small{color:var(--muted);font-size:10.5px}
.tabs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px;margin-left:auto}
.tabs button{border:0;background:transparent;padding:4px 11px;border-radius:6px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--panel2);color:var(--ink);font-weight:600}
#toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:5px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
#toolbar .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#toolbar .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-right:1px}
.seg{display:inline-flex}
.seg .tg{border-radius:0;margin-left:-1px}
.seg .tg:first-child{border-radius:6px 0 0 6px;margin-left:0}
.seg .tg:last-child{border-radius:0 6px 6px 0}
.seg .tg.on{position:relative;z-index:1}
#protosel{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:12.5px;font-family:inherit}
#protosel.on{border-color:var(--ink);background:var(--panel2)}
.tg{border:1px solid var(--line);background:var(--panel);padding:3px 9px;border-radius:6px;cursor:pointer;font-size:12.5px}
.tg.on{border-color:var(--ink);background:var(--panel2)}
.tg.off{opacity:.55;text-decoration:line-through}
#search{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 9px;width:250px;font-size:13px}
#search:focus{outline:2px solid var(--g4g);outline-offset:-1px}
#qcount{color:var(--muted);font-size:12px}
main{display:flex;height:calc(100vh - var(--hdr,104px));min-height:420px}
#views{flex:1;position:relative;min-width:0}
.view{position:absolute;inset:0}
.view[hidden]{display:none !important}
#svgwrap{position:absolute;inset:0;overflow:hidden;cursor:grab;background:var(--bg)}

svg#map{width:100%;height:100%;display:block;user-select:none}
#zoombox{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px;z-index:3}
#zoombox button{width:32px;height:32px;border:1px solid var(--line);background:var(--panel);border-radius:6px;cursor:pointer;font-size:16px}
#legend{position:absolute;left:10px;bottom:10px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:11px;z-index:3;max-width:min(620px,calc(100% - 70px))}
#legend.mini .row{display:none}
#legend.mini .hide{float:none;margin:0}
#legend .row{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
#legend .row+.row{margin-top:3px}
#legend svg{vertical-align:middle}
#legend .hide{cursor:pointer;color:var(--muted);float:right;margin-left:10px}
#hint{position:absolute;left:12px;top:10px;font-size:11.5px;color:var(--muted);z-index:3;pointer-events:none}
/* SVG */
.zone rect{fill:var(--zone);stroke:var(--zoneLine);stroke-width:1}
.zone text{fill:var(--muted);font-size:12px;font-weight:600;letter-spacing:.4px}
.node{cursor:pointer}
.node .nb{fill:var(--node);stroke:var(--nc);stroke-width:1.6}
.node.ext .nb{stroke-dasharray:5 4}
.node .nm{fill:var(--ink);font-size:13px;font-weight:650;text-anchor:middle}
.node .sb{fill:var(--muted);font-size:10px;text-anchor:middle}
.node .gbar{stroke:none}
.node:hover .nb,.node:focus .nb{stroke-width:2.6}
.node:focus{outline:none}
.node.container .nb{fill:transparent;stroke-dasharray:6 4;stroke-width:1.3}
.node.container .nm{text-anchor:start;font-size:12px}
.node.bar .nm{font-size:13px}
.link{cursor:pointer}
.link path.v{fill:none;stroke:var(--lc);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.link.cp path.v{stroke-dasharray:7 5}
.link.sbi path.v{stroke-dasharray:1.5 4.5;stroke-width:2.6}
.link.logical path.v{stroke-dasharray:12 4 2 4;stroke-width:1.6}
.link.both path.v{stroke-width:4}
.link path.ov{fill:none;stroke:var(--bg);stroke-width:1.4;stroke-dasharray:6 5;stroke-linecap:butt}
.link path.hit{fill:none;stroke:transparent;stroke-width:14}
.link:hover path.v{stroke-width:3.4}
.link.both:hover path.v{stroke-width:5}
.lbl rect{fill:var(--panel);stroke:var(--lc);stroke-width:1;rx:4}
.lbl text{fill:var(--ink);font-size:11px;font-family:var(--mono);text-anchor:middle;dominant-baseline:central}
.lbl{cursor:pointer}
.bus line{stroke:var(--gsa);stroke-width:6;stroke-linecap:round;opacity:.85}
.bus text{fill:var(--gsa);font-size:11px;font-weight:600}
/* states */
.lv0{opacity:.09}
.lv1{opacity:.38}
.lv3 .nb{stroke-width:3;filter:drop-shadow(0 0 6px var(--nc))}
.link.lv3 path.v{stroke-width:3.6;filter:drop-shadow(0 0 4px var(--lc))}
.link.both.lv3 path.v{stroke-width:5.2}
.sel .nb{stroke-width:3.6 !important;filter:drop-shadow(0 0 10px var(--nc)) !important}
.link.sel path.v{stroke-width:4.4 !important;filter:drop-shadow(0 0 8px var(--lc)) !important}
.hidden{display:none}
/* panel */
#panel{width:440px;max-width:46vw;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px 18px 40px;position:relative}
#panel h2{margin:0 0 2px;font-size:19px}
#panel h2 .k{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
#panel .full{color:var(--muted);margin-bottom:8px}
#panel h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:16px 0 6px;font-weight:650}
#panel p{margin:6px 0;line-height:1.45}
#panel ul{margin:4px 0;padding-left:18px}
#panel li{margin:3px 0;line-height:1.4}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.gb{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--c);color:var(--ink);background:color-mix(in srgb,var(--c) 18%,transparent);cursor:pointer}
.pb{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.ends{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 4px}

.ends button:hover,.ifc:hover{border-color:var(--muted)}
.ifcs{display:flex;flex-wrap:wrap;gap:5px}
.ifc{font-family:var(--mono);font-size:12px;display:inline-flex;gap:6px;align-items:center}
.ifc i{font-style:normal;color:var(--muted);font-family:var(--sans);font-size:11px}
.ifc .sw{width:14px;height:0;border-top:2.5px solid var(--lc)}

.ifc .sw.sbi{border-top-style:dotted}
.stks{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.stk{display:flex;flex-direction:column;min-width:128px;flex:1 1 128px;max-width:200px}
.stk-t{font-size:11px;color:var(--muted);margin-bottom:4px;text-align:center;line-height:1.25}
.ly{font-family:var(--mono);font-size:11.5px;padding:5px 6px;text-align:center;color:#fff;border-radius:3px;margin-top:2px;line-height:1.2;background:var(--k-appl)}
.k-nas{background:var(--k-nas)} .k-rrc{background:var(--k-rrc)} .k-radio{background:var(--k-radio)} .k-ap{background:var(--k-ap)} .k-tun{background:var(--k-tun)} .k-tr{background:var(--k-tr)} .k-ip{background:var(--k-ip)} .k-phy{background:var(--k-phy)} .k-ss7{background:var(--k-ss7)} .k-appl{background:var(--k-appl)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:13px}
.kv div:nth-child(odd){color:var(--muted)}
.kv div:nth-child(even){font-family:var(--mono);font-size:12px;line-height:1.4;overflow-wrap:anywhere}
.note{border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);padding:7px 10px;border-radius:0 6px 6px 0;margin:8px 0;line-height:1.45}
.note b{color:var(--c)}
.tip{border-left:3px solid var(--muted);background:var(--panel2);padding:7px 10px;border-radius:0 6px 6px 0;margin:6px 0;line-height:1.45;font-size:13px}
.specs{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.6}
.paneltools{display:flex;gap:6px;margin:10px 0 0;flex-wrap:wrap}
.paneltools button{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px}
.gcards{display:grid;gap:8px}
.gcard{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;padding:8px 10px;cursor:pointer;background:var(--panel2)}
.gcard b{display:block}
.gcard span{color:var(--muted);font-size:12.5px}
table.qr{border-collapse:collapse;width:100%;font-size:12.5px}
table.qr td,table.qr th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
table.qr th{color:var(--muted);font-weight:600;font-size:11.5px}
table.qr td:first-child{font-family:var(--mono)}
/* table view */
#view-table{overflow:auto;padding:14px 18px}
#itable{border-collapse:collapse;width:100%;font-size:13px}
#itable th{position:sticky;top:-14px;background:var(--bg);text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;padding:8px;border-bottom:1px solid var(--line);cursor:pointer}
#itable td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
#itable tr{cursor:pointer}

#itable td.mono{font-family:var(--mono);font-size:12px}
#itable td.nm{font-family:var(--mono);font-weight:650;white-space:nowrap}
.gdots{display:flex;gap:3px;flex-wrap:wrap}
.gdots span{font-size:10.5px;padding:1px 6px;border-radius:999px;background:color-mix(in srgb,var(--c) 22%,transparent);border:1px solid var(--c);white-space:nowrap}
/* e2e view */
#view-e2e{display:flex}
#e2enav{width:250px;border-right:1px solid var(--line);overflow:auto;padding:10px}
#e2enav button{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:6px;padding:8px 10px;cursor:pointer;margin-bottom:3px;line-height:1.3}
#e2enav button:hover{background:var(--panel)}
#e2enav button.on{background:var(--panel);border-color:var(--c)}
#e2enav button i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:7px}
#e2enav h4{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:12px 6px 6px}
#e2emain{flex:1;overflow:auto;padding:18px 22px 40px}
#e2emain h2{margin:0 0 4px;font-size:19px}
#e2emain .sum{color:var(--muted);max-width:980px;line-height:1.45;margin:0 0 14px}
.e2e{display:flex;align-items:flex-end;gap:0;overflow-x:auto;padding:6px 2px 10px}
.e2e-node{display:flex;flex-direction:column;align-items:stretch;flex:0 0 auto}
.e2e-name{text-align:center;font-weight:650;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:var(--panel)}
.e2e-stacks{display:flex;gap:6px;align-items:flex-end;padding:8px;border:1px solid var(--line);border-radius:0 0 8px 8px;background:var(--panel)}
.e2e-stack{display:flex;flex-direction:column;justify-content:flex-end;width:120px}
.e2e-stack.ghost{opacity:.55}
.e2e-side{font-size:10.5px;color:var(--muted);text-align:center;margin-bottom:3px;min-height:14px}
.e2e-stack .ly{height:30px;display:flex;align-items:center;justify-content:center;font-size:11px}
.e2e-stack .split{display:flex;gap:2px;margin-top:2px}
.e2e-stack .split .ly{flex:1;margin-top:0;font-size:10px;padding:2px}
.e2e-gap{flex:0 0 66px;align-self:stretch;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:16px;position:relative}
.e2e-gap:before{content:"";position:absolute;left:4px;right:4px;bottom:22px;border-top:2px dashed var(--faint)}
.e2e-gap span{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-family:var(--mono);font-size:11px;white-space:nowrap;margin-bottom:-2px}
.e2e-notes{max-width:980px;margin-top:10px}
.e2e-hint{color:var(--muted);font-size:12px;margin:-6px 0 12px}
.e2e-path-t{font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:14px 0 2px}
.e2e .ly{transition:opacity .12s;cursor:default}
.e2e.peering .ly{opacity:.22}
.e2e.peering .ly.peer{opacity:1;box-shadow:0 0 0 2px var(--ink) inset}
.e2e-tail{flex:0 0 auto;padding-left:6px}
.e2e-tail:before{right:auto;width:40px}
.e2e-tail span{margin-left:44px}
.klegend{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.klegend span{font-size:11px;padding:3px 8px;border-radius:3px;color:#fff}
#tip{position:fixed;pointer-events:none;z-index:50;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;max-width:330px;font-size:12.5px;line-height:1.4;box-shadow:0 6px 20px rgba(0,0,0,.35);display:none}

#tip .s{color:var(--muted);display:block;margin-top:2px}

const PRISTINE_DOC=document.documentElement.cloneNode(true); /* clean copy of the tool, used by “Save tool + data as one HTML file” */
const VERSION = '2026.11.09.5';
/* release history – shown when the version number is clicked; keep in step with the README changelog */
const RELEASES = [{"v": "2026.11.09.5", "items": ["Trace analysis – **Check and decide: several groups at once.** Tick the groups (Shift-click ticks a range, the box in the header all of them, or *select all · undecided · likely*), choose one interface in the bar above the table and **Apply** – the candidates of the ticked groups come first, then the other interfaces of their plane, *Not a mobile-network interface*, or *automatic* to remove your choices."]}, {"v": "2026.11.09.4", "items": ["**Installable as an app**: opened from the web copy (GitHub Pages), the navigator can be installed – its own window and icon, in the start menu or dock, on a phone's home screen – and then starts **offline**. Chrome / Edge: the install icon in the address bar, or *Install as an app* in the release history; Safari: *Add to Dock* / *Add to Home Screen*.", "The installed app keeps only its own files for offline use; your network data and captures are still read locally and never reach it, and the page still has no network access. New versions are downloaded in the background and offered with **Reload** – never forced. Opened from disk, nothing changes: it is the same single offline file. New app icon (also the browser-tab icon)."]}, {"v": "2026.11.09.3", "items": ["Trace analysis – **Wireshark filters corrected and checked against Wireshark**: every ⧉ filter of the test captures is now run through Wireshark 4.2 – it is accepted and selects exactly the packets the row counts. Fixed: QinQ outer tags (Wireshark names them `ieee8021ad.id`, so such groups matched nothing), IP fragments of fragmented flows (now included), Diameter (the whole TCP connection or SCTP association where two addresses carry one application, instead of the messages only), and decision groups (no longer include flows that were already certain).", "The copied filter is now in brackets as a whole, and the message reminds you to paste it **in place of** the current filter – appended to another filter without `&&` or `||`, Wireshark rejects it."]}, {"v": "2026.11.09.2", "items": ["Trace analysis – **Save results…**: the results and **your decisions** can now be saved as JSON, CSV (one block per table, for a spreadsheet) or encrypted JSON – interfaces, capture interfaces and directions, decisions, elements with their addresses, names and the rule that set them, Not mapped, protocol details. The JSON can include your network data with its protocol ports, so one file holds all your data. Packets, UE addresses and subscriber identities are never saved, and nothing is written unless you ask.", "**Decisions can be re-applied**: open the same capture and load the saved JSON (Check and decide → Apply decisions from a file…, or drop it on the page); a file that also holds network data loads that too.", "**⧉ filter** on interfaces, capture interfaces, decision groups, elements and Not mapped rows copies a **Wireshark display filter** for the same packets – address pairs, protocol, VLAN and capture interface. Plain-IP filters are approximate and say so; the help explains how each filter is built.", "The trace panel is easier to read: its parts are **colour-coded sections that fold open and closed**, each showing its key figures when folded (confidences, directions, open decisions); Check and decide is tinted while something is undecided. Elements and addresses start folded above 20 addresses; Not mapped and Protocol details start folded."]}, {"v": "2026.11.09.1", "items": ["Trace analysis – **GTP-U tunnels without signalling are oriented by the TCP connections inside them**: the inner SYN travels uplink, the SYN-ACK downlink. When neither signalling nor your network data identifies an end, the end that sends at least 90 % of the inner SYNs (over at least 6 SYN / SYN-ACK packets) is the UE side – the eNodeB on S1-U, the gNB on N3, the S-GW on S5 – so the RAN end is told from the core end, and the tunnel gets its uplink / downlink per capture interface. Every G-PDU is checked, not a sample.", "This rule comes after your network data and the signalling and before the fan-out rule; its results are **likely** at best, suggestions based on it are never pre-selected, and interfaces and capture interfaces whose direction comes mostly from it say so (*TCP set-up*). It assumes the UEs open the connections – where servers open them (M2M polling, services on UEs) it points the wrong way; the help explains it.", "UE and server addresses learned only from such tunnels give plain IP on SGi / Gi / N6 its direction too, marked as coming from TCP set-up."]}, {"v": "2026.11.09", "items": ["Trace analysis – **direction on SGi / Gi / N6 from TCP connection set-up**: on the data-network side the UE usually opens the connections, so an address that opened at least 90 % of its TCP handshakes (sent the SYN, or received the SYN-ACK) counts as the UE side and one that accepted them as the far side. Packets from the UE side or to the far side are uplink, the reverse downlink – also for probe ports that carry only one direction, and for all of an address’s packets (its UDP / QUIC traffic too).", "The UE addresses and server addresses known from the signalling (GTP-U, Gx, RADIUS) still come first; the TCP roles fill in where the signalling says nothing. A plain-IP group gets a direction once its interface is SGi, Gi or N6 – decided by the analysis, by the VLAN in your network data, or assigned by you in Check and decide; undecided plain IP (O&M, SBI …) gets none.", "Capture interfaces and interfaces whose direction comes mostly from TCP set-up say so (*TCP set-up*). The help explains the rule and its assumption: where servers open the connections (M2M polling, services on UEs, scans) the direction of that traffic is inverted."]}, {"v": "2026.11.08.3", "items": ["Network data – **Protocol ports**: non-standard ports your network uses for a protocol – Diameter on TCP 3870, RADIUS on UDP 31812–31813, SGsAP on SCTP 29200 – as single ports, lists or ranges, for Diameter (TCP, SCTP), Diameter over TLS / DTLS, RADIUS, GTP-C, GTP-U, PFCP, GTP′ and the SCTP protocols (S1AP, NGAP, X2AP, XnAP, F1AP, E1AP, SGsAP, NBAP, M3UA, RUA, HNBAP). Edit them under **◆ Network data → Protocol ports…**; the dialog also lists the standard ports.", "The protocol ports are **saved with your network data** – CSV (`# ports: diameter tcp 3870;3900-3910 – note` lines), JSON (`ports`), encrypted JSON and the saved HTML file – so captures of the network are read correctly wherever the data is loaded.", "Trace analysis: protocols on your ports are recognised like on their standard ports – also the listening side of SCTP. Standard ports keep their meaning (on UDP your port also gets a packet whose standard-port header check fails); on SCTP the PPID still comes first. When the ports change – edited, or with other network data loaded – an open trace is **read again** with them, keeping your choices in Check and decide; the result lists the ports that were used.", "**Add to network data…** now suggests the ports each address was actually seen using – standard or yours (Diameter 3870 on the PCRF, RADIUS 1812 and 1813 on the AAA, 3799 on a NAS receiving CoA) – instead of the standard ones.", "The data check warns about protocol-port rules that cannot be used, that cover a standard port of another protocol, that give one port to two protocols, or whose range is wider than 1000 ports. The help has a new section **Protocol ports** (`#help=nd-ports`)."]}, {"v": "2026.11.08.2", "items": ["**Help** – **? Help** in the toolbar, the `?` key or a `#help` link opens a searchable help: the map and its views, filters and search, the details panel and message flows, end-to-end procedures, network data, keyboard and deep links.", "The help explains the **trace analysis** step by step: how a capture is read (formats, VLAN / MPLS / PPPoE, IPv6 extension headers, fragments), how every packet is classified by port, SCTP PPID or IP protocol, what is decoded, how flows and groups are formed, the rules per protocol that decide the interface (GTP-U, GTPv2-C, GTPv1-C, PFCP, Diameter, RADIUS, plain IP, SCTP, IKEv2 / ESP, GTP′), how your network data and your choices are used, how elements and the uplink / downlink direction are found, and the limits. Its tables – ports, PPIDs, F-TEID and PFCP interface types, Diameter applications, RAT types – are generated from the analysis itself, so they always match what it does.", "Links to the matching help sections from the overview and the trace panel; `#help=<section>` opens a section directly (e.g. `#help=tr-gtpu`), and the address bar shows the section you are reading.", "Trace analysis: GTP-U on **S11-U** (Control Plane CIoT EPS optimisation – F-TEID types 38 / 39 in GTPv2-C, 3GPP Interface Type S11-U in PFCP) is now identified as S11, with its direction; before, these tunnels were left undecided although the signalling identified them."]}, {"v": "2026.11.08.1", "items": ["Trace analysis – **direction per capture interface**: uplink and downlink of the user plane are worked out (eNodeB → S-GW on S1-U, gNB → UPF on N3, UE → server on SGi / Gi / N6…) and shown per capture interface (DPDK port, pcapng interface or file) as ↑ uplink, ↓ downlink or both, with the share per interface and the sending element of the signalling. Two ports that carry the opposite directions of the same links are pointed out; interface rows show their ↑ / ↓ share.", "UE addresses are now told from server addresses by the direction they travel inside GTP-U (the inner source of uplink packets is the UE), so plain IP on SGi, Gi and N6 is matched and its direction counted precisely.", "Trace analysis – **several files at once**: open or drop the files of several probe ports together; they are analysed as one capture with one capture interface per file. A file that cannot be read is reported and skipped; a PFCP response read before its request (directions in separate files) is still paired.", "Trace analysis – **Add to network data…**: the addresses identified in a trace are offered as instances for your network data – element, name (from Diameter Origin-Host, PFCP Node ID or RADIUS NAS-Identifier), interface, address, well-known port and VLAN, with the evidence as a note. Certain ones are pre-selected, likely ones are yours to decide; addresses already in your network data are marked. Nothing is saved until you export.", "Trace analysis: on RAN interfaces without signalling, the address with many peers is taken as the core side (S-GW, UPF, MME…) and its peers as RAN nodes (likely). An address listed in your network data no longer overrides protocol evidence for another interface of the same address (an OCS on Gy and Ro)."]}, {"v": "2026.11.08", "items": ["Trace analysis: plain IP on SGi, Gi and N6 is now recognised only by addresses that sit behind one data-network side (the UE addresses). Internet servers, which appear inside GTP-U on S1-U, N3 and Gn alike, no longer make N6 or Gi traffic look partly like SGi.", "Trace analysis: the packet-count badges on the map are drawn once per update (they were redrawn several times)."]}, {"v": "2026.11.07.2", "items": ["**Trace analysis** (**⇅ Trace** in the toolbar, or drop a file on the page): open a Wireshark capture – pcap or pcapng, also gzip-compressed and with several capture interfaces – and see which interfaces and elements it contains. The map highlights them with packet counts; the panel lists every interface with its evidence, the elements with their addresses and names, and the protocol details.", "Interfaces are identified from the traffic itself: GTP-U is told apart (S1-U, S5/S8-U, N3, N9, Gn, direct tunnel…) by the F-TEIDs signalled in GTPv2-C, GTPv1-C and PFCP of the same capture; PFCP by its 3GPP Interface Type IEs (N4, Sxa, Sxb); Diameter by application and AVPs (Gx with IP-CAN-Type for P-GW or GGSN, Gy / Ro and Gz / Rf by Service-Context-Id, S6a / S6d by the ULR flag, Rx, S13, SWm, SWx, S6b, Cx / Sh, Sy, S9); RADIUS by 3GPP-RAT-Type; plain IP on Gi / SGi / N6 by its addresses also seen inside GTP-U or as Framed-IP-Address in Gx / RADIUS; S1AP, NGAP, XnAP, F1AP, E1AP, SGsAP and NBAP by SCTP PPID or port.", "Every result says how sure it is – **certain**, **likely** or **undecided** – and why. Undecided and likely traffic is grouped by protocol, VLAN and capture interface, and one choice assigns a whole group. Your network data, when loaded, names the elements and settles ambiguous cases.", "Private by design: the capture is read in the browser as a stream (about 700 000 packets per second in our tests) and never uploaded, stored, put in the link or in “Save with data”. No subscriber identities are read. `.gitignore` now also excludes capture files."]}, {"v": "2026.11.07.1", "items": ["**16 new end-to-end procedures** (39 in total): combined GPRS / IMSI attach over Gs; 3G PS service request and 3G CS mobile-originated call with Iu UP; HSPA RAB on HS-DSCH and E-DCH; LTE PDN connectivity (IMS APN), tracking area update with MME change and S1 handover; EN-DC secondary node release; 5G N2 handover, network-triggered service request, PDU session release and deregistration; Wi-Fi → LTE handover and Wi-Fi calling detach; CS fallback mobile-terminated call and SRVCC LTE → UTRAN.", "The procedure list is now grouped in generation order – 2G, 3G, HSPA, 4G, 5G NSA, 5G SA, Wi-Fi, Interworking – and ordered inside each group from registration to sessions, mobility and release. CS fallback moved to Interworking.", "User data rows that cross several interfaces are tagged **IP** instead of GTP-U."]},{"v": "2026.11.07", "items": ["**2G end-to-end procedures** (6 new, 23 in total): GSM location update, mobile-originated call, mobile-terminated call with HLR interrogation and paging, call release, inter-BSC handover, and GPRS attach with PDP context activation in A/Gb mode.", "The 2G flows show the BTS and BSC hops: RR on Um, RSL on Abis (CHANNEL REQUIRED, IMMEDIATE ASSIGN COMMAND, ESTABLISH INDICATION, ENCRYPTION COMMAND, PAGING COMMAND), BSSMAP and SCCP on A, H.248 to the CS-MGW, ISUP towards the other network, MAP on C / D and Gr, BSSGP on Gb.", "Carried messages are labelled by layer: **NAS: …** for MM / CC / GMM / EMM / 5GMM messages, **RR: …** for RR messages inside RSL or BSSMAP (e.g. the Handover Command in HANDOVER REQUEST ACKNOWLEDGE).", "Fixed: closing a procedure right after opening it (e.g. a quick change of the deep link) could leave the map zoomed in.", "The message label on the map stays inside the visible map area, also for hops along the map edge (e.g. Um).", "Fixed: the map zoom animation of a procedure could, in rare cases, jump far outside the map."]},{"v": "2026.11.06.2", "items": ["**End-to-end procedures – Play:** the dot now travels once per step and stays at the destination; the next step starts only after it has arrived (at least 1.7 s per step, longer for long paths). Stepping by hand still repeats the animation."]},{"v": "2026.11.06.1", "items": ["**End-to-end procedures – NAS messages made explicit:** a NAS message carried inside an RRC, S1AP, NGAP or RANAP message is now named on that message (e.g. RRC Connection Setup Complete and INITIAL UE MESSAGE with **NAS: Attach Request + PDN Connectivity Request**, INITIAL CONTEXT SETUP REQUEST and RRC Connection Reconfiguration with **NAS: Attach Accept + Activate Default EPS Bearer Context Request**). Before, these were only mentioned in the parameter text. NAS messages that RRC / S1AP / NGAP / RANAP only relay stay one arrow UE ↔ core; the rule is stated in each flow.", "NAS layer tags are now precise: **EMM / ESM** (4G), **5GMM** (5G), **MM / CC / GMM / SM** (3G) instead of a generic NAS tag. Attach Complete is named with its ESM message (Activate Default EPS Bearer Context Accept).", "Added the optional **Identity Request / Response** to LTE attach, 5G registration and 3G attach, and a note on the optional EIR check (S13) in LTE attach. In UTRAN the first NAS message (CM Service Request, GPRS Attach Request) is shown per hop: RRC Initial Direct Transfer, then RANAP INITIAL UE MESSAGE.", "RRC IE names corrected: LTE RRC Connection Reconfiguration carries NAS in **dedicatedInfoNASList**, NR RRCReconfiguration in **dedicatedNAS-MessageList** (also fixed in the LTE-Uu message flow)."]},{"v": "2026.11.06", "items": ["**End-to-end procedures** (▶ Procedures in the toolbar): 17 multi-node call flows – LTE attach, service request, paging, S1 release, X2 handover, VoLTE dedicated bearer, detach, CS fallback, EN-DC secondary node addition, 5G registration, PDU session, service request, AN release, Xn handover, 3G attach + PDP context, Wi-Fi calling attach and LTE → Wi-Fi handover – with the interface of every message.", "**Map integration:** the map zooms to the procedure and dims everything else; stepping through the messages (click, ← / →, Play) highlights each hop and animates it along its path. Works in the CUPS and reference-point views.", "**IP addresses in the flows:** with network data loaded, pick the instance of each node above its lane and every message shows source → destination address and port.", "Element and interface panels list the procedures they appear in; deep links `#proc=<id>&step=<n>`; copy as text and larger view."]},{"v": "2026.11.05.9", "items": ["**Wi-Fi access via ePDG** (untrusted non-3GPP, VoWiFi): new **ePDG** and **3GPP AAA** elements with **SWu**, **SWm**, **SWx**, **S2b** and **S6b** (S2b-C / S2b-U and S6b to the PGW-C in the CUPS view), a **Wi-Fi** generation chip, message flows (IKEv2 + EAP-AKA tunnel set-up, S2b PDN connection, LTE ↔ Wi-Fi handover, Diameter procedures) and two end-to-end stacks.", "Map: the 5G rows moved down to make room below the EPC; the canvas is now 1900 × 1400."]},{"v": "2026.11.05.8", "items": ["**Network data:** site `*` means the instance belongs to every site – it is shown whichever sites are selected and is not listed as a separate site in the site filter."]},{"v": "2026.11.05.7","items": ["**Release history** in the app: click the version number next to the title. A small dot on it marks a version you have not seen yet."]},{"v": "2026.11.05.6","items": ["**Network data:** reference points (N11, N8, N12 …) in the address tables are now links (they open the Ref. points view). An NF’s reference-point addresses also show on its SBI stub and the SBI bus, and a reference point without its own entry shows the NF’s `sbi` address.","Addresses written with a prefix length (`198.51.100.66/26`) are treated as one address, not as the whole subnet: search no longer matches other addresses of that subnet, and the duplicate check compares the address part. CIDR blocks with zero host bits stay ranges."]},{"v": "2026.11.05.5","items": ["**Network data:** ports can be a list or a range (`8080;443`, `2123, 2152`, `30000-30100`) – one row per address instead of one per port. JSON also accepts an array of ports.","**Site filter** for network data: pick sites (or type part of a name) to limit panels, map badges, tooltips and search; optional export of only the filtered sites; the filter is kept with “Remember on this computer”.","Template: port lists and a second site; RAN ranges without a site."]},{"v": "2026.11.05.4","items": ["**Message flows:** sequence diagrams for the main procedures on every interface (412 procedures, about 1 500 messages): radio (Um, Uu, LTE-Uu, NR-Uu), RAN (Abis, Iub, Iur, F1, E1, X2, Xn), RAN–core (A, Gb, Iu, S1, N2), GTP / PFCP (Gn, S11, S5/S8, S3, S4, S10, N26, Sxa/Sxb, N4, all GTP-U interfaces), Diameter (S6a/d, S13, Gx, Rx, Gy/Gz, Sy, S9, Cx/Sh, Ro/Rf), MAP / BSSAP+ / SGsAP / Sv, H.248, BICC / SIP-I, N1 NAS, SBI services and N32.","Larger view, copy as text, keyboard navigation, search over procedure and message names, and deep links to a procedure (`&mf=`)."]},{"v": "2026.11.05.3","items": ["**Network data:** load your own IP plan (CSV, JSON or encrypted JSON, also by drag and drop), edit it in the tool, and see it in the element panel (instances, addresses per interface), the interface panel (both ends, subnet, VLAN), on the map (instance badges) and in search (exact IPv4 match and IPv4-in-subnet). Data is checked on load and on each edit.","Save as CSV, JSON, encrypted JSON (AES-256-GCM, PBKDF2-SHA256), or as one HTML file with the tool and the data (optionally encrypted). Optional “Remember on this computer”. Warning before leaving with unsaved changes.","Content-Security-Policy added: the page cannot load or send anything over the network.","Templates `netdata-template.csv` / `netdata-template.json` (documentation addresses only); `.gitignore` excludes exports with real data.","`/` no longer jumps to the search box while typing in another field."]},{"v": "2026.11.05.2","items": ["**E2E stacks:** peer highlighting – hover or tap a layer to see its peer(s); hop-by-hop layers (transport, tunnels, L1/L2) match across the adjacent interface, relayed layers (NAS, RRC, PDCP, LLC, TRAU frames …) match their end peer.","Scenarios can now consist of several paths: **5G NSA** user plane (NR leg + LTE leg over X2-U) and control plane (LTE RRC/NAS, SCG configuration via X2-C, SRB3) and **HSPA Direct Tunnel** (user plane RNC ↔ GGSN + SGSN control path) – every stack now faces its real peer.","Fixed labels: GTP-U (QFI) on N3/N9 at both ends, 16 / 8 kbit/s TRAU sub-timeslots on Abis and Ater; BSC added to the GSM speech path; user IP labelled consistently."]},{"v": "2026.11.05","items": ["Added **2G (GSM / GPRS / EDGE)**: new generation chip and GERAN zone with **BTS** and **BSC + PCU** (TRAU described), interfaces **Um**, **Abis**, **A** (control plane to the MSC Server), **A UP** (user plane to the CS-MGW, TDM or A over IP) and **Gb** (BSSGP/NS to the SGSN).","The CS and PS core (MSC Server/VLR, CS-MGW, HLR/AuC, EIR, SGSN, GGSN, charging) is shared with 3G and now tagged for both generations.","Integration with modern networks: CSFB and SRVCC to GERAN (SGs, Sv), LTE ↔ GERAN reselection / redirection / NACC, S4-SGSN with Gb (S3/S4), and 5G-SRVCC (R16, NG-RAN → UTRAN only, via N26 → MME_SRVCC → Sv); no direct 5GS ↔ GERAN mobility.","New end-to-end stacks: 2G GPRS/EDGE user plane, GSM CS control plane, GSM speech path.","Renamed to “Mobile Network Navigator”; shorter generation chip subtitles so the header still fits one row at 1920 px."]},{"v": "2026.11.04.3","items": ["Drew interfaces that were only described in text: **Cx / Sh** (IMS–HSS), **Ro / Rf** (IMS–OCS/OFCS), **Sy** (PCRF–OCS), **S9** (PCRF–roaming partner), **S6d** (S4-SGSN–HSS), **Gs** (SGSN–MSC/VLR), **Gc** (GGSN–HLR), **Nhss** (HSS–UDM interworking, R16), and reference points **N23** (PCF–NWDAF) and **N34** (NSSF–NWDAF).","Diameter in 5G networks made visible: N5 to the IMS is now “N5 / Rx” (PCF supports Rx per TS 23.503 Annex C), N6/SGi/Gi carry the DN-AAA (RADIUS/Diameter) option; *5G SA* + *Diameter* filter highlights Cx/Sh, Ro/Rf, N5/Rx and N6.","EPC zone label moved to the bottom-right corner."]},{"v": "2026.11.04.2","items": ["Added **ng-eNB** (E-UTRA connected to 5GC) in the NG-RAN area with LTE-Uu, N2 (NG-C) to AMF, N3 (NG-U) to UPF and Xn to the gNB; notes on Options 4/4a, 5 and 7/7a/7x.","5G SA chip now reads “5GC · Opt. 2 (4/5/7)”."]},{"v": "2026.11.04","items": ["First release: architecture map (3G, HSPA, 4G, 5G NSA, 5G SA, interworking), element/interface details with protocol stacks, end-to-end stack view, interface table, deep links, dark/light theme.","Added Gx between GGSN (PCEF) and PCRF (R7+).","Added EPC **CUPS view**: SGW-C/U, PGW-C/U, Sxa, Sxb, S5-C/U, S4-C/U.","Compact top bar (two rows at 1920 px), protocol filter as a dropdown, date-based version label."]}];

const GENS = {
  '2g':  {n:'2G GSM', s:'GPRS · EDGE', v:'--g2g'},
  '3g':  {n:'3G UMTS', s:'R99 / R4', v:'--g3g'},
  'hspa':{n:'HSPA / HSPA+', s:'R5–R8+', v:'--ghspa'},
  '4g':  {n:'4G LTE / EPC', s:'R8+', v:'--g4g'},
  'nsa': {n:'5G NSA', s:'EN-DC · 3/3a/3x', v:'--gnsa'},
  'sa':  {n:'5G SA', s:'5GC · 2/4/5/7', v:'--gsa'},
  'wifi':{n:'Wi-Fi', s:'', v:'--gwifi'},
  'iw':  {n:'Interworking', s:'', v:'--giw'}
};
const GENORDER = ['2g','3g','hspa','4g','nsa','sa','wifi','iw'];

const GENINFO = {
 '2g':{rel:'GSM Phase 1 (1991) / Phase 2 (1995) · GPRS R97 · EDGE R99 · EDGE Evolution R7',sum:'TDMA radio (200 kHz carriers, 8 timeslots) with a BTS/BSC access network. The circuit-switched core (MSC/VLR, HLR/AuC) existed from the start; GPRS added the packet core (SGSN/GGSN) and EDGE raised packet data rates. 2G and 3G normally share one CS and PS core.',pts:[
  'BSS: BTS (radio, channel coding, A5 ciphering for CS) + BSC (radio resource management, handover) + TRAU (transcoder, part of the BSS but usually at the MSC site) + PCU (GPRS/EDGE RLC/MAC, usually at the BSC).',
  'CS: A interface to the MSC (Server) – BSSAP over SS7, or SIGTRAN (R8); user plane 64 kbit/s TDM after the TRAU, or RTP with A over IP (R8, transcoder in the BSS or in the MGW).',
  'PS: Gb interface to the SGSN – BSSGP / Network Service over Frame Relay or UDP/IP (R4). LLC and SNDCP run between MS and SGSN, and GPRS ciphering (GEA) terminates in the SGSN.',
  'Data rates: GPRS CS-1…CS-4 up to 21.4 kbit/s per timeslot; EDGE (8-PSK) MCS-1…MCS-9 up to 59.2 kbit/s per timeslot (≈ 236 kbit/s with 4 downlink timeslots). EDGE Evolution adds higher-order modulation and downlink dual carrier.',
  'Security: one-way authentication (triplets RAND/SRES/Kc); ciphering A5/1 or A5/3 for CS and GEA3/GEA4 for PS. A5/2 and GEA1 are prohibited in current specifications.',
  'With modern networks: CSFB and SRVCC from LTE can target GERAN (SGs, Sv), LTE ↔ GERAN reselection/redirection/NACC, and an S4-SGSN can anchor 2G data in the EPC. There is no direct 5GS ↔ GERAN mobility.'],specs:'TS 43.051 · 23.060 · 44.018 · 44.060 · 48.008 · 48.018'},
 '3g':{rel:'3GPP R99 (2000) · R4 (2001)',sum:'WCDMA radio access (5 MHz, 3.84 Mcps) with an RNC-based hierarchical UTRAN and a core network split into circuit-switched (CS) and packet-switched (PS) domains.',pts:[
  'UTRAN: Node B (mainly Layer 1) controlled by the RNC, which terminates RRC, RLC, MAC-d and PDCP and performs RRM and ciphering.',
  'CS domain: R99 MSC/VLR; R4 splits it into MSC Server (call control) and CS-MGW (bearer), with BICC or SIP-I on Nc between servers.',
  'PS domain: SGSN (mobility and session management) + GGSN (IP anchor) connected by GTP over Gn (Gp between PLMNs).',
  'Subscriber data in HLR/AuC over MAP (SS7 or SIGTRAN); UMTS AKA gives mutual authentication (quintets).',
  'Soft handover with macro-diversity combining in the RNC; R99 DCH peak 384 kbps DL.',
  'Transport originally ATM (AAL2 user plane, AAL5 signalling); IP transport option from R5.'],specs:'TS 23.002 · 23.060 · 25.401 · 33.102'},
 'hspa':{rel:'R5 HSDPA (2002) · R6 HSUPA (2004) · R7+ HSPA+',sum:'Packet-data enhancement of the 3G radio. Same network elements as 3G, but fast scheduling and HARQ move from the RNC into the Node B.',pts:[
  'HSDPA: shared HS-DSCH, 2 ms TTI, MAC-hs/ehs scheduler + HARQ in the Node B, CQI-based link adaptation; R5 peak 14.4 Mbps.',
  'HSUPA (E-DCH): MAC-e/i in the Node B, 2 or 10 ms TTI, grants via E-AGCH/E-RGCH; R6 peak 5.76 Mbps.',
  'HSPA+: 64QAM DL (21 Mbps) and 2×2 MIMO (28 Mbps) and 16QAM UL (11.5 Mbps) in R7; DC-HSDPA / 64QAM+MIMO (42 Mbps) in R8; CPC, Enhanced L2, Enhanced CELL_FACH.',
  'Much higher Iub load: IP/Ethernet Iub (R5) and HS-DSCH flow control / congestion control on Iub FP.',
  'Direct Tunnel (R7): GTP-U from the RNC straight to the GGSN (or SGW via S12); the SGSN stays in the control plane.',
  'HS-DSCH has no soft handover (serving-cell change); E-DCH keeps soft handover.'],specs:'TS 25.308 · 25.319 · 25.435 · 23.060 · 23.919'},
 '4g':{rel:'R8 (2008/09) · LTE-Advanced R10+ · LTE-A Pro R13+',sum:'Flat all-IP system: eNB with the complete radio stack (no RNC) and the EPC with separated control plane (MME) and user plane (SGW/PGW).',pts:[
  'OFDMA downlink / SC-FDMA uplink, 1.4–20 MHz carriers; carrier aggregation (R10+), higher-order MIMO.',
  'EPS bearer model: default bearer at attach (always-on IP) + dedicated bearers; QCI and ARP; APN-AMBR and UE-AMBR.',
  'MME: NAS, security, mobility. SGW: mobility anchor. PGW: IP anchor and PCEF. HSS (Diameter). PCRF (PCC).',
  'Voice: VoLTE over IMS (QCI 1 media / QCI 5 SIP), or CS Fallback to 2G/3G via SGs; SRVCC to CS via Sv.',
  'Interworking with 2G/3G: S3/S4/S12 with S4-SGSN, or Gn/Gp with legacy SGSN.',
  'R14 CUPS: SGW and PGW split into -C and -U parts controlled with PFCP over Sxa/Sxb – switch “EPC” to CUPS in the toolbar to see it.'],specs:'TS 23.401 · 36.300 · 23.203 · 23.214'},
 'nsa':{rel:'R15 “early drop” (Dec 2017) · Option 3 / 3a / 3x',sum:'E-UTRA–NR Dual Connectivity (EN-DC): NR is added as a secondary node to an LTE anchor and the core stays EPC. NR adds capacity and throughput, LTE keeps control and coverage.',pts:[
  'The MeNB (eNB) is the control-plane anchor and the only node with S1-MME. The en-gNB has S1-U (3a/3x) and X2 to the MeNB, but no NG interfaces.',
  'Option 3: MCG split bearer in the MeNB (S1-U to eNB only). Option 3a: SCG bearer, SGW → en-gNB, no split. Option 3x: SCG split bearer in the en-gNB (the most widely deployed).',
  'The NR leg is added by SgNB Addition, typically after a B1 measurement. The UE stays camped on LTE (no NR idle mode).',
  'EPC upgrades: DCNR support in MME/HSS (“NR as Secondary RAT” restriction), extended bit rates (> 4.2 Gbps), and Secondary RAT usage reporting for charging.',
  'No 5GC features: no network slicing, no QoS flows/SDAP, no SBA. QoS stays QCI-based EPS bearers.',
  'Voice stays on LTE (VoLTE) or CSFB.'],specs:'TS 37.340 · 36.423 · 38.425 · 23.401'},
 'sa':{rel:'R15 (SA freeze Jun 2018) · R16 (2020) · R17 (2022) · R18 5G-Advanced',sum:'The NR gNB connects to the new 5G Core (5GC), built as a Service-Based Architecture with HTTP/2 APIs and native control/user-plane separation (SMF/UPF).',pts:[
  'NG-RAN: gNB with CU-CP / CU-UP / DU split (F1, E1); Xn between gNBs; RRC_INACTIVE state.',
  '5GC NFs: AMF (access and mobility), SMF (sessions), UPF (user plane), AUSF/UDM/UDR (authentication and data), PCF (policy), NRF, NSSF, NEF, CHF, NWDAF; SCP and SEPP for SBI routing and roaming.',
  'PDU session (IPv4/IPv6/Ethernet/Unstructured) with QoS flows (5QI, QFI) mapped to DRBs by SDAP.',
  'Network slicing: S-NSSAI = SST (8 bit) + optional SD (24 bit); NSSAI negotiated at registration.',
  'Security: SUCI concealment, 5G AKA / EAP-AKA′, SEAF in AMF, SEPP + N32 for roaming.',
  'Voice: VoNR (IMS over 5GS) or EPS fallback to VoLTE (N26 enables seamless fallback).',
  'LTE on the 5GC: an ng-eNB (E-UTRA radio, NG + Xn interfaces) enables Option 5 (ng-eNB alone), Option 7/7a/7x (NGEN-DC) and Option 4/4a (NE-DC). Rarely deployed – most networks use Option 2 and keep LTE on the EPC.'],specs:'TS 23.501 · 23.502 · 23.503 · 38.300 · 38.401 · 37.340'},
 'wifi':{rel:'R8 (TS 23.402) · VoWiFi R12/R13 (TS 24.302, GSMA IR.51)',sum:'Untrusted non-3GPP access: the UE reaches the EPC over any Wi-Fi through an IKEv2 / IPsec tunnel to the ePDG. The PGW stays the IP anchor, so a VoWiFi call can move between LTE and Wi-Fi keeping its IP address.',pts:[
  'ePDG: terminates IKEv2 / IPsec from the UE (SWu), relays EAP-AKA to the 3GPP AAA server (SWm) and connects each PDN connection to the PGW with GTPv2-C / GTP-U over S2b.',
  '3GPP AAA server: EAP-AKA with vectors and the Non-3GPP-User-Data from the HSS (SWx); keeps the PGW identity per APN, reported by the PGW over S6b.',
  'ePDG selection by DNS (epdg.epc.mnc…mcc….pub.3gppnetwork.org), from R13 also by tracking area or visited country.',
  'VoWiFi (Wi-Fi calling) uses the IMS APN through the tunnel – the same IMS as VoLTE. Handover LTE ↔ Wi-Fi keeps the address via the PGW (Handover Indication on S2b).',
  'Not drawn: trusted Wi-Fi access (TWAN with S2a / STa) and the 5G gateways N3IWF (untrusted) and TNGF (trusted). VoWiFi in 5G networks usually still runs through an ePDG connected to a combined SMF+PGW-C.'],specs:'TS 23.402 · 24.302 · 33.402 · 29.273 · 29.274 · GSMA IR.51'},
 'iw':{rel:'R8 (EPC ↔ 2G/3G, CSFB, SRVCC) · R15 (5GS ↔ EPS)',sum:'Inter-generation interfaces used for mobility, voice continuity and core interworking.',pts:[
  'S3 (MME–SGSN, GTPv2-C) and S4 (SGSN–SGW): 2G/3G ↔ LTE mobility with an S4-SGSN; enables ISR.',
  'S12 (RNC–SGW): Direct Tunnel user plane when 3G uses the EPC gateways.',
  'A legacy Gn/Gp SGSN interworks with MME and PGW over Gn (GTPv1), per TS 23.401 Annex D.',
  'SGs (MME–MSC/VLR): CSFB and SMS over SGs. Sv (MME–MSC Server): SRVCC.',
  'N26 (AMF–MME): 5GS ↔ EPS mobility with single registration; EPS fallback for voice.',
  'Combined nodes for 5GS–EPS interworking: SMF+PGW-C, UPF+PGW-U, PCF+PCRF, UDM+HSS.',
  '2G: CSFB to GERAN (SGs), SRVCC to GERAN (Sv, voice only), LTE ↔ GERAN reselection / redirection / NACC; an S4-SGSN with Gb anchors 2G data in the EPC.',
  'No direct 5GS ↔ GERAN or UTRAN mobility (always via EPS). Exception: 5G-SRVCC (R16) from NG-RAN to UTRAN, via N26 → MME_SRVCC → Sv → MSC Server.'],specs:'TS 23.401 · 23.272 · 23.216 · 23.501 §5.17 · 23.502 §4.11'}
};

 tips:['S1 Setup failure: compare served PLMN/TAC with the MME configuration.','X2 handover failures: check neighbour relations, X2 SCTP association state and the Handover Preparation Failure cause.']},

{id:'engnb',n:'en-gNB',sb:'NR secondary node (EN-DC)',gens:['nsa'],x:285,y:590,w:140,h:56,
 full:'en-gNB – NR node in EN-DC acting as Secondary Node',
 sum:'NR node that provides NR radio to the UE as Secondary Node of an LTE MeNB. Connected to the EPC by S1-U only; it has no NG interfaces.',
 fn:['NR PHY/MAC/RLC for the Secondary Cell Group (PSCell + SCells).','NR PDCP for SN-terminated bearers (SCG bearer, SCG split bearer); no SDAP, because EPS bearers are used rather than QoS flows.','Own NR RRC entity: generates the SCG configuration, delivered to the UE inside MeNB RRC or directly over SRB3 (optional).','X2-C (X2AP EN-DC procedures) and X2-U to the MeNB; S1-U to the SGW in Options 3a/3x.','Secondary RAT data volume reporting via the MeNB for charging.'],
 notes:{nsa:'Can itself be split into gNB-CU / gNB-DU (F1) and CU-CP / CU-UP (E1) exactly as in SA. Option 3: no S1-U at the en-gNB. Option 3a: SCG bearer. Option 3x: SCG split bearer (most common).'},
 kv:[['NR CGI','PLMN + NCI (36 bit)'],['PCI','0–1007'],['System info','An NR cell need not broadcast SIB1; the UE camps on LTE']],
 specs:['TS 37.340','38.300','36.423','38.425','38.331'],
 tips:['SgNB Addition Reject or SCG failure (t310-Expiry, randomAccessProblem, rlc-MaxNumRetx, synchReconfigFailureSCG, scg-ReconfigFailure): check the X2AP cause and the UE’s SCGFailureInformationNR.','Low NR throughput in 3x: check split-bearer flow control (DDDS on X2-U) and the UL path configuration (primaryPath, ul-DataSplitThreshold).']},

{id:'gnb',n:'gNB',sb:'',gens:['sa'],kind:'container',x:190,y:880,w:380,h:310,
 full:'gNB – NR base station connected to the 5GC',
 sum:'NR RAN node for SA. Logically split per TS 38.401 into one gNB-CU-CP, one or more gNB-CU-UPs and one or more gNB-DUs; a monolithic gNB is equally valid.',
 fn:['RRC (RRC_IDLE / RRC_INACTIVE / RRC_CONNECTED), SDAP (QoS flow → DRB mapping), PDCP, RLC, MAC, PHY.','AMF selection (5G-S-TMSI / GUAMI, NSSAI) and routing of user plane to the UPF per PDU session.','Network slicing support (S-NSSAI per PDU session), beam management.','RAN-based Notification Area and RAN paging for RRC_INACTIVE.','Xn and NG handover; MR-DC (NR-DC, NGEN-DC, NE-DC) as master or secondary node.'],
 kv:[['NCGI','PLMN + NCI (36 bit: gNB-ID 22–32 bit + cell ID)'],['PCI','0–1007'],['TAC','24 bit'],['Node ID','Global gNB ID']],
 specs:['TS 38.300','38.401','38.331','38.413','38.423'],
 tips:['NG Setup failure: compare the Supported TA List (TAC, PLMN, S-NSSAI) with the AMF configuration.','Registration failing right after RRC setup: check NGAP Initial UE Message and AMF selection (GUAMI / AMF Set).']},

{id:'ngenb',n:'ng-eNB',sb:'LTE base station on 5GC',gens:['sa'],x:215,y:1230,w:130,h:48,
 full:'ng-eNB – E-UTRA (LTE) base station connected to the 5GC',
 sum:'An LTE eNB that is an NG-RAN node: E-UTRA radio towards the UE, NG interfaces towards the 5GC and Xn towards gNBs. Sometimes called “eLTE”.',
 fn:['E-UTRA PHY/MAC/RLC/PDCP/RRC plus SDAP, which maps 5GC QoS flows onto DRBs.','NG-C (NGAP) to the AMF and NG-U (GTP-U, one tunnel per PDU session) to the UPF – the same protocols as a gNB.','Xn to gNBs and other ng-eNBs: handover, RRC_INACTIVE context retrieval, multi-radio dual connectivity.','Brings 5GC features to LTE radio: 5G NAS and security, PDU sessions, network slicing, RRC_INACTIVE.','A cell can be connected to the EPC (S1) and the 5GC (NG) at the same time; each UE is served by the core type it and its subscription support.'],
 notes:{sa:'Deployment options with the 5GC: Option 5 – ng-eNB alone; Option 7/7a/7x (NGEN-DC) – ng-eNB master, gNB secondary; Option 4/4a (NE-DC) – gNB master, ng-eNB secondary. Uncommon in practice: most networks went from Option 3x to Option 2 and keep LTE on the EPC with N26 interworking.'},
 kv:[['Node ID','Global ng-eNB ID (macro 20 bit, short macro 18 bit, long macro 21 bit)'],['Cell ID','E-UTRA CGI (28-bit ECI)'],['TAC','24 bit when connected to the 5GC (16 bit towards EPC)'],['PCI','0–503']],
 specs:['TS 38.300','36.300','36.331','38.413','38.423','37.340'],
 tips:['NG Setup failure: compare the Supported TA List (24-bit TAC, PLMN, S-NSSAI) sent by the ng-eNB with the AMF configuration.','In a cell connected to both cores, UEs that do not support E-UTRA connected to 5GC (or lack a 5GS subscription) stay on the EPC.']},

{id:'gnbdu',n:'gNB-DU',sb:'RLC · MAC · PHY',gens:['sa'],x:215,y:1015,w:120,h:60,
 full:'gNB Distributed Unit',
 sum:'Hosts RLC, MAC and PHY (or only high-PHY when an O-RAN 7.2x Radio Unit is used).',
 fn:['RLC (AM/UM/TM), MAC (scheduling, HARQ, beam management), PHY.','One DU serves one or more cells; a cell belongs to exactly one DU.','Terminates F1-C to the CU-CP and F1-U to the CU-UP(s).','Fronthaul to the Radio Unit (CPRI/eCPRI or O-RAN Open Fronthaul 7.2x) is not a 3GPP interface.'],
 notes:{sa:'A gNB-DU connects to only one gNB-CU-CP, but may connect to several gNB-CU-UPs under the control of the same CU-CP (TS 38.401).'},
 specs:['TS 38.401','38.321','38.322','38.473'],
 tips:['F1 Setup Failure: the served-cell configuration (NCGI, PCI, TAC, PLMN) must match the CU.']},

{id:'gnbcucp',n:'gNB-CU-CP',sb:'RRC · PDCP-C',gens:['sa'],x:420,y:920,w:130,h:54,
 full:'gNB Central Unit – Control Plane',
 sum:'Hosts RRC and the PDCP of the signalling radio bearers; the control-plane part of the gNB.',
 fn:['RRC and PDCP-C (SRBs).','Terminates N2 (NGAP), Xn-C, F1-C (to all DUs) and E1 (to the CU-UPs).','Selects the CU-UP and sets up bearer contexts over E1; manages DU UE contexts over F1AP.','Mobility decisions and admission control.'],
 notes:{sa:'One gNB-CU-UP is connected to only one gNB-CU-CP (TS 38.401).'},
 specs:['TS 38.401','38.473','38.463','38.413']},

{id:'gnbcuup',n:'gNB-CU-UP',sb:'SDAP · PDCP-U',gens:['sa'],x:420,y:1120,w:130,h:54,
 full:'gNB Central Unit – User Plane',
 sum:'Hosts SDAP and the PDCP of the data radio bearers.',
 fn:['SDAP: QoS flow (QFI) ↔ DRB mapping and reflective QoS marking.','PDCP-U: ciphering, optional integrity protection, ROHC, reordering, duplication.','Terminates N3 (GTP-U to the UPF), Xn-U, F1-U (to DUs) and E1 (to the CU-CP).'],
 notes:{nsa:'In a split en-gNB the CU-UP has PDCP only – there is no SDAP in EN-DC.'},
 specs:['TS 37.324 (SDAP)','38.323 (PDCP)','38.463']},

{id:'mme',n:'MME',sb:'Mobility Management Entity',gens:['4g','nsa'],x:650,y:425,w:150,h:56,
 full:'Mobility Management Entity',
 sum:'EPC control-plane node for NAS signalling, security, mobility and bearer control. No user data passes through the MME.',
 fn:['Terminates NAS EMM/ESM with NAS ciphering and integrity (TS 24.301).','Authentication (EPS AKA with vectors from the HSS over S6a) and GUTI allocation.','Tracking-area list management, idle-mode reachability, paging.','SGW/PGW selection (DNS S-NAPTR on TAI and APN FQDNs) and bearer management over S11.','Inter-MME (S10) and inter-RAT (S3 / Gn) mobility, ISR.','CSFB and SMS over SGs, SRVCC over Sv, IMEI check over S13.'],
 notes:{nsa:'Must support EN-DC: understands the UE’s DCNR bit, applies the HSS “NR as Secondary RAT Not Allowed” restriction (signalled to the eNB in the Handover Restriction List), handles extended bit rates above 4.2 Gbps and supports Secondary RAT usage data reporting.'},
 kv:[['GUMMEI','PLMN + MMEGI (16 bit) + MMEC (8 bit)'],['GUTI','GUMMEI + M-TMSI (32 bit)'],['S-TMSI','MMEC + M-TMSI'],['TAI','PLMN + TAC']],
 specs:['TS 23.401','24.301','36.413','29.274','29.272'],
 tips:['Attach/TAU reject EMM causes: #3 Illegal UE, #7 EPS services not allowed, #8 EPS and non-EPS services not allowed, #11 PLMN not allowed, #12 TA not allowed, #13 Roaming not allowed in this TA, #15 No suitable cells in TA, #19 ESM failure (see ESM cause), #22 Congestion.','ESM causes: #26 Insufficient resources, #27 Missing or unknown APN, #29 User authentication failed, #33 Requested service option not subscribed.']},

{id:'hss',n:'HSS',sb:'Home Subscriber Server',gens:['4g','nsa'],x:890,y:425,w:140,h:56,
 full:'Home Subscriber Server',
 sum:'EPC and IMS master subscriber database and authentication centre, accessed over Diameter.',
 fn:['Subscription data: APN configurations, default QoS (QCI/ARP), AMBR, access and roaming restrictions.','EPS AKA vector generation (RAND, XRES, AUTN, KASME).','Location management: stores the serving MME/SGSN and sends Cancel Location on change.','IMS: Cx (I/S-CSCF) and Sh (application servers). Non-3GPP access: SWx.'],
 notes:{nsa:'The Access-Restriction-Data flag “NR as Secondary RAT Not Allowed” controls EN-DC per subscriber; extended AMBR AVPs allow > 4.2 Gbps.',sa:'For 5GS–EPS interworking a combined HSS+UDM serves both systems. If HSS and UDM are separate NFs they interwork over Nhss/Nudm (R16, TS 23.632). Cx/Sh towards the IMS remain Diameter in 5G SA networks.'},
 kv:[['Keys','IMSI; MSISDN; per-APN Context-Identifier']],
 specs:['TS 23.401','29.272','29.228/29.229 (Cx)','33.401'],
 tips:['S6a Experimental-Result-Code: 5001 USER_UNKNOWN, 5004 ROAMING_NOT_ALLOWED, 5420 UNKNOWN_EPS_SUBSCRIPTION, 5421 RAT_NOT_ALLOWED, 4181 AUTHENTICATION_DATA_UNAVAILABLE.']},

{id:'sgw',n:'SGW',sb:'Serving Gateway',gens:['4g','nsa'],nocups:true,x:650,y:610,w:150,h:56,
 full:'Serving Gateway',
 sum:'User-plane mobility anchor between the RAN and the PGW; buffers downlink data for idle UEs.',
 fn:['Local mobility anchor for inter-eNB handover (path switch, End Marker).','Anchor for inter-3GPP mobility (S4/S12 towards 2G/3G).','DL buffering in ECM-IDLE and Downlink Data Notification to the MME, which triggers paging.','Packet routing and forwarding; transport-level DSCP marking per QCI/ARP.','Accounting for inter-operator charging (SGW-CDR), lawful interception.'],
 notes:{'4g':'CUPS (R14): SGW-C + SGW-U with Sxa (PFCP, TS 29.244).'},
 specs:['TS 23.401','29.274','29.281','23.214 (CUPS)'],
 tips:['DDN not followed by paging/Service Request: check the S11 DDN Acknowledge cause and MME paging.','GTPv2 cause 64 “Context Not Found” after a restart: compare the Recovery IE (restart counter) of the peers.']},

{id:'pgw',n:'PGW',sb:'PDN Gateway',gens:['4g','nsa'],nocups:true,x:890,y:610,w:140,h:56,
 full:'PDN Gateway',
 sum:'IP anchor of the PDN connection: allocates the UE IP, enforces policy and charging and connects to the PDN over SGi.',
 fn:['UE IP allocation (IPv4, IPv6 prefix, IPv4v6) per APN.','PCEF: PCC rule enforcement, gating, QoS (APN-AMBR, GBR/MBR), dedicated-bearer initiation (Gx).','Online (Gy) and offline (Gz) charging, service data flow detection / DPI.','Anchor for mobility between 3GPP and non-3GPP access (S2a/S2b).','Lawful interception; SGi AAA (RADIUS/Diameter).'],
 notes:{'4g':'CUPS: PGW-C + PGW-U over Sxb (PFCP).',sa:'For 5GS interworking: combined SMF+PGW-C and UPF+PGW-U.'},
 specs:['TS 23.401','23.203','29.274','29.061','29.212'],
 tips:['GTPv2 Create Session Response causes: 16 Request accepted, 64 Context not found, 72 System failure, 73 No resources available, 78 Missing or unknown APN, 84 All dynamic addresses are occupied, 92 User authentication failed, 93 APN access denied – no subscription, 94 Request rejected (reason not specified), 100 Remote peer not responding.']},

{id:'sgwc',n:'SGW-C',sb:'SGW control plane',gens:['4g','nsa'],cups:true,x:650,y:540,w:150,h:44,
 full:'Serving Gateway – control-plane function (CUPS, R14)',
 sum:'Control part of a split SGW. Terminates the GTPv2-C interfaces (S11, S5/S8-C, S4-C) and controls one or more SGW-Us over Sxa (PFCP).',
 fn:['Terminates S11 from the MME, S5/S8-C towards the PGW-C and S4-C towards an S4-SGSN.','Selects the SGW-U for a PDN connection (e.g. by UE location, APN, UE usage type, load) and creates the Sxa session.','Allocates the user-plane F-TEIDs or lets the SGW-U allocate them (PFCP CHOOSE flag).','Downlink data for an idle UE: on a Session Report (downlink data report) from the SGW-U it sends Downlink Data Notification to the MME.','Builds SGW charging data from URR usage reports.'],
 notes:{'4g':'SGW-C and PGW-C can be one combined node; a combined SGW-U/PGW-U can then be controlled with a single combined Sxa/Sxb PFCP session.'},
 specs:['TS 23.214','29.244','29.274'],
 tips:['Missing DL data after Service Request: check that the SGW-C sent Sxa Session Modification with the new eNB F-TEID in the DL FAR.']},

{id:'sgwu',n:'SGW-U',sb:'SGW user plane',gens:['4g','nsa'],cups:true,x:650,y:630,w:150,h:44,
 full:'Serving Gateway – user-plane function (CUPS, R14)',
 sum:'User-plane part of a split SGW, controlled by the SGW-C over Sxa. Relays GTP-U between the RAN and the PGW-U.',
 fn:['Terminates S1-U (eNB / en-gNB), S12 (RNC), S4-U (S4-SGSN) and S5/S8-U towards the PGW-U.','Applies the PDRs/FARs from the SGW-C: GTP-U relay, End Marker on path switch when instructed.','DL buffering for idle UEs per BAR – or forwards DL packets to the SGW-C when buffering is done in the CP function.','Usage reporting (URR) to the SGW-C; transport-level DSCP marking.'],
 specs:['TS 23.214','29.244','29.281']},

{id:'pgwc',n:'PGW-C',sb:'PGW control plane',gens:['4g','nsa'],cups:true,x:890,y:540,w:140,h:44,
 full:'PDN Gateway – control-plane function (CUPS, R14)',
 sum:'Control part of a split PGW. Terminates S5/S8-C, Gx, Gy/Gz and SGi AAA signalling, handles UE IP allocation and controls PGW-Us over Sxb (PFCP).',
 fn:['Terminates S5/S8-C (GTPv2-C), Gx towards the PCRF, Gy/Gz charging and RADIUS/Diameter on SGi.','UE IP address allocation (may be delegated to the PGW-U) and APN handling.','PGW-U selection; translates PCC rules into PDR/FAR/QER/URR in the PGW-U.','Turns PGW-U usage reports into online/offline charging and usage-monitoring reports.'],
 notes:{sa:'For 5GS interworking the PGW-C is combined with the SMF (SMF+PGW-C) and controls a UPF+PGW-U over N4.'},
 specs:['TS 23.214','29.244','29.274','29.212']},

{id:'pgwu',n:'PGW-U',sb:'PGW user plane',gens:['4g','nsa'],cups:true,x:890,y:630,w:140,h:44,
 full:'PDN Gateway – user-plane function (CUPS, R14)',
 sum:'User-plane part of a split PGW, controlled by the PGW-C over Sxb. Anchors the user IP traffic and connects to the PDN over SGi.',
 fn:['Terminates S5/S8-U and the SGi user plane.','Packet detection (incl. application detection), gating, QoS enforcement (APN-AMBR, MBR/GBR) and DL bearer binding per QER/FAR.','Usage measurement and reporting (URR) for charging and usage monitoring.','User-plane lawful interception on request of the PGW-C.'],
 notes:{sa:'For 5GS interworking: combined UPF+PGW-U.'},
 specs:['TS 23.214','29.244','29.281']},

{id:'pcrf',n:'PCRF',sb:'Policy & Charging Rules',gens:['4g','nsa'],x:1130,y:540,w:130,h:50,
 full:'Policy and Charging Rules Function',
 sum:'Central PCC policy decision point for EPS (and for GPRS from R7).',
 fn:['Provides PCC rules to the PCEF over Gx: QoS (QCI, ARP, MBR/GBR), gating, charging keys, event triggers.','Receives application/session information from the AF over Rx (e.g., the IMS P-CSCF for VoLTE) and binds it to the IP-CAN session.','Usage monitoring / fair-usage policy; Sy to the OCS for spending limits; Sd to a TDF; S9 for roaming (V-PCRF/H-PCRF).'],
 notes:{'3g':'For 2G/3G packet core the GGSN is the PCEF on Gx (R7+).','4g':'VoLTE: P-CSCF → Rx AAR (SDP media) → PCRF → Gx RAR (Charging-Rule-Install, QCI 1) → PGW → Create Bearer Request → dedicated bearer.',sa:'For 5GS interworking: combined PCF+PCRF.'},
 specs:['TS 23.203','29.212 (Gx)','29.214 (Rx)','29.219 (Sy)'],
 tips:['A Gx CCR-I failure usually rejects the PDN connection – check the Result-Code and PCRF reachability (DRA).','Rx Experimental-Result 5065 IP-CAN_SESSION_NOT_AVAILABLE: the PCRF cannot bind the Rx session to a Gx session (check UE IP / APN binding).']},

{id:'ocs',n:'OCS / OFCS',sb:'Online / offline charging',gens:['3g','hspa','4g','nsa'],pc:'4g',x:1130,y:405,w:130,h:56,
 full:'Online Charging System / Offline Charging System (CDF, CGF)',
 sum:'Charging back-end for 3G/4G packet core: real-time credit control (online) and CDR collection (offline).',
 fn:['OCS: Diameter Credit Control on Gy (CCR/CCA, quota per rating group via MSCC); Ro for IMS.','OFCS: the CDF receives Rf (Diameter ACR/ACA); the CGF collects CDRs over Ga (GTP′) and forwards them to billing (Bx).','Sy (OCS–PCRF) for policy counters / spending limits.'],
 notes:{sa:'In the 5GC the CHF (Converged Charging System) replaces this, reached over Nchf (N40 from SMF, N28 from PCF).'},
 specs:['TS 32.240','32.251','32.295 (GTP′)','32.299 (Diameter charging)'],
 tips:['Gy result codes 4012 DIAMETER_CREDIT_LIMIT_REACHED and 4010 END_USER_SERVICE_DENIED are subscriber/credit issues. On OCS time-outs, gateway behaviour follows Credit-Control-Failure-Handling (CCFH).']},

{id:'amf',n:'AMF',sb:'Access & Mobility Mgmt',gens:['sa'],x:640,y:910,w:110,h:52,
 full:'Access and Mobility Management Function',
 sum:'5GC control-plane entry point for the UE. Terminates N1 (NAS) and N2 and handles registration, connection, reachability and mobility. Relays session signalling to the SMF.',
 fn:['Registration management (initial, mobility, periodic), connection management (CM-IDLE / CM-CONNECTED), reachability and paging.','NAS ciphering and integrity (5GMM); SEAF security anchor; authentication via the AUSF (N12).','Relays 5GSM between UE and SMF (N11) and N2 SM information between SMF and gNB.','SMF selection (via NRF, by DNN + S-NSSAI); slice handling with the NSSF (Allowed NSSAI).','Access/mobility and UE policy from the PCF (N15); subscription from the UDM (N8).','Interworking with the EPC over N26; SMS over NAS with the SMSF; location services with the LMF.'],
 kv:[['GUAMI','PLMN + AMF Region ID (8) + AMF Set ID (10) + AMF Pointer (6)'],['5G-GUTI','GUAMI + 5G-TMSI (32 bit)'],['5G-S-TMSI','AMF Set ID + AMF Pointer + 5G-TMSI']],
 specs:['TS 23.501','23.502','24.501','38.413','29.518'],
 tips:['Registration Reject 5GMM causes: #3 Illegal UE, #7 5GS services not allowed, #11 PLMN not allowed, #12 Tracking area not allowed, #13 Roaming not allowed in this TA, #15 No suitable cells in TA, #27 N1 mode not allowed, #62 No network slices available.']},

{id:'ausf',n:'AUSF',sb:'Authentication Server',gens:['sa'],x:765,y:910,w:110,h:52,

 specs:['TS 33.501','29.509']},

{id:'udm',n:'UDM',sb:'Unified Data Mgmt',gens:['sa'],x:890,y:910,w:110,h:52,

 notes:{'4g':'For EPS interworking: combined HSS+UDM.'},

{id:'udr',n:'UDR',sb:'Unified Data Repository',gens:['sa'],x:1015,y:910,w:110,h:52,

{id:'nrf',n:'NRF',sb:'NF Repository',gens:['sa'],x:1265,y:910,w:110,h:52,

{id:'smf',n:'SMF',sb:'Session Mgmt Function',gens:['sa'],x:640,y:1080,w:110,h:52,

{id:'pcf',n:'PCF',sb:'Policy Control Function',gens:['sa'],x:765,y:1080,w:110,h:52,

 {const o=t==='el'?EM[id]:LM[id];if(o.cups&&!state.cups)state.cups=true;else if(state.cups&&(t==='el'?o.nocups:!cupsOK(o)))state.cups=false;}

 else{if(state.gens.has(g)){state.gens.delete(g);if(state.lastGen===g)state.lastGen=[...state.gens].pop()||null;}else{state.gens.add(g);state.lastGen=g;}}

 if(q.proc&&PM[q.proc]){const P=PM[q.proc],n=+q.step||0;pdOpen(q.proc,n?pdMsgs(P)[n-1]:null);return;}

function e2eParse(x){const i=x.indexOf('@');const text=(i>=0?x.slice(0,i):x).trim();
 const keys=i>=0?x.slice(i+1).split('+').map(k=>k.trim()):[e2eKey(text)];return {text,keys};}
function e2eKey(t){const k=t.toLowerCase();if(/\(user\)/.test(k))return 'user-ip';return k.replace(/\([^)]*\)/g,'').replace(/\s+/g,' ').trim();}
function e2eHop(text,keys){return ['tr','ip','phy','ss7','tun'].includes(kind(text))||keys.some(k=>/^gtpv/.test(k));}
function layerCell(x,p,n,st){const {text,keys}=e2eParse(x);return `<div class="ly k-${kind(text)}" data-p="${p}" data-n="${n}" data-s="${st}" data-k="${esc(keys.join('+'))}" data-hop="${e2eHop(text,keys)?1:0}">${esc(text)}</div>`;}
function layerHTML(x,p,n,st){if(x.includes(' | ')){const [a1,b1]=x.split(' | ');return `<div class="split">${layerCell(a1,p,n,st)}${layerCell(b1,p,n,st)}</div>`;}return layerCell(x,p,n,st);}
function e2ePaths(S){return S.paths||[{nodes:S.nodes,gaps:S.gaps}];}
function renderE2E(){const nav=$('#e2enav');
 nav.innerHTML=GENORDER.filter(g=>E2E.some(s=>s.g===g)).map(g=>`<h4>${esc(GENS[g].n)}</h4>`+E2E.filter(s=>s.g===g).map(s=>`<button data-e="${s.id}" class="${state.e2e===s.id?'on':''}" style="--c:${gcol(g)}"><i></i>${esc(s.t)}</button>`).join('')).join('');
 const S=E2E.find(s=>s.id===state.e2e)||E2E[0];
 let h=`<h2 style="color:${gcol(S.g)}">${esc(S.t)}</h2><p class="sum">${esc(S.sum)}</p><p class="e2e-hint">Hover or tap a layer to highlight its peer. Lower layers (transport, tunnels, L1/L2) are hop-by-hop; upper layers pass through relaying nodes until they reach their peer.</p>`;
 e2ePaths(S).forEach((P,pi)=>{
  if(P.t)h+=`<div class="e2e-path-t">${esc(P.t)}</div>`;
  h+=`<div class="e2e" data-p="${pi}">`;
  P.nodes.forEach((nd,i)=>{h+=`<div class="e2e-node"><div class="e2e-name">${esc(nd.n)}</div><div class="e2e-stacks">${nd.s.map((st,si)=>`<div class="e2e-stack ${st.ghost?'ghost':''}"><div class="e2e-side">${esc(st.h||'')}</div>${st.l.map(x=>layerHTML(x,pi,i,si)).join('')}</div>`).join('')}</div></div>`;
   if(i<P.nodes.length-1)h+=`<div class="e2e-gap"><span>${esc(P.gaps[i]||'')}</span></div>`;});
  if(P.tail)h+=`<div class="e2e-gap e2e-tail"><span>${esc(P.tail)}</span></div>`;
  h+=`</div>`;});
 h+=`<div class="klegend">${Object.entries(KINDNAMES).map(([k,v])=>`<span class="k-${k}">${esc(v)}</span>`).join('')}</div>`;
 h+=`<div class="e2e-notes"><h3 style="font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)">Notes</h3>${listHTML(S.notes)}</div>`;
 $('#e2emain').innerHTML=h;e2ePinned=null;}
/* peer highlighting */
let e2ePinned=null;
function e2ePeers(el){const S=E2E.find(s=>s.id===state.e2e)||E2E[0];const p=+el.dataset.p,n=+el.dataset.n,si=+el.dataset.s;const keys=el.dataset.k.split('+');
 const P=e2ePaths(S)[p];const root=$('#e2emain');const out=[el];
 const match=x=>x.dataset.k.split('+').some(k=>keys.includes(k));
 const cells=(nn,ss)=>[...root.querySelectorAll(`.ly[data-p="${p}"][data-n="${nn}"]`+(ss!=null?`[data-s="${ss}"]`:''))];
 if(el.dataset.hop!=='1'){root.querySelectorAll(`.ly[data-p="${p}"]`).forEach(x=>{if(x!==el&&match(x))out.push(x);});return out;}
 const nst=P.nodes[n].s.length;let dir=0;
 if(nst===1)dir=n===0?1:-1;else if(si===nst-1&&n<P.nodes.length-1)dir=1;else if(si===0&&n>0)dir=-1;
 if(!dir)return out;
 for(let k=n+dir;k>=0&&k<P.nodes.length;k+=dir){const facing=dir>0?0:P.nodes[k].s.length-1;const hit=cells(k,facing).filter(match);if(hit.length){out.push(...hit);break;}}
 return out;}
function e2eShow(el){const root=$('#e2emain');root.querySelectorAll('.ly.peer').forEach(x=>x.classList.remove('peer'));root.querySelectorAll('.e2e.peering').forEach(x=>x.classList.remove('peering'));
 if(!el)return;const peers=e2ePeers(el);const row=el.closest('.e2e');if(row)row.classList.add('peering');peers.forEach(x=>x.classList.add('peer'));}
$('#e2emain').addEventListener('mouseover',ev=>{if(e2ePinned)return;const el=ev.target.closest('.ly[data-k]');e2eShow(el||null);});
$('#e2emain').addEventListener('mouseleave',()=>{if(!e2ePinned)e2eShow(null);});
$('#e2emain').addEventListener('click',ev=>{const el=ev.target.closest('.ly[data-k]');if(!el||e2ePinned===el){e2ePinned=null;e2eShow(null);return;}e2ePinned=el;e2eShow(el);});
$('#e2enav').addEventListener('click',ev=>{const b=ev.target.closest('button[data-e]');if(!b)return;state.e2e=b.dataset.e;renderE2E();});
