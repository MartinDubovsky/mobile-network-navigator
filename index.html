/* ---------- normalisation, validation, merge ---------- */
function ndEmpty(name){return {network:name||'Unnamed network',instances:[],interfaces:{},ports:[]};}
function ndClean(raw){const w=[];const d=ndEmpty(String(raw.network||raw.name||'').trim());
 if(raw.format&&raw.format!==ND_FORMAT)w.push(`Unexpected format “${raw.format}” – read as network data anyway.`);
 (Array.isArray(raw.instances)?raw.instances:[]).forEach((I,ix)=>{const el=ndResolveEl(I.element);
  if(!el){w.push(`Instance ${ix+1} “${I.name||I.instance||''}”: unknown element “${I.element}” – skipped.`);return;}
  const inst={id:NDuid(),element:el,name:String(I.name||I.instance||'(unnamed)').trim(),site:String(I.site||'').trim(),note:String(I.note||'').trim(),addresses:[]};
  (Array.isArray(I.addresses)?I.addresses:[]).forEach(A=>inst.addresses.push({interface:ndResolveIf(A.interface||A.if||'',el),ip:String(A.ip||A.address||'').trim(),port:A.port==null?'':ndPortNorm(A.port),vlan:A.vlan==null?'':String(A.vlan).trim(),note:String(A.note||'').trim()}));
  d.instances.push(inst);});
 const ifs=raw.interfaces&&typeof raw.interfaces==='object'?raw.interfaces:{};
 Object.keys(ifs).forEach(k=>{const v=ifs[k]||{};d.interfaces[ndResolveIf(k,null)]={subnet:String(v.subnet||v.ip||'').trim(),vlan:v.vlan==null?'':String(v.vlan).trim(),note:String(v.note||'').trim()};});
 d.ports=(Array.isArray(raw.ports)?raw.ports:[]).map(ndPortRuleClean).filter(r=>r.proto||r.ports);
 return {d,w:w.concat(ndValidate(d))};}
function ndValidate(d){const w=[],seen={};
 d.instances.forEach(I=>{const E=EM[I.element];const ok=ndElKeys(I.element);
  I.addresses.forEach(A=>{const where=`${E.n} ${I.name}${A.interface?' · '+ndIfLabel(A.interface):''}`;
   if(!A.interface)w.push(`${where}: no interface given.`);
   else if(!ND_VALID_IF.has(A.interface))w.push(`${where}: unknown interface “${A.interface}” (kept).`);
   else if(!ok.has(A.interface))w.push(`${where}: ${ndIfLabel(A.interface)} is not an interface of ${E.n} in this tool (kept).`);
   const k=ndAddrKind(A.ip);if(k==='bad')w.push(`${where}: “${A.ip}” is not a valid IPv4 / IPv6 address, subnet or host name.`);
   if(A.port&&!ndPortOK(A.port))w.push(`${where}: port “${A.port}” is not valid – ${ND_PORTMSG}.`);
   if(['v4','v6','v4host','v6host'].includes(k)){const key=ndAddrOnly(A.ip);(seen[key]=seen[key]||new Set()).add(E.n+' '+I.name);}});});
 Object.entries(d.interfaces).forEach(([k,v])=>{if(!ND_VALID_IF.has(k))w.push(`Interface info: unknown interface “${k}” (kept).`);if(v.subnet&&ndAddrKind(v.subnet)==='bad')w.push(`Interface info ${ndIfLabel(k)}: “${v.subnet}” is not a valid subnet.`);});
 Object.entries(seen).forEach(([ip,s])=>{if(s.size>1)w.push(`Address ${ip} is used by several instances: ${[...s].join(', ')}.`);});
 return w.concat(ndPortsCheck(d));}
function ndCopy(I){return {...I,id:NDuid(),addresses:I.addresses.map(A=>({...A}))};}
function ndMerge(base,add){const out={network:base.network,instances:base.instances.map(ndCopy),interfaces:{...base.interfaces},ports:(base.ports||[]).map(r=>({...r}))};
 (add.ports||[]).forEach(r=>{if(!out.ports.some(x=>x.proto===r.proto&&x.tr===r.tr&&x.ports===r.ports))out.ports.push({...r});});
 if(!out.network||out.network==='Unnamed network')out.network=add.network;
 add.instances.forEach(I=>{const t=out.instances.find(x=>x.element===I.element&&x.name.toLowerCase()===I.name.toLowerCase());
  if(!t){out.instances.push(ndCopy(I));return;}
  if(I.site)t.site=I.site;if(I.note)t.note=I.note;
  I.addresses.forEach(A=>{if(!t.addresses.some(B=>B.interface===A.interface&&B.ip===A.ip&&B.port===A.port))t.addresses.push({...A});});});
 Object.assign(out.interfaces,add.interfaces);return out;}

/* ---------- CSV ---------- */
const ND_COLS={element:['element','el','elementtype','nodetype','networkelement','type'],instance:['instance','name','node','nodename','hostname','host'],site:['site','location'],
 interface:['interface','if','referencepoint','refpoint'],ip:['ip','address','ipaddress','addr','ipsubnet','subnet','prefix'],port:['port','ports'],vlan:['vlan','vlanid'],note:['note','notes','comment','comments','description','remark'],network:['network']};
function ndParseCSV(text){text=text.replace(/^﻿/,'');
 const first=(text.split(/\r?\n/).find(l=>l.trim()&&!l.trim().startsWith('#'))||'');const cnt=ch=>first.split(ch).length-1;
 const dl=cnt('\t')>cnt(',')&&cnt('\t')>cnt(';')?'\t':(cnt(';')>cnt(',')?';':',');
 const rows=[];let row=[],f='',q=false;
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
  else if(c==='"'&&f==='')q=true;else if(c===dl){row.push(f);f='';}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}else f+=c;}
 if(f!==''||row.length){row.push(f);rows.push(row);}
 let hdr=null,network=null;const raw={network:null,instances:[],interfaces:{},ports:[]},w=[],map={};
 rows.forEach((r,ri)=>{const line=ri+1;const c0=String(r[0]||'').trim();
  if(c0.startsWith('#')){const m=r.join(dl).match(/^\s*#\s*network\s*:\s*(.+?)\s*$/i);if(m&&!network)network=m[1].replace(/[,;\t]+$/,'').trim();
   const mp=r.join(dl).match(/^\s*#\s*ports?\s*:\s*(.*?)\s*$/i);if(mp){const x=ndPortsParseLine(mp[1].replace(/[,;\t]+$/,''));if(x)raw.ports.push(x);else w.push(`Line ${line}: “# ports:” without a protocol – skipped.`);}return;}
  if(r.every(x=>!String(x).trim()))return;
  if(!hdr){const h={};r.forEach((x,i)=>{const n=ndNorm(x);Object.entries(ND_COLS).forEach(([k,al])=>{if(h[k]==null&&al.includes(n))h[k]=i;});});
   if(h.element==null||h.ip==null){w.push('No header row found – the first row must name the columns (at least element and ip).');hdr={bad:1};return;}hdr=h;return;}
  if(hdr.bad)return;
  const g=k=>hdr[k]==null?'':String(r[hdr[k]]==null?'':r[hdr[k]]).trim();
  if(g('network')&&!network)network=g('network');
  const elv=g('element');
  if(!elv||elv==='-'){const k=g('interface');if(!k){w.push(`Line ${line}: neither element nor interface – skipped.`);return;}raw.interfaces[k]={subnet:g('ip'),vlan:g('vlan'),note:g('note')};return;}
  const name=g('instance')||'(unnamed)';const key=ndNorm(elv)+'|'+name.toLowerCase();
  let I=map[key];if(!I){I=map[key]={element:elv,name,site:g('site'),note:'',addresses:[]};raw.instances.push(I);}
  if(g('site')&&!I.site)I.site=g('site');
  if(g('ip')||g('interface'))I.addresses.push({interface:g('interface'),ip:g('ip'),port:g('port'),vlan:g('vlan'),note:g('note')});
  else if(g('note'))I.note=g('note');});
 if(!hdr)w.push('The file is empty.');
 raw.network=network;const res=ndClean(raw);return {d:res.d,w:w.concat(res.w)};}
function ndCSVcell(v){v=String(v==null?'':v);return /[",;\t\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function ndToCSV(d){const L=[`# network: ${d.network}`,...(d.ports||[]).map(ndPortsLine),'element,instance,site,interface,ip,port,vlan,note'];
 d.instances.forEach(I=>{if(!I.addresses.length||I.note)L.push([I.element,I.name,I.site,'','','','',I.note].map(ndCSVcell).join(','));
  I.addresses.forEach(A=>L.push([I.element,I.name,I.site,A.interface,A.ip,A.port,A.vlan,A.note].map(ndCSVcell).join(',')));});
 Object.entries(d.interfaces).forEach(([k,v])=>L.push(['','','',k,v.subnet,'',v.vlan,v.note].map(ndCSVcell).join(',')));
 return L.join('\r\n')+'\r\n';}
function ndToJSON(d){return {format:ND_FORMAT,version:1,network:d.network,saved:new Date().toISOString(),tool:'Mobile Network Navigator v'+VERSION,
 instances:d.instances.map(I=>({element:I.element,name:I.name,site:I.site,note:I.note,addresses:I.addresses.map(A=>({interface:A.interface,ip:A.ip,port:A.port,vlan:A.vlan,note:A.note}))})),interfaces:d.interfaces,
 ports:(d.ports||[]).map(r=>({protocol:r.proto,transport:r.tr||'any',ports:r.ports,note:r.note}))};}

/* ---------- encryption: AES-256-GCM, key derived from the passphrase with PBKDF2-SHA256 ---------- */
const ndCryptoOK=()=>!!(window.crypto&&crypto.subtle&&crypto.getRandomValues);
function ndB64(buf){const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
const ndUnB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function ndKey(pass,salt,iter){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function ndEncrypt(obj,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const key=await ndKey(pass,salt,ND_ITER);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));
 return {format:ND_ENC,version:1,kdf:'PBKDF2-SHA256',iterations:ND_ITER,cipher:'AES-256-GCM',salt:ndB64(salt),iv:ndB64(iv),data:ndB64(ct)};}
async function ndDecrypt(w,pass){if(w.cipher!=='AES-256-GCM'||w.kdf!=='PBKDF2-SHA256')throw new Error('Unsupported encryption ('+w.cipher+', '+w.kdf+')');
 const key=await ndKey(pass,ndUnB64(w.salt),+w.iterations||ND_ITER);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ndUnB64(w.iv)},key,ndUnB64(w.data));return JSON.parse(new TextDecoder().decode(pt));}

/* ---------- site filter (view only: panels, badges, search; optional for exports) ---------- */
const ND_LS_SITES='mnn-netdata-sites';
let NDF={sel:null,noSite:true}, NDexpf=false;      /* sel: null = all sites, otherwise a Set of site names */
/* site "*" = the instance belongs to every site: shown whenever at least one site is selected, never listed as a site of its own */
const ndAllSites=I=>I.site==='*';
const ndVis=I=>!NDF.sel||(ndAllSites(I)?NDF.sel.size>0:I.site?NDF.sel.has(I.site):NDF.noSite);
const ndInst=()=>ND?ND.instances.filter(ndVis):[];
function ndSites(){const m=new Map();if(ND)ND.instances.forEach(I=>{if(I.site&&!ndAllSites(I))m.set(I.site,(m.get(I.site)||0)+1);});return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true,sensitivity:'base'}));}
const ndNoSiteN=()=>ND?ND.instances.filter(I=>!I.site).length:0;
const ndAllSiteN=()=>ND?ND.instances.filter(ndAllSites).length:0;
const ndSiteName=x=>x==='*'?'all sites':x;

function ndFilterClean(){if(!NDF.sel)return;const all=ndSites().map(x=>x[0]);NDF.sel=new Set([...NDF.sel].filter(x=>all.includes(x)));if(all.length&&NDF.sel.size===all.length&&NDF.noSite)NDF.sel=null;}

/* ---------- which instances / addresses belong to an interface end ---------- */
function ndSideEps(L,el){if(!ND||!el||el==='bus'||!EM[el])return [];const keys=ndKeys(L);
 const has=I=>I.addresses.some(A=>keys.includes(A.interface));
 for(const grp of [[el],ND_ELALIAS[el]||[],ndRev(el)]){const r=ndInst().filter(I=>grp.includes(I.element)&&has(I));if(r.length)return r.map(I=>({I,ad:I.addresses.filter(A=>keys.includes(A.interface))}));}

/* ---------- search index & map badges ---------- */
function ndIndex(){ELS.forEach(e=>{e._nd='';e._ndn=[];e._ndip=new Set();});LINKS.forEach(l=>{l._nd='';l._ndn=[];l._ndip=new Set();});if(!ND)return;
 const add=(o,txt,ip,net)=>{o._nd+=' '+String(txt).toLowerCase();const k=ip?ndAddrKind(ip):'';if(k==='v4net'||(net&&k==='v4host'))o._ndn.push(ip);if(k){o._ndip.add(ip.toLowerCase());if(k.endsWith('host'))o._ndip.add(ndAddrOnly(ip));}};
 ndInst().forEach(I=>{const E=EM[I.element];if(!E)return;add(E,I.name+' '+I.site+' '+I.note);I.addresses.forEach(A=>add(E,A.ip+' '+A.note+' '+ndPortShow(A.port),A.ip));});

const ndTok=()=>state.q?state.q.split(/\s+/).filter(Boolean):[];
function ndIPin(t,nets){return ND_V4PLAIN.test(t)&&ND_V4.test(t)&&nets.some(n=>ndV4in(t,n));}
/* a complete IPv4 address matches only that address or a subnet containing it (192.0.2.11 does not find 192.0.2.110); anything else is a substring search */
const ndFullV4=t=>ND_V4PLAIN.test(t)&&ND_V4.test(t);
function ndMatch(t,o){if(!o._nd)return false;if(ndFullV4(t))return o._ndip.has(t)||ndIPin(t,o._ndn);return o._nd.includes(t);}
function ndHit(A,I){const tk=ndTok();if(!tk.length)return false;const txt=(I.name+' '+I.site+' '+A.ip+' '+A.note+' '+ndPortShow(A.port)).toLowerCase();
 return tk.some(t=>ndFullV4(t)?(A.ip===t||ndAddrOnly(A.ip)===t||(ndAddrKind(A.ip)==='v4net'&&ndIPin(t,[A.ip]))):txt.includes(t));}
function ndCount(el){return ndInst().filter(I=>I.element===el).length;}
function ndBadges(){Object.values(NODE).forEach(({g,E})=>{let b=g.querySelector('.ndb');const n=ndCount(E.id);
 if(!n){if(b)b.style.display='none';return;}
 if(!b){b=mk('g',{class:'ndb'},g);const x=E.kind==='container'?E.x+40:E.x+E.w-4,y=E.y;mk('rect',{x:x-32,y:y-8,width:36,height:16,rx:8},b);mk('text',{x:x-14,y:y+.5},b);mk('title',{},b);}
 b.style.display='';b.querySelector('text').textContent='IP '+(n>99?'99+':n);b.querySelector('title').textContent=`${n} ${E.n} instance${n>1?'s':''} in “${ND.network}”${ndFiltered()?' ('+ndFilterLabel()+')':''}`;});}

const ND_CAP=40;

 `<div class="paneltools"><button data-nd="add:${E.id}">+ Add ${esc(E.n)} instance</button></div>`;}
function ndLinkHTML(L){if(!ND)return '';const info=ndKeys(L).filter(k=>ND.interfaces[k]).map(k=>({k,...ND.interfaces[k]}));
 const side=(nm,all)=>{const {l:eps,more}=ndCapList(all,x=>x.ad.some(A=>ndHit(A,x.I)),'instances');return `<div class="ndside"><div class="ndside-h">${esc(nm)}</div>${eps.length?eps.map(({I,ad})=>`<div class="ndep"><button class="ndlink" data-sel="el:${I.element}">${esc(ndInstName(I))}</button>${I.site?` <span>${esc(ndSiteName(I.site))}</span>`:''}${ndAddrRows(I,ad,ad.some(A=>A.interface!==ndCanon(L)))}</div>`).join('')+more:'<div class="ndmuted">no addresses</div>'}</div>`;};

 if(L.isbus)sides=side('NFs on the SBI',ndLinkEps(L));
 else if(L.bus)sides=side(EM[L.a].n,ndSideEps(L,L.a));
 else if(L.a===L.b)sides=side(EM[L.a].n+' (both ends)',ndSideEps(L,L.a));

 return ndHead()+info.map(x=>`<div class="kv ndkv">${x.k!==ndCanon(L)?`<div>Interface</div><div>${esc(ndIfLabel(x.k))}</div>`:''}<div>Subnet</div><div>${esc(x.subnet)||'—'}</div><div>VLAN</div><div>${esc(x.vlan)||'—'}</div>${x.note?`<div>Note</div><div>${esc(x.note)}</div>`:''}</div>`).join('')+
  `<div class="ndsides">${sides}</div><div class="paneltools"><button data-nd="ifedit:${ndCanon(L)}">${info.length?'Edit':'Add'} interface info (subnet, VLAN)</button></div>`;}

  const run=async()=>{if(e.disabled)return;e.disabled=true;let r;try{r=b.onClick?await b.onClick(m):true;}finally{e.disabled=false;}if(r!==false)ndCloseModal();};
  e.onclick=run;if(b.cancel||/^(Cancel|Close|Skip)/.test(b.label))m._esc=run;bt.appendChild(e);});
 m.querySelector('.mbody').oninput=()=>{const e=m.querySelector('#nderr');if(e&&!m.dataset.ack)e.textContent='';};

function ndPass(title,confirm,note){return new Promise(res=>{ndModal(title,`${note?`<p class="ndmuted">${note}</p>`:''}<label>Passphrase<input type="password" id="ndp1" autocomplete="${confirm?'new-password':'current-password'}"></label>${confirm?'<label>Repeat passphrase<input type="password" id="ndp2" autocomplete="new-password"></label>':''}<div class="nderr" id="nderr"></div>`,
 [{label:'Cancel',onClick:()=>{res(null);}},{label:confirm?'Encrypt':'Unlock',primary:true,onClick:m=>{const a=m.querySelector('#ndp1').value,b=confirm?m.querySelector('#ndp2').value:a;const er=m.querySelector('#nderr');
  if(!a){er.textContent='Enter a passphrase.';return false;}if(confirm&&a.length<10){er.textContent='Use at least 10 characters – a short sentence works well.';return false;}
  if(a!==b){er.textContent='The passphrases do not match.';return false;}res(a);}}]);});}
function ndAsk(title,html,choices){return new Promise(res=>ndModal(title,html,choices.map(c=>({...c,onClick:()=>{res(c.v);}}))));}
function ndWarnHTML(w){return w&&w.length?`<ul class="ndwarn">${w.slice(0,300).map(x=>`<li>${esc(x)}</li>`).join('')}${w.length>300?`<li>… and ${w.length-300} more</li>`:''}</ul>`:'<p class="ndmuted">No warnings.</p>';}

/* ---------- apply / load ---------- */
function ndRefresh(){if(TR_ON)trPortsCheck();if(TR_ON&&TR)trResolve();ndFilterClean();ndIndex();ndBadges();ndPersist();ndStatus();apply();renderPanel();}
function ndSet(d,src,warn,dirty){ND=d;NDsrc=src||NDsrc;NDwarn=warn||[];NDdirty=!!dirty;ndRefresh();}
function ndTouch(){NDdirty=true;NDwarn=ndValidate(ND);ndRefresh();}
async function ndUnlock(j,label,note){if(!ndCryptoOK()){await ndAsk('Cannot decrypt','<p>This browser does not offer Web Crypto here. Open the file in a current Chrome, Edge, Firefox or Safari.</p>',[{label:'Close',primary:true}]);return null;}
 for(let tries=0;;tries++){const p=await ndPass(label,false,(tries?'<b>Wrong passphrase – try again.</b> ':'')+note);if(p==null)return null;
  try{return await ndDecrypt(j,p);}catch(e){if(/Unsupported/.test(e.message)){toast(e.message);return null;}}}}
async function ndLoadText(text,fname){let parsed;fname=fname||'the file';
 try{const t=text.replace(/^﻿/,'').trim();
  if(t.startsWith('{')){let j=JSON.parse(t),enc=false;
   if(j.format===ND_ENC){j=await ndUnlock(j,'Unlock '+fname,'This file is encrypted. Enter its passphrase.');if(!j)return;enc=true;}
   if(TR_ON&&j.format===TR_RES_FMT){j=await trResultsLoad(j,fname);if(!j)return;}   /* saved trace results: decisions, and network data if included */
   parsed=ndClean(j);parsed.enc=enc;}
  else if(/^<(!doctype|html)/i.test(t)){const m=t.match(/<script[^>]*id="mnn-netdata"[^>]*>([\s\S]*?)<\/script>/i);if(!m)throw new Error('This HTML file contains no network data.');return ndLoadText(m[1],fname);}
  else parsed=ndParseCSV(text);}
 catch(e){await ndAsk('Could not read '+fname,`<p>${esc(e.message)}</p><p class="ndmuted">Expected a CSV file (header: element, instance, site, interface, ip, port, vlan, note), a JSON export, an encrypted JSON export or an HTML file saved with data.</p>`,[{label:'Close',primary:true}]);return;}
 if(!parsed.d.instances.length&&!Object.keys(parsed.d.interfaces).length&&!(parsed.d.ports||[]).length){await ndAsk('Nothing to load',`<p>No usable rows in ${esc(fname)}.</p>${ndWarnHTML(parsed.w)}`,[{label:'Close',primary:true}]);return;}
 let mode='replace';
 if(ND){mode=await ndAsk('Network data already loaded',`<p>“${esc(ND.network)}” is loaded${NDdirty?' and has <b>unsaved changes</b>':''}. Replace it with ${esc(fname)}, or merge the new data into it (instances with the same element and name are combined)?</p>`,[{label:'Cancel',v:null},{label:'Merge',v:'merge'},{label:'Replace',v:'replace',primary:true}]);if(!mode)return;}
 const merge=mode==='merge';if(!merge)ndFilterReset();const d=merge?ndMerge(ND,parsed.d):parsed.d;const w=merge?ndValidate(d):parsed.w;
 ndSet(d,{kind:'file',enc:!!parsed.enc||(merge&&NDsrc.enc)},w,merge);
 toast(`Loaded “${d.network}”: ${d.instances.length} instance${d.instances.length===1?'':'s'}${w.length?' · '+w.length+' warning'+(w.length>1?'s':''):''}`);if(w.length)ndShowWarnings();}
function ndPickFile(){const i=document.createElement('input');i.type='file';i.accept='.csv,.tsv,.txt,.json,.html,.htm,text/csv,application/json';i.style.display='none';document.body.appendChild(i);
 i.onchange=()=>{const f=i.files[0];i.remove();if(f)f.text().then(t=>ndLoadText(t,f.name));};i.click();}

function ndSlug(s){return String(s||'network').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'network';}
function ndDownload(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);}
function ndHTMLwith(payload,enc){const doc=PRISTINE_DOC.cloneNode(true);doc.querySelectorAll('#mnn-netdata').forEach(x=>x.remove());
 const s=document.createElement('script');s.type='application/json';s.id='mnn-netdata';if(enc)s.setAttribute('data-encrypted','1');
 s.textContent=JSON.stringify(payload).replace(/</g,'\\u003c');doc.querySelector('head').appendChild(s);return '<!DOCTYPE html>\n'+doc.outerHTML+'\n';}
async function ndSave(kind){if(!ND){toast('No network data loaded.');return;}
 const part=NDexpf&&ndFiltered(),D=part?{...ND,instances:ndInst()}:ND;
 const base=ndSlug(ND.network)+(part?'-'+ndSlug(NDF.sel.size===1?[...NDF.sel][0]:NDF.sel.size+'-sites'):'');const json=ndToJSON(D);
 if(kind==='csv')ndDownload(base+'.netdata.csv','\uFEFF'+ndToCSV(D),'text/csv;charset=utf-8');
 else if(kind==='json')ndDownload(base+'.netdata.json',JSON.stringify(json,null,1),'application/json');
 else if(kind==='html')ndDownload('mobile-network-navigator-'+base+'-with-data.html',ndHTMLwith(json,false),'text/html;charset=utf-8');
 else{if(!ndCryptoOK()){toast('Encryption needs Web Crypto, available in current browsers.');return;}
  const p=await ndPass('Encrypt with a passphrase',true,'Anyone with the file <b>and</b> the passphrase can read the data. A lost passphrase cannot be recovered. Share the passphrase over a different channel than the file.');if(p==null)return;
  const w=await ndEncrypt(json,p);
  if(kind==='json-enc')ndDownload(base+'.netdata.enc.json',JSON.stringify(w),'application/json');
  else ndDownload('mobile-network-navigator-'+base+'-with-data.html',ndHTMLwith(w,true),'text/html;charset=utf-8');}
 if(!part)NDdirty=false;ndStatus();renderPanel();toast(part?`Saved ${D.instances.length} of ${ND.instances.length} instances (site filter) – check your downloads folder`:'Saved – check your downloads folder');}

/* ---------- start-up: data embedded in a saved HTML file, else data remembered in this browser ---------- */
async function ndInit(){const emb=document.getElementById('mnn-netdata');
 if(emb){try{let j=JSON.parse(emb.textContent),enc=false;
   if(j.format===ND_ENC){j=await ndUnlock(j,'Unlock network data','This copy of the tool contains encrypted network data. Enter the passphrase, or cancel to use the tool without it.');if(!j)return;enc=true;}
   const r=ndClean(j);ndSet(r.d,{kind:'embedded',enc},r.w,false);toast(`Network data “${r.d.network}” loaded from this file`);}
  catch(e){toast('The network data in this file could not be read.');}return;}
 if(ndRemember()){try{const t=localStorage.getItem(ND_LS);if(t){const r=ndClean(JSON.parse(t));try{const f=JSON.parse(localStorage.getItem(ND_LS_SITES)||'null');if(f)NDF={sel:f.sel?new Set(f.sel):null,noSite:f.noSite!==false};}catch(e){}ndSet(r.d,{kind:'browser',enc:false},r.w,false);toast(`Network data “${r.d.network}” restored from this browser`);}}catch(e){}}}

/* ---------- release history ---------- */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function relDate(v){const m=String(v).match(/^(\d{4})\.(\d{2})\.(\d{2})(?:\.(\d+))?$/);if(!m)return '';return (+m[3])+' '+MON[+m[2]-1]+' '+m[1]+(m[4]?' · release '+m[4]+' of the day':'');}
function relFmt(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');}
function showReleases(){const first=RELEASES[RELEASES.length-1];const inst=pwaCanInstall();
 ndModal('Release history',`<p class="relintro">You are using version <code>${esc(VERSION)}</code>. Version numbers are dates (<code>YYYY.MM.DD</code>, with <code>.N</code> for further releases on the same day). ${RELEASES.length} releases since ${esc(relDate(first.v))}.</p>`+
  RELEASES.map(r=>`<section class="rel"><h4><code>${esc(r.v)}</code><span>${esc(relDate(r.v))}</span>${r.v===VERSION?'<em>current</em>':''}</h4><ul>${r.items.map(i=>`<li>${relFmt(i)}</li>`).join('')}</ul></section>`).join(''),
  (inst?[{label:'Install as an app',onClick:()=>{pwaInstall();}},{label:'Close',primary:true}]:[{label:'Close',primary:true}]));
 try{localStorage.setItem('mnn-seen-version',VERSION);}catch(e){}$('#ver').classList.remove('new');$('#ver').title='Release history';}
$('#ver').addEventListener('click',ev=>{ev.stopPropagation();showReleases();});
/* ---------- installable app ----------
   Served over HTTPS (GitHub Pages) or from localhost, with manifest.webmanifest, sw.js and icons/ next to index.html, the page can be
   installed as an app and works offline. Opened from disk it stays one offline file and none of this runs; a copy saved with
   network data never links the manifest or registers the worker. The links are added here, after PRISTINE_DOC was taken. */
let pwaPrompt=null;
const pwaWeb=()=>location.protocol==='https:'||(location.protocol==='http:'&&/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname));
const pwaCanInstall=()=>!!pwaPrompt;
function pwaInstall(){const p=pwaPrompt;if(!p)return;pwaPrompt=null;p.prompt();}
function pwaInit(){if(!pwaWeb()||document.getElementById('mnn-netdata'))return;
 const add=(rel,href)=>{const l=document.createElement('link');l.rel=rel;l.href=href;document.head.appendChild(l);};
 add('manifest','manifest.webmanifest');add('apple-touch-icon','icons/apple-touch-icon.png');
 addEventListener('beforeinstallprompt',e=>{e.preventDefault();pwaPrompt=e;$('#ver').title='Release history · install as an app';});
 addEventListener('appinstalled',()=>{pwaPrompt=null;toast('Installed – Mobile Network Navigator is now an app on this device');});
 if('serviceWorker' in navigator){navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='mnn-update')pwaUpdated();});
  navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(r=>{if(r.active)r.active.postMessage({type:'mnn-hello',version:VERSION});}).catch(()=>{});}}
/* a new version was downloaded in the background: offer a reload, never force it (unsaved network data, an open trace) */
function pwaUpdated(){if($('#pwaupd'))return;const d=document.createElement('div');d.id='pwaupd';d.setAttribute('role','status');
 d.innerHTML='A new version of the app was downloaded. <button data-pw="reload">Reload</button><button data-pw="later">Later</button>';
 d.addEventListener('click',e=>{const b=e.target.closest('[data-pw]');if(!b)return;if(b.dataset.pw==='reload')location.reload();else d.remove();});document.body.appendChild(d);}
try{const seen=localStorage.getItem('mnn-seen-version');if(!seen)localStorage.setItem('mnn-seen-version',VERSION);else if(seen!==VERSION){$('#ver').classList.add('new');$('#ver').title='New version – click to see what changed';}}catch(e){}

/* Built from what the analysis saw: the address pairs of the flows, the protocol (its Wireshark dissector at the standard port, the port
   numbers where your protocol ports were used), the VLAN and the capture interface. Plain IP has no protocol of its own: its filter is
   “everything else” and approximate. Sub-expressions are always bracketed, so the filters read the same in every Wireshark version. */
const TR_WS_SCTP=new Set(['s1ap','ngap','x2ap','xnap','f1ap','e1ap','sgsap','nbap','m3ua','rua','hnbap','sctp']),TR_WS_MAXPAIRS=1500;
const trWsAddr=ip=>(ip.includes(':')?'ipv6.addr==':'ip.addr==')+ip;
function trWsW(e){if(!e.includes(' '))return e;const s=e[0]==='!'?1:0;if(e[s]==='('){let d=0;for(let i=s;i<e.length;i++){if(e[i]==='(')d++;else if(e[i]===')'&&--d===0)return i===e.length-1?e:'('+e+')';}}return '('+e+')';}
const trWsAnd=a=>{a=a.filter(Boolean);return a.length===1?a[0]:a.map(trWsW).join(' && ');};
const trWsOr=a=>{a=a.filter(Boolean);return a.length===1?a[0]:a.map(trWsW).join(' || ');};
/* VLAN tags: Wireshark shows an 802.1Q tag as vlan.id and an 802.1ad (QinQ outer, 0x88a8) tag as ieee8021ad.id */
const trWsVlan=v=>v?trWsAnd(String(v).split('.').map(t=>'vlan.id=='+t+' || ieee8021ad.id=='+t)):'!(vlan || ieee8021ad)';
/* a capture interface: frame.interface_id within its file; nothing when the file has only this one interface */
function trWsIf(i){const F=TR.file,I=F.ifs[i];if(!I)return {e:''};const n=F.ifs.filter(x=>x.fx===I.fx).length;return {e:n>1?'frame.interface_id=='+(I.lid||0):'',file:F.files.length>1?I.file:''};}
/* the protocol part of a flow: {e, port: matched by port number (non-standard ports)} */
/* solo: the flow is the only Diameter flow of its address pair – then the whole TCP connection / SCTP association is its own, as counted */
function trWsProto(f,solo){const C=f.cls;if(TR_WS_SCTP.has(C))return {e:'sctp'};if(C==='esp')return {e:'esp'};
 const ci=TR_PC.indexOf(C==='gtpc1'||C==='gtpc2'?'gtpc':C),std=p=>C==='dia'?p===3868:C==='diatls'?p===5868:C==='gtpp'?p===3386:trUdpStd(p)===ci;
 const ps=[...new Set([].concat(...trSvPorts(f).values()))].sort((a,b)=>a-b);
 if(C==='dia'&&solo&&(f.x.tcp||f.x.sctp))return {e:trWsOr([f.x.tcp?trWsOr((ps.length?ps:[3868]).map(p=>'tcp.port=='+p)):'',f.x.sctp?'sctp':'']),port:ps.some(p=>!std(p))};
 if(ps.some(p=>!std(p))){const tr=C==='dia'||C==='diatls'?['tcp','sctp']:C==='gtpp'?['udp','tcp']:['udp'];return {e:trWsOr(ps.flatMap(p=>tr.map(t=>t+'.port=='+p))),port:true};}
 switch(C){case 'gtpu':return {e:'udp.port==2152'};case 'gtpc1':return {e:'gtp && udp.port==2123'};case 'gtpc2':return {e:'gtpv2'};case 'pfcp':return {e:'pfcp'};
  case 'radius':return {e:ps.length?trWsOr(ps.map(p=>'udp.port=='+p)):'radius'};case 'ike':return {e:'udp.port==500 || udp.port==4500'};
  case 'gtpp':return {e:'udp.port==3386 || tcp.port==3386'};case 'diatls':return {e:'tcp.port==5868 || sctp.port==5868'};
  case 'dia':return {e:f.app===0?'diameter.applicationId==0':'diameter.applicationId=='+f.app+' || diameter.applicationId==0',msgs:true};}
 return {e:''};}
/* address pairs, compacted around the address shared by most pairs: ip.addr==X && (ip.addr==a || ip.addr==b) */
function trWsPairs(P){const left=P.slice(),parts=[];
 while(left.length){const c=new Map();left.forEach(([a,b])=>{c.set(a,(c.get(a)||0)+1);c.set(b,(c.get(b)||0)+1);});let best=null,bn=0;c.forEach((n,k)=>{if(n>bn){bn=n;best=k;}});
  const mine=left.filter(([a,b])=>a===best||b===best);
  parts.push(mine.length===1?trWsAnd([trWsAddr(mine[0][0]),trWsAddr(mine[0][1])]):trWsAnd([trWsAddr(best),trWsOr(mine.map(([a,b])=>trWsAddr(a===best?b:a)))]));
  const m=new Set(mine);for(let i=left.length-1;i>=0;i--)if(m.has(left[i]))left.splice(i,1);}
 return trWsOr(parts);}
/* plain IP: IP that is none of the protocols the analysis recognises (by the same ports and IP protocols) */
function trWsPlain(){const x=['udp.port==2152','udp.port==2123','udp.port==8805',...Object.keys(TR_RADPORT).map(p=>'udp.port=='+p),'udp.port==500','udp.port==4500','udp.port==3386','tcp.port==3868','tcp.port==5868','tcp.port==3386','sctp','esp'];
 Object.keys(TR_INFRA_UDP).forEach(p=>x.push('udp.port=='+p));Object.keys(TR_INFRA_TCP).forEach(p=>x.push('tcp.port=='+p));Object.keys(TR_INFRA_IP).forEach(p=>x.push('ip.proto=='+p,'ipv6.nxt=='+p));
 ((TR.pm&&TR.pm.rules)||[]).forEach(r=>r.trs.filter(t=>t!=='sctp').forEach(t=>r.ranges.forEach(([lo,hi])=>x.push(lo===hi?t+'.port=='+lo:trWsOr([trWsAnd([t+'.srcport>='+lo,t+'.srcport<='+hi]),trWsAnd([t+'.dstport>='+lo,t+'.dstport<='+hi])])))));
 return trWsAnd(['ip || ipv6','!('+[...new Set(x)].map(trWsW).join(' || ')+')']);}
/* flows and plain-IP groups → one filter and the notes that go with it */
function trWsMix(fl,pg,vlan){const notes=new Set(),parts=[];
 if(fl.length){const by=new Map(),dn=new Map();TR.flows.forEach(f=>{if(f.cls==='dia'){const k=f.A+' '+f.B;dn.set(k,(dn.get(k)||0)+1);}});
  fl.forEach(f=>{const p=trWsProto(f,dn.get(f.A+' '+f.B)===1);if(p.port)notes.add('non-standard ports are matched by number');
   if(p.msgs)notes.add('Diameter: messages only (several applications share the addresses), not the TCP / SCTP packets between them');
   /* fragments: Wireshark reassembles them, so only the last one shows the protocol – the fragments of the pair are added */
   let e=p.e;if(f.x.frag){e=trWsOr([e,f.A.includes(':')?'ipv6.fraghdr.more==1 || ipv6.fraghdr.offset>0':'ip.flags.mf==1 || ip.frag_offset>0']);notes.add('with the IP fragments between the addresses');}
   let a=by.get(e);if(!a)by.set(e,a=new Map());a.set(f.A+' '+f.B,[f.A,f.B]);});
  const n=[...by.values()].reduce((a,m)=>a+m.size,0),cut=n>TR_WS_MAXPAIRS;if(cut)notes.add(trNum(n)+' address pairs – too many for a filter, so the protocol only');
  parts.push(trWsOr([...by].map(([e,m])=>trWsAnd([e,cut?'':trWsPairs([...m.values()])]))));}
 if(pg.length){notes.add('plain IP is approximate: all IP except the recognised protocols');const fs=new Set();
  parts.push(trWsAnd([trWsOr(pg.map(g=>{const w=trWsIf(g.ifi);if(w.file)fs.add(w.file);return trWsAnd([trWsVlan(g.vlan),w.e]);})),trWsPlain()]));
  if(fs.size)notes.add('in the file'+(fs.size>1?'s ':' ')+[...fs].join(', '));}
 const e=trWsAnd([vlan!=null?trWsVlan(vlan):'',trWsOr(parts)]);return e?{f:e,notes:[...notes]}:null;}
function trWsFor(k){if(!TR)return null;const i=k.indexOf(':'),kind=k.slice(0,i),id=k.slice(i+1);
 const live=f=>f.res&&!f.res.none&&f.res.conf!=='off';
 if(kind==='el')return {f:trWsAddr(id),notes:[]};
 if(kind==='port'){const w=trWsIf(+id);return w.e?{f:w.e,notes:w.file?['in the file '+w.file]:[]}:null;}
 if(kind==='if')return trWsMix(TR.flows.filter(f=>live(f)&&f.res.links.includes(id)),TR.plain.filter(g=>g.res&&!g.res.none&&g.res.links.includes(id)));
 if(kind==='grp'){const G=TR.groups.find(g=>g.gk===id);if(!G)return null;const fl=TR.flows.filter(f=>f.res&&f.res.gk===id&&f.res.conf!=='sure'&&f.res.conf!=='off');return trWsMix(fl,TR.plain.filter(g=>g.res&&g.res.gk===id),fl.length?G.vlan:null);}
 if(kind==='oth')return trWsMix(TR.flows.filter(f=>f.res&&f.res.conf==='off'&&trClsN(f)===id),[]);
 return null;}
const trWsB=k=>`<button class="trws" data-ws="${esc(k)}" title="Copy a Wireshark display filter for these packets">⧉ filter</button>`;
function trCopy(t,msg,title){const done=()=>toast(msg);
 const fb=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();
  if(ok)done();else ndModal(title||'Copy','<textarea class="mfcopy" readonly>'+esc(t)+'</textarea>',[{label:'Close',primary:true}],m=>{const x=m.querySelector('textarea');x.focus();x.select();});};
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,fb);else fb();}
function trWsCopy(k){const w=trWsFor(k);if(!w){toast('No filter for this row');return;}const f=trWsW(w.f);TR.wsLast=f;   /* in brackets: safe to combine with && / || */
 trCopy(f,'Wireshark filter copied – paste it in place of the current filter'+(w.notes.length?' – '+w.notes.join(' · '):''),'Wireshark display filter');}

/* ---------- saving the results (and your decisions) ---------- */
/* Saved on request only: counts, element addresses and names, directions and your decisions – never packets, UE addresses or subscriber identities.
   The JSON can carry your network data too (one file with everything); loaded again, it applies the decisions to the same capture. */
const TR_RES_FMT='mobile-network-navigator/trace-results';
function trResultsData(withND){const F=TR.file,iso=t=>isFinite(t)?new Date(t*1000).toISOString():null,ob=o=>Object.fromEntries(Object.entries(o||{}).sort((a,b)=>b[1]-a[1]));
 const D={format:TR_RES_FMT,version:1,app:VERSION,saved:new Date().toISOString(),
  about:'Trace analysis results of Mobile Network Navigator: counts, directions, element addresses and names, and your decisions. No packets, UE addresses or subscriber identities.',
  capture:{name:F.name,size:F.size,format:F.fmt,gzip:F.gz,truncated:F.cut,packets:F.pk,bytes:F.by,start:iso(F.t0),end:iso(F.t1),linkTypes:F.lts.map(l=>TR_LT[l]||'link type '+l),
   files:F.files.map(x=>({name:x.name,size:x.size,format:x.fmt||null,packets:x.err?null:x.pk,error:x.err||null}))},
  protocolPorts:TR.pm&&TR.pm.rules.length?ndPortsText(TR.pm.rules):'',
  interfaces:TR.rows.map(r=>({interface:r.canon,name:trLbl(r.canon),packets:r.pk,bytes:r.by,uplinkPackets:r.ul||0,downlinkPackets:r.dl||0,directionFromTcpSetup:r.dtcp||0,
   confidence:Object.fromEntries(Object.entries(r.conf).map(([k,v])=>[k||'none',v])),protocols:ob(r.cls),evidence:Object.keys(ob(r.why)),
   ends:[...r.ends].map(([ip,el])=>({address:ip,element:el||null,elementName:el&&EM[el]?EM[el].n:null}))})),
  captureInterfaces:(TR.ports||[]).filter(p=>p.pk).map(p=>({name:p.name,file:(F.ifs[p.i]||{}).file||'',packets:p.pk,bytes:p.by,direction:p.v||null,uplinkPackets:p.ul,downlinkPackets:p.dl,unknownDirectionPackets:p.unk,directionFromTcpSetup:p.tcp,
   signalling:p.cv||null,interfaces:[...p.links.values()].sort((a,b)=>b.pk-a.pk).map(e=>({interface:e.k[0]==='?'?null:e.k,traffic:e.k[0]==='?'?e.k.slice(1)+' (undecided)':trShortN(e.k),packets:e.pk,
    ...(e.up?{uplinkPackets:e.ul,downlinkPackets:e.dl,unknownDirectionPackets:e.unk}:{senders:ob(e.pair)})}))})),
  decisions:TR.groups.map(G=>{const m=TR.manual[G.gk];return {group:G.gk,traffic:G.lbl,vlan:G.vlan||'',captureInterface:trPortName(G.ifi),packets:G.pk,automatic:trTop(G.cur)||null,choice:m!=null?m:null,reason:trTop(G.why)||''};}),
  elements:[...TR.ends.values()].sort((a,b)=>b.pk-a.pk).map(e=>{const el=trTop(e.els);return {address:e.ip,element:el||null,elementName:el&&EM[el]?EM[el].n:null,rule:el?e.src[el]||null:null,
   names:[...(TR.names.get(e.ip)||new Map()).keys()],networkData:trNdHits(TR.nd,e.ip).map(h=>ndInstName(h.I)),interfaces:[...e.links],packets:e.pk};}),
  notMapped:trNotMapped().map(([l,p,b,w])=>({traffic:l,packets:p,bytes:b,reason:w})),
  protocolDetails:trDetailsData().map(e=>{const o={traffic:e.k,packets:e.pk,bytes:e.by,flows:e.n,messages:ob(e.m)};
   [['rej','rejectedResponses'],['err','errorAnswers'],['g','gPdu'],['h85','pduSessionContainer'],['h84','nrRanContainer']].forEach(([k,n])=>{if(e[k])o[n]=e[k];});
   [['ft','fteidTypes'],['ty','interfaceTypes3gpp'],['ipcan','ipCanType'],['rat','ratType'],['rat3','ratType3gpp'],['scx','serviceContextId']].forEach(([k,n])=>{if(Object.keys(e[k]).length)o[n]=ob(e[k]);});return o;})};
 /* addresses of plain IP (UEs and servers) are deliberately not included */
 if(withND&&ND)D.networkData=ndToJSON(ND);
 return D;}
/* CSV: one file, a block per part (“# Interfaces” …) – opens in any spreadsheet */
function trResultsCSV(D){const q=v=>{if(v==null)return '';if(typeof v==='number')return String(v);v=String(v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return /[",;\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
 const kv=o=>Object.entries(o||{}).map(([k,v])=>k+' '+v).join('; '),out=[],tbl=(t,h,rows)=>{out.push('# '+t);out.push(h.map(q).join(','));rows.forEach(r=>out.push(r.map(q).join(',')));out.push('');};
 const C=D.capture;out.push(q('# Mobile Network Navigator '+D.app+' – trace analysis results · saved '+D.saved));out.push('');
 tbl('Capture',['name','size','format','packets','bytes','start','end','link types','protocol ports'],[[C.name,C.size,C.format+(C.gzip?' · gzip':''),C.packets,C.bytes,C.start,C.end,C.linkTypes.join('; '),D.protocolPorts]]);
 if(C.files.length>1)tbl('Files',['file','size','format','packets','error'],C.files.map(x=>[x.name,x.size,x.format,x.packets,x.error]));
 tbl('Interfaces',['interface','name','packets','bytes','uplink packets','downlink packets','confidence','protocols','evidence','ends'],D.interfaces.map(r=>[r.interface,r.name,r.packets,r.bytes,r.uplinkPackets,r.downlinkPackets,kv(r.confidence),kv(r.protocols),r.evidence.join(' | '),r.ends.map(e=>e.address+(e.elementName?' = '+e.elementName:'')).join('; ')]));
 tbl('Capture interfaces',['capture interface','packets','bytes','direction','uplink packets','downlink packets','unknown direction','from TCP set-up','interfaces'],D.captureInterfaces.map(p=>[p.name,p.packets,p.bytes,p.direction,p.uplinkPackets,p.downlinkPackets,p.unknownDirectionPackets,p.directionFromTcpSetup,p.interfaces.map(e=>e.traffic+' '+e.packets).join('; ')]));
 tbl('Decisions',['group','traffic','vlan','capture interface','packets','automatic','your choice','reason'],D.decisions.map(d=>[d.group,d.traffic,d.vlan,d.captureInterface,d.packets,d.automatic,d.choice==='none'?'not a mobile-network interface':d.choice,d.reason]));
 tbl('Elements',['address','element','rule','names','network data','interfaces','packets'],D.elements.map(e=>[e.address,e.elementName,e.rule,e.names.join('; '),e.networkData.join('; '),e.interfaces.join('; '),e.packets]));
 tbl('Not mapped',['traffic','packets','bytes','reason'],D.notMapped.map(x=>[x.traffic,x.packets,x.bytes,x.reason]));
 tbl('Protocol details',['traffic','packets','bytes','flows','messages'],D.protocolDetails.map(x=>[x.traffic,x.packets,x.bytes,x.flows,kv(x.messages)]));
 return out.join('\r\n');}
function trResultsBase(){return ndSlug(TR.file.name.replace(/\.(pcapng|pcap|cap|ntar)(\.gz)?$/i,'').replace(/\.gz$/i,''))+'.trace-results';}
async function trSaveResults(kind,withND){if(!TR)return false;const base=trResultsBase();
 if(kind==='csv'){ndDownload(base+'.csv','﻿'+trResultsCSV(trResultsData(false)),'text/csv;charset=utf-8');}
 else if(kind==='json')ndDownload(base+'.json',JSON.stringify(trResultsData(withND),null,1),'application/json');
 else{if(!ndCryptoOK()){toast('Encryption needs Web Crypto, available in current browsers.');return false;}
  const p=await ndPass('Encrypt with a passphrase',true,'Anyone with the file <b>and</b> the passphrase can read it. A lost passphrase cannot be recovered.');if(p==null)return false;
  ndDownload(base+'.enc.json',JSON.stringify(await ndEncrypt(trResultsData(withND),p)),'application/json');}
 toast('Saved – check your downloads folder');return true;}
function trSaveDialog(){if(!TR)return;const has=!!ND,cr=ndCryptoOK(),nd=TR.groups.filter(G=>TR.manual[G.gk]!=null).length;
 const opt=(v,t,d,ch,dis)=>`<label class="trsvo"><input type="radio" name="trsvk" value="${v}"${ch?' checked':''}${dis?' disabled':''}><span><b>${t}</b><small>${d}</small></span></label>`;
 ndModal('Save the trace results',`<p>Saves what the analysis found – interfaces, capture interfaces and directions, ${nd?`<b>your ${nd} decision${nd>1?'s':''}</b>`:'the decisions'}, elements with their addresses and names, what was not mapped, protocol details. <b>No packets</b>, no UE addresses and no subscriber identities; the capture itself is never saved.</p>
  <div class="trsv">${opt('json','JSON','Everything, readable by programs; load it again to re-apply your decisions to the same capture',true)}${opt('csv','CSV','The tables for a spreadsheet (decisions cannot be re-applied from it)')}${opt('enc','Encrypted JSON','AES-256-GCM with a passphrase – like your encrypted network data'+(cr?'':' (needs Web Crypto)'),false,!cr)}</div>
  ${has?`<label class="trsvo trsvc"><input type="checkbox" id="trsvnd" checked><span><b>Include your network data</b><small>“${esc(ND.network)}” with its protocol ports – one file with all your data (JSON only)</small></span></label>`:''}
  <p class="ndmuted">The file holds the addresses of your network elements – keep it like your network data. To re-apply your decisions: open the same capture, then <i>Check and decide → Apply decisions from a file…</i>, or drop the file on the page.</p>`,
  [{label:'Cancel'},{label:'Save',primary:true,onClick:async m=>{const k=m.querySelector('input[name=trsvk]:checked').value,w=m.querySelector('#trsvnd');return await trSaveResults(k,k!=='csv'&&!!(w&&w.checked));}}],
  m=>{const up=()=>{const w=m.querySelector('#trsvnd');if(w)w.disabled=m.querySelector('input[name=trsvk]:checked').value==='csv';};m.querySelectorAll('input[name=trsvk]').forEach(r=>r.addEventListener('change',up));});}
/* saved results loaded again: their decisions go to the open trace (same groups: protocol, VLAN, capture interface); returns the network data in the file, if any */
async function trResultsLoad(j,fname,decOnly){const dec=(Array.isArray(j.decisions)?j.decisions:[]).filter(d=>d&&typeof d.group==='string'&&d.choice!=null&&(d.choice==='none'||LM[d.choice]));
 let ok=0,miss=0,msg='';
 if(TR&&dec.length){dec.forEach(d=>{if(TR.groups.some(G=>G.gk===d.group)){TR.manual[d.group]=d.choice;ok++;}else miss++;});if(ok){trResolve();apply();if(state.trMode)trRender();}}
 const other=TR&&j.capture&&j.capture.name&&j.capture.name!==TR.file.name;
 if(!dec.length)msg='<p>The file contains no decisions.</p>';
 else if(!TR)msg=`<p>The file holds ${dec.length} decision${dec.length>1?'s':''}. Open the capture first, then load the file again to apply them.</p>`;
 else msg=`<p><b>${ok} of ${dec.length} decision${dec.length>1?'s':''}</b> applied to the open trace.${miss?` ${miss} did not match a group of this capture (protocol, VLAN and capture interface).`:''}</p>${other?`<p class="ndmuted">Saved from <b>${esc(j.capture.name)}</b>; the open capture is <b>${esc(TR.file.name)}</b>.</p>`:''}`;
 const nd=!decOnly&&j.networkData&&typeof j.networkData==='object'?j.networkData:null;
 if(nd)msg+='<p>The file also contains network data – it is loaded next.</p>';
 await ndAsk('Trace results – '+(fname||'file'),msg,[{label:'OK',primary:true}]);
 return nd;}
function trDecPick(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.style.display='none';document.body.appendChild(i);
 i.addEventListener('change',async()=>{const f=i.files&&i.files[0];i.remove();if(!f)return;
  try{let j=JSON.parse((await f.text()).replace(/^﻿/,''));if(j.format===ND_ENC){j=await ndUnlock(j,'Unlock '+f.name,'This file is encrypted. Enter its passphrase.');if(!j)return;}
   if(j.format!==TR_RES_FMT)throw new Error('This is not a saved trace-results file.');await trResultsLoad(j,f.name,true);}
  catch(e){ndAsk('Could not read '+f.name,`<p>${esc(e.message)}</p>`,[{label:'Close',primary:true}]);}});i.click();}

/* ---------- direction per capture interface ---------- */
function trDirTxt(ul,dl){const t=ul+dl;if(!t)return '';const u=Math.round(ul/t*100);return `↑ ${u} % · ↓ ${100-u} %`;}
const TR_TCPDIR='Direction from TCP connection set-up – on SGi / Gi / N6 in the plain IP, in GTP-U tunnels without signalling inside the tunnel: the side that opens the connections (sends the SYN, receives the SYN-ACK) is taken as the UE side. Correct for usual internet traffic; inverted where servers open connections to the UEs (M2M polling, UE-hosted services).';
function trPortsHTML(){const P=(TR.ports||[]).filter(p=>p.pk);if(!P.length)return '';
 const V={up:['↑ Uplink','c-up'],down:['↓ Downlink','c-down'],both:['⇅ Both directions','c-both']};
 const body=P.map(p=>{const v=p.v?V[p.v]:null,cv=p.cv?(p.cv==='one'?'signalling: one direction':'signalling: both directions'):'';
  const ls=[...p.links.values()].sort((a,b)=>b.pk-a.pk).map(e=>{const nm=e.k[0]==='?'?e.k.slice(1)+' (undecided)':trShortN(e.k);

${hpT(['View','What it shows'],[['<b>Architecture</b>','Zoomable diagram of all elements and interfaces, grouped into UE, RAN (UTRAN, E-UTRAN with EN-DC, NG-RAN), core (UMTS CS / PS, EPC with ePDG and 3GPP AAA for Wi-Fi access, 5GC) and external networks.'],

 add('panel','Using the navigator','Details panel and message flows',`

 add('procs','Using the navigator','End-to-end procedures',`
<p><b>▶ Procedures</b> in the toolbar (or on the overview page) lists ${PROC.length} multi-node call flows grouped by generation – attach, registration, PDU sessions, service requests, paging, handovers, VoLTE bearers, CS calls, CSFB, SRVCC, Wi-Fi calling. Hovering one previews its nodes on the map.</p>

<li><b>NAS:</b> a NAS message riding inside an RRC, S1AP, NGAP or RANAP message that also does something else is named on its carrier on each hop (<code>INITIAL UE MESSAGE</code> with <b>NAS: Attach Request</b>); NAS that is only relayed is drawn as one arrow between UE and MME / AMF / SGSN / MSC.</li>
