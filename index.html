 <p class="trpriv"><b>Private by design:</b> the file is read in this browser only. Nothing is uploaded, stored, put in the link or included in “Save with data”; closing the trace or the page discards it.</p>
 <h3>What it recognises</h3><ul class="trul">
 <li><b>GTP-U</b> – S1-U, S5/S8-U, N3, N9, Gn, direct tunnel… told apart by the F-TEIDs that GTPv2-C, GTPv1-C and PFCP signal in the same capture</li>
 <li><b>GTPv2-C</b> – S11, S5/S8, S4, S10, S3, S2b, N26 from the F-TEID interface types · <b>GTPv1-C</b> – Gn / Gp</li>
 <li><b>PFCP</b> – N4, or Sxa / Sxb in a CUPS EPC, from the 3GPP Interface Type IEs</li>
 <li><b>Diameter</b> over TCP or SCTP by application – Gx, Gy / Ro, Gz / Rf, Rx, S6a / S6d, S13, SWm, SWx, S6b, Cx / Sh, Sy, S9</li>
 <li><b>RADIUS</b> on Gi / SGi / N6 · <b>IKEv2 / ESP</b> (SWu) · <b>SCTP</b>: S1AP, NGAP, X2AP, XnAP, F1AP, E1AP, SGsAP, NBAP</li>
 <li><b>Plain IP</b> (Gi / SGi / N6) – recognised when its addresses also appear inside GTP-U or as Framed-IP-Address in Gx or RADIUS</li></ul>
 <h3>How sure is each result?</h3><div class="trlegend">${trBadge('sure')} the protocol or explicit signalling identifies the interface<br>${trBadge('likely')} inferred – please check<br>${trBadge('manual')} assigned by you<br>${trBadge(null)} choose from the candidates</div>
 <p class="ndmuted">Formats: pcap and pcapng (also with several capture interfaces), optionally gzip-compressed. Link types: Ethernet with VLAN / QinQ / MPLS, Linux cooked (SLL / SLL2), raw IP. Your <button class="ndlink" data-nd="menu">◆ Network data</button> names the elements and settles ambiguous cases.</p>`;}
function trWhy(o){const k=trTop(o);const n=Object.keys(o).length;return k?esc(k)+(n>1?` <span class="trmore" title="${esc(Object.keys(o).filter(x=>x!==k).join('\n'))}">+${n-1}</span>`:''):'';}
function trResultHTML(){const F=TR.file,dur=F.t1>F.t0?trDur(F.t1-F.t0):'',out=[];
 out.push(`<div class="trsum"><div class="trfn" title="${esc(F.name)}">${esc(F.name)}</div><div>${trB(F.size)} · ${esc(F.fmt)}${F.gz?' · gzip':''} · ${trNum(F.pk)} packets · ${trB(F.by)}${dur?' · '+dur:''} · ${esc(F.lts.map(l=>TR_LT[l]||'link type '+l).join(', '))}</div>
  ${F.ifs.length>1?`<div class="trifs">Capture interfaces: ${F.ifs.map((I,i)=>`<span>${esc(I.name||'interface '+(i+1))} <i>${trNum(I.pk)}</i></span>`).join('')}</div>`:''}</div>`);
 if(F.cut)out.push(`<div class="trnote">The file ends in the middle of a record – it may be truncated. The part that could be read is analysed.</div>`);
 out.push(`<p class="trpriv">Read in this browser only – not uploaded, not stored, not in links or saved files.</p>`);
 const hid=TR.rows.filter(r=>!trShown(r).length),cups=hid.filter(r=>LM[r.canon]&&LM[r.canon].cups&&!state.cups),plane=TR.rows.filter(r=>trShown(r).some(id=>!linkVisible(LM[id])));
 if(cups.length)out.push(`<div class="trnote">${cups.map(r=>esc(trShortN(r.canon))).join(' and ')} exist only in the CUPS view of the EPC. <button data-ta="cups">Switch EPC to CUPS</button></div>`);
 if(plane.length)out.push(`<div class="trnote">${plane.map(r=>esc(trShortN(r.canon))).join(', ')} hidden by the plane filter in the toolbar.</div>`);
 if(!ND)out.push(`<p class="ndmuted">Load your <button class="ndlink" data-nd="menu">◆ Network data</button> to name the elements and settle ambiguous cases.</p>`);
 /* interfaces */
 out.push(`<h3>Interfaces in this trace <span class="trh">${TR.rows.length}</span></h3>`);
 if(TR.rows.length){out.push(`<table class="trt"><thead><tr><th>Interface</th><th>Protocols</th><th class="n">Packets</th><th class="n">Bytes</th><th>Evidence</th></tr></thead><tbody>`);
  TR.rows.forEach(r=>{const sh=trShown(r),id=sh[0]||r.canon,L=LM[id]||LM[r.canon],a=EM[L.a],b=EM[L.b],conf=trTop(r.conf),mix=Object.keys(r.conf).length>1;
   out.push(`<tr data-trr="${r.canon}" class="${state.trSel===r.canon?'on':''}"><td><button class="trif" data-sel="if:${id}" style="--lc:${lnColor(L)}"><span class="sw ${L.plane==='cp'?'cp':''}"></span>${esc(L.n)}</button><div class="trends">${esc(a?a.n:'')} – ${esc(b?b.n:'')}</div></td>
    <td class="trproto">${Object.keys(r.cls).sort((x,y)=>r.cls[y]-r.cls[x]).map(esc).join('<br>')}${r.plain?`<div class="trends" title="Addresses also seen inside GTP-U behind one data-network side, or as Framed-IP-Address in Gx / RADIUS">${trNum(r.plain.ue)} matched · ${trNum(Math.max(0,r.plain.ip-r.plain.ue))} other addresses</div>`:''}</td>
    <td class="n">${trNum(r.pk)}</td><td class="n">${trB(r.by)}</td><td>${trBadge(conf)}${mix?` <span class="trmore" title="${esc(Object.entries(r.conf).map(([k,v])=>(TR_CONF[k||'none']||TR_CONF.none)[1]+': '+trNum(v)+' packets').join('\n'))}">mixed</span>`:''}${r.shared?' <span class="trmore" title="The same traffic is counted on both interfaces of a combined node">shared</span>':''}<div class="trwhy">${trWhy(r.why)}</div></td></tr>`);});
  out.push('</tbody></table>');}
 else out.push('<p class="ndmuted">No mobile-network interface could be identified yet – see the decisions below.</p>');
 /* decisions */
 if(TR.groups.length){out.push(`<h3>Check and decide <span class="trh">${TR.groups.length}</span></h3><p class="ndmuted">Traffic not identified with certainty, grouped by protocol, VLAN and capture interface. A choice applies to the whole group and is forgotten when the trace is closed.</p><table class="trt trdec"><thead><tr><th>Traffic</th><th class="n">Packets</th><th>Interface</th></tr></thead><tbody>`);
  TR.groups.forEach(G=>{const man=TR.manual[G.gk],cur=man!=null?man:trTop(G.cur)||'',auto=man==null&&cur?trTop(G.cur):null,ifn=trIfName(G.ifi);
   const cand=[...G.cands].filter(c=>LM[c]);if(cur&&cur!=='none'&&!cand.includes(cur))cand.unshift(cur);
   const pl=G.plain||/GTP-U|ESP/.test(G.lbl)?'up':'cp',all=[...new Set(LINKS.filter(L=>!L.isbus&&!L.bus&&!L.rp&&(L.plane===pl||L.plane==='both')&&!cand.includes(ND_CANON[L.id]||L.id)).map(L=>ND_CANON[L.id]||L.id))].filter(c=>LM[c]&&!cand.includes(c)).sort((x,y)=>trShortN(x).localeCompare(trShortN(y)));
   const opt=c=>`<option value="${c}"${cur===c?' selected':''}>${esc(trLbl(c))}</option>`;
   out.push(`<tr><td><b>${esc(G.lbl)}</b><div class="trends">${G.vlan?'VLAN '+esc(G.vlan):'no VLAN'}${ifn?' · '+esc(ifn):''} · ${G.plain?trNum(TR.plain.find(g=>g.res.gk===G.gk).nIP)+' addresses':G.n+' address pair'+(G.n>1?'s':'')}</div>${trTop(G.why)?`<div class="trwhy">${esc(trTop(G.why))}</div>`:''}</td><td class="n">${trNum(G.pk)}</td>
    <td><select data-tg="${esc(G.gk)}" aria-label="Interface for ${esc(G.lbl)}"><option value="">${auto?'— automatic —':'— undecided —'}</option>${cand.map(opt).join('')}${all.length?`<optgroup label="Other interfaces">${all.map(opt).join('')}</optgroup>`:''}<option value="none"${cur==='none'?' selected':''}>Not a mobile-network interface</option></select>
    <div>${trBadge(man!=null?'manual':auto?'likely':null)}</div></td></tr>`);});
  out.push('</tbody></table>');}
 /* elements and addresses */
 const ends=[...TR.ends.values()].sort((a,b)=>b.pk-a.pk);
 if(ends.length){const lim=trShowAllEnds?ends.length:Math.min(ends.length,60);
  out.push(`<h3>Elements and addresses <span class="trh">${ends.length}</span></h3><table class="trt trends-t"><thead><tr><th>Element</th><th>Address</th><th>Name</th><th>Interfaces</th><th class="n">Packets</th></tr></thead><tbody>`);
  ends.slice(0,lim).forEach(e=>{const el=trTop(e.els),pl=trTop(e.pl)||'cp',hits=trNdHits(TR.nd,e.ip),nm=[];
   hits.forEach(h=>nm.push(`<span title="Network data${h.I.site?' · site '+esc(ndSiteName(h.I.site)):''}">◆ ${esc(ndInstName(h.I))}</span>`));
   (TR.names.get(e.ip)||new Map()).forEach((k,n)=>nm.push(`<span title="${esc(k)}">${esc(n)}</span>`));
   const cand=!el&&e.links.size?[...new Set([...e.links].flatMap(l=>[LM[l].a,LM[l].b]))].filter(x=>EM[x]).map(x=>EM[x].n).join(' or '):'';
   const ev=el?trElVar(el,pl):null;
   out.push(`<tr><td>${ev&&EM[ev]?`<button class="ndlink" data-sel="el:${ev}" title="${esc(e.src[el]||'')}">${esc(EM[ev].n)}</button>`:`<span class="ndmuted">${cand?esc(cand):'?'}</span>`}</td><td class="ip">${esc(e.ip)}</td><td class="trnm">${nm.join('<br>')}</td>
    <td>${esc(trLinkNames(e.links))||`<span class="ndmuted">${esc([...e.cls].join(', '))}</span>`}</td><td class="n">${trNum(e.pk)}</td></tr>`);});
  out.push('</tbody></table>');if(ends.length>60)out.push(`<p><button class="ndlink" data-ta="all">${trShowAllEnds?'Show the first 60':'Show all '+trNum(ends.length)}</button></p>`);}
 if(TR.ue.size)out.push(`<p class="ndmuted">${trNum(TR.ue.size)}${TR.ueFull?'+':''} user-plane addresses were seen inside GTP-U or as Framed-IP-Address in Gx / RADIUS. They are kept in memory only to recognise plain-IP traffic and are not listed.</p>`);
 /* not mapped */
 const nm=[];TR.other.forEach(o=>nm.push([o.lbl,o.pk,o.by,o.why]));
 TR.nonip.forEach((v,k)=>nm.push([k,v.pk,v.by,'Not IP']));TR.infra.forEach((v,k)=>nm.push([k,v.pk,v.by,'Network infrastructure protocol']));TR.unsup.forEach((v,k)=>nm.push([k,v.pk,v.by,'Link type not supported']));
 if(TR.trunc)nm.push(['Truncated packets',TR.trunc,0,'Shorter than their headers (snap length?)']);if(TR.bad)nm.push(['Malformed packets',TR.bad,0,'']);if(TR.fragOrph)nm.push(['IP fragments without their first fragment',TR.fragOrph,0,'']);
 if(nm.length){out.push(`<h3>Not mapped</h3><table class="trt"><thead><tr><th>Traffic</th><th class="n">Packets</th><th class="n">Bytes</th></tr></thead><tbody>`);
  nm.sort((a,b)=>b[1]-a[1]).forEach(([l,p,b,w])=>out.push(`<tr><td>${esc(l)}${w?`<div class="trends">${esc(w)}</div>`:''}</td><td class="n">${trNum(p)}</td><td class="n">${b?trB(b):''}</td></tr>`));out.push('</tbody></table>');}
 out.push(trDetailsHTML());
 out.push(`<p class="ndmuted trlim">Not decoded: Diameter over TLS (port 5868) or DTLS, HTTP/2 SBI, SIP, IPsec payloads, zstd / lz4-compressed pcapng. The first 16 kB of each Diameter message are decoded; user-plane payload is counted, never kept. No subscriber identities (IMSI, MSISDN, user names) are read.</p>`);
 return out.join('');}
function trDetailsHTML(){const by=new Map();TR.flows.forEach(f=>{const k=trClsN(f);let e=by.get(k);if(!e)by.set(k,e={k,pk:0,by:0,n:0,m:{},rej:0,err:0,g:0,h85:0,h84:0,ipcan:{},rat:{},rat3:{},scx:{},ft:{},ty:{}});
  e.pk+=f.pk;e.by+=f.by;e.n++;for(const m in f.m)trTally(e.m,m,f.m[m]);const x=f.x;e.rej+=x.rej||0;e.err+=x.err||0;e.g+=x.g||0;e.h85+=x.h85||0;e.h84+=x.h84||0;
  for(const q in x.ipcan||{})trTally(e.ipcan,TR_IPCAN[q]||q,x.ipcan[q]);for(const q in x.ft||{})trTally(e.ft,TR_FTEID_N[q]||q,x.ft[q]);for(const q in x.ty||{})trTally(e.ty,TR_PF3[q]?TR_PF3[q][0]:q,x.ty[q]);
  for(const q in x.scx||{})trTally(e.scx,TR_SCX[q]?TR_SCX[q][0]:q,x.scx[q]);
  for(const q in x.rat||{})trTally(f.cls==='radius'?e.rat3:e.rat,(f.cls==='radius'?TR_RAT3[q]:TR_RATD[q])||q,x.rat[q]);});
 TR.plain.forEach(g=>{let e=by.get('Plain IP');if(!e)by.set('Plain IP',e={k:'Plain IP',pk:0,by:0,n:0,m:{},rej:0,err:0,g:0,h85:0,h84:0,ipcan:{},rat:{},rat3:{},scx:{},ft:{},ty:{}});e.pk+=g.pk;e.by+=g.by;e.n++;for(const q in g.pr)trTally(e.m,q,g.pr[q]);});
 if(!by.size)return '';
 const list=(o,lim)=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,lim||12).map(([k,v])=>`${esc(k)} <i>${trNum(v)}</i>`).join(' · ');
 return `<details class="trdet"><summary>Protocol details</summary>${[...by.values()].sort((a,b)=>b.pk-a.pk).map(e=>`<div class="trdp"><b>${esc(e.k)}</b> <span class="ndmuted">${trNum(e.pk)} packets · ${trB(e.by)} · ${e.n} ${e.k==='Plain IP'?'group':'flow'}${e.n>1?'s':''}</span>
  ${Object.keys(e.m).length?`<div>${list(e.m)}</div>`:''}${e.g?`<div>G-PDU <i>${trNum(e.g)}</i>${e.h85?` · PDU Session Container <i>${trNum(e.h85)}</i>`:''}${e.h84?` · NR RAN Container <i>${trNum(e.h84)}</i>`:''}</div>`:''}
  ${e.rej?`<div class="trbad">Rejected responses: ${trNum(e.rej)}</div>`:''}${e.err?`<div class="trbad">Answers with Result-Code ≥ 3000: ${trNum(e.err)}</div>`:''}
  ${Object.keys(e.ft).length?`<div>F-TEID types: ${list(e.ft,20)}</div>`:''}${Object.keys(e.ty).length?`<div>3GPP Interface Types: ${list(e.ty,20)}</div>`:''}
  ${Object.keys(e.ipcan).length?`<div>IP-CAN-Type: ${list(e.ipcan)}</div>`:''}${Object.keys(e.rat).length?`<div>RAT-Type: ${list(e.rat)}</div>`:''}${Object.keys(e.rat3).length?`<div>3GPP-RAT-Type: ${list(e.rat3)}</div>`:''}${Object.keys(e.scx).length?`<div>Service-Context-Id: ${list(e.scx)}</div>`:''}</div>`).join('')}</details>`;}

/* sections in the element and interface panels */
function trBackHTML(){return state.trReturn&&TR?`<div class="pdnav"><button data-ta="back">← Back to trace analysis</button><span></span></div>`:'';}
function trIfHTML(L){if(!TR)return '';const c=ndCanon(L),r=TR.rows.find(x=>x.canon===c);if(!r)return '';const conf=trTop(r.conf),C=LM[c];
 const side={};r.ends.forEach((el,ip)=>{const k=el||'?';(side[k]||(side[k]=[])).push(ip);});
 return `<h3 class="trh3">In the trace <span>${esc(TR.file.name)}</span></h3><div class="trbox"><div>${trNum(r.pk)} packets · ${trB(r.by)} · ${trBadge(conf)}</div><div class="trwhy">${trWhy(r.why)}</div>
  ${Object.entries(side).map(([el,ips])=>`<div class="trside"><b>${esc(el==='?'?(C?EM[C.a].n+' or '+EM[C.b].n:'?'):(EM[el]?EM[el].n:el))}</b> ${ips.slice(0,12).map(ip=>`<code>${esc(ip)}</code>`).join(' ')}${ips.length>12?` <i>+${ips.length-12}</i>`:''}</div>`).join('')}
  ${r.plain?`<div class="ndmuted">Plain IP: ${trNum(r.plain.ip)} addresses, ${trNum(r.plain.ue)} of them also seen inside GTP-U or in Gx / RADIUS</div>`:''}</div>`;}
function trElHTML(E){if(!TR)return '';const m=el=>el===E.id||(ND_ELALIAS[E.id]||[]).includes(el)||(ND_ELALIAS[el]||[]).includes(E.id);
 const list=[...TR.ends.values()].filter(e=>{const el=trTop(e.els);return el&&m(el);}).sort((a,b)=>b.pk-a.pk);if(!list.length)return '';
 return `<h3 class="trh3">In the trace <span>${esc(TR.file.name)}</span></h3><div class="trbox"><table class="trt"><tbody>${list.slice(0,20).map(e=>`<tr><td class="ip">${esc(e.ip)}</td><td>${esc(trLinkNames(e.links))}</td><td class="trnm">${[...(TR.names.get(e.ip)||new Map()).keys()].map(esc).join('<br>')}</td><td class="n">${trNum(e.pk)}</td></tr>`).join('')}</tbody></table>${list.length>20?`<div class="ndmuted">+${list.length-20} more in the trace panel</div>`:''}</div>`;}
function trCtaHTML(){return TR?`<div class="pdcta trcta"><button data-ta="back">⇅ Trace analysis</button><span>${esc(TR.file.name)} – ${TR.rows.length} interface${TR.rows.length===1?'':'s'} found</span></div>`
 :`<div class="pdcta trcta"><button data-ta="open">⇅ Trace analysis</button><span>Open a pcap / pcapng capture and see its interfaces and elements on the map – read in this browser, never uploaded</span></div>`;}

/* ---------- events ---------- */
panel.addEventListener('click',ev=>{const b=ev.target.closest('[data-ta]');
 if(b){ev.stopPropagation();const a=b.dataset.ta;
  if(a==='open')trPick();else if(a==='close')trClose();else if(a==='leave')trLeave();
  else if(a==='cancel'){if(trJob)trJob.cancel=true;trJob=null;renderPanel();}
  else if(a==='back'){state.sel=null;if(TR&&!trSavedVB)trSavedVB={...vb};trOpenPanel();}
  else if(a==='cups'){const c=document.querySelector('[data-cups="1"]');if(c)c.click();}
  else if(a==='all'){trShowAllEnds=!trShowAllEnds;trRender();}
  return;}
 if(!state.trMode)return;const tr=ev.target.closest('tr[data-trr]');
 if(tr&&!ev.target.closest('button,select,a,code')){const c=tr.dataset.trr;state.trSel=state.trSel===c?null:c;apply();trRender();const R=TR&&TR.rows.find(r=>r.canon===c);if(state.trSel&&R)trFitTo(trShown(R),560,420);}});
panel.addEventListener('change',ev=>{const s=ev.target.closest('select[data-tg]');if(!s||!TR)return;const gk=s.dataset.tg;if(s.value==='')delete TR.manual[gk];else TR.manual[gk]=s.value;trResolve();apply();trRender();});
panel.addEventListener('mouseover',ev=>{if(!state.trMode||!TR)return;const tr=ev.target.closest('tr[data-trr]'),c=tr?tr.dataset.trr:null;if(c!==state.trHover){state.trHover=c;apply();}});
panel.addEventListener('mouseleave',()=>{if(state.trHover){state.trHover=null;apply();}});
$('#trbtn').addEventListener('click',()=>{if(state.trMode)trLeave();else trOpenPanel();});
TR_ON=true;

function sizeMain(){document.documentElement.style.setProperty('--hdr',($('#hdr').offsetHeight+$('#toolbar').offsetHeight)+'px');}
window.addEventListener('resize',sizeMain);
$('#ver').textContent='v'+VERSION;buildChips();buildLegend();if(innerWidth<700){$('#legend').classList.add('mini');$('#leghide').textContent='Legend ▸';}drawZones();drawBus();drawNodes();drawLinks();sizeMain();ndIndex();apply();renderPanel();readHash();ndInit();
window.addEventListener('hashchange',readHash);
</script>
